name: GNU Pairwise Borda v32

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-pairwise-borda-v32.yml
      - scripts/train-mzand-gnu-v32-pairwise.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

env:
  BASE_RUN_ID: '31472166884'
  V31_RUN_ID: '31540081816'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Download frozen v31 non-pristine train-tune shards
        uses: actions/download-artifact@v4
        with:
          pattern: gnu-v31-shard-*
          path: v31shards
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.V31_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download original sealed split baseline
        uses: actions/download-artifact@v4
        with:
          name: gnu-v15-prepare
          path: prep
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download verified true GNU rollout evidence
        uses: actions/download-artifact@v4
        with:
          name: gnu-v15-rollout-13
          path: rollout13
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Reconstruct v31 corpus without new dev labels
        shell: bash
        run: |
          set -euxo pipefail
          cp prep/gnu-teacher-v15.jsonl .
          cp prep/gnu-v15-selected.jsonl .
          python - <<'PY'
          import json,re
          from pathlib import Path
          selected=[json.loads(x) for x in Path('gnu-v15-selected.jsonl').read_text().splitlines() if x.strip()]
          byidx={int(r['sourceRowIndex']):r for r in selected}; ev=[]; ok=[]
          for p in sorted(Path('rollout13').rglob('*.txt')):
              if not p.stem.isdigit(): continue
              src=int(p.stem); r=byidx.get(src)
              if r is None: continue
              assert r['sourceSplit'] in ('train','tune') and r.get('pristine') is False and r.get('xgLabelUsed') is False and r.get('devUsed') is not True
              pick=int(r['pickedRank']); text=p.read_text(errors='replace')
              vals={int(rank):float(eq) for rank,eq in re.findall(r'^\s*(\d+)\.\s+Rollout\s+.+?Eq\.:\s+([+-]?\d+\.\d+)',text,re.M)}
              if 1 in vals and pick in vals:
                  ev.append({'sourceRowIndex':src,'sourceSplit':r['sourceSplit'],'pickedRank':pick,'trials':int(r['effectiveRolloutTrials']),'teacherTopEquity':vals[1],'studentPickedEquity':vals[pick]}); ok.append(r)
          if len(ev)!=2: raise SystemExit(f'expected 2 verified rollouts, got {len(ev)}')
          Path('base-evidence.json').write_text(json.dumps(ev)); Path('base-selected.jsonl').write_text(''.join(json.dumps(r)+'\n' for r in ok))
          PY
          GNU_V15_BATCH_IN=gnu-teacher-v15.jsonl GNU_V15_SELECTED=base-selected.jsonl GNU_V15_EVIDENCE=base-evidence.json GNU_V15_BATCH_OUT=base-refined.jsonl python scripts/apply-gnu-rollout-refinement-v15.py
          python - <<'PY'
          import json
          from pathlib import Path
          base=[json.loads(x) for x in Path('base-refined.jsonl').read_text().splitlines() if x.strip()]
          new=[]
          for p in sorted(Path('v31shards').glob('gnu-v31-*.jsonl')):
              new += [json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          for r in new:
              assert r.get('split') in ('train','tune')
              assert r.get('pristine') is False
              assert r.get('xgLabel') is False
          seen={(r.get('positionId'),tuple(r.get('dice') or []),r.get('split')) for r in base}; added=[]
          for r in new:
              k=(r.get('positionId'),tuple(r.get('dice') or []),r.get('split'))
              if k not in seen: seen.add(k); added.append(r)
          out=base+added
          Path('gnu-teacher-v32-scaled.jsonl').write_text(''.join(json.dumps(r,separators=(',',':'))+'\n' for r in out))
          dev=sum(r.get('split')=='dev' for r in out)
          Path('gnu-v32-corpus-report.txt').write_text('\n'.join([
              'CORPUS: GNU_V32_RECONSTRUCTED_V31',f'BASE_ROWS: {len(base)}',f'REUSED_V31_UNIQUE_ROWS: {len(added)}',f'FINAL_ROWS: {len(out)}',
              f'FINAL_DEV_ROWS: {dev}','NEW_DEV_ROWS_ADDED: 0','PRISTINE_DATA_USED: False','XG_LABELS_USED: False'])+'\n')
          if len(added)<50000: raise SystemExit(f'v31 reconstruction unexpectedly small: {len(added)}')
          PY
      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy joblib xgboost scikit-learn
      - name: Train direct pairwise top-1 comparator
        env:
          GNU_V32_BATCH_OUT: gnu-teacher-v32-scaled.jsonl
        run: python scripts/train-mzand-gnu-v32-pairwise.py
      - name: Enforce sealed-dev and provenance gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v32-pairwise-report.txt
          grep -q '^DEV_ROWS_MINED: 0$' mzand-gnu-v32-pairwise-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v32-pairwise-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v32-pairwise-report.txt
          grep -q '^NEW_DEV_ROWS_ADDED: 0$' gnu-v32-corpus-report.txt
          cat gnu-v32-corpus-report.txt
          cat mzand-gnu-v32-pairwise-report.txt
      - name: Publish measured held-out result
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          t1=$(awk '/^DEV_STRICT_TOP1:/{print $2}' mzand-gnu-v32-pairwise-report.txt); t2=$(awk '/^DEV_TOP2:/{print $2}' mzand-gnu-v32-pairwise-report.txt); loss=$(awk '/^DEV_MEAN_EQUITY_LOSS:/{print $2}' mzand-gnu-v32-pairwise-report.txt); n=$(awk '/^DEV_POSITION_SAMPLES:/{print $2}' mzand-gnu-v32-pairwise-report.txt)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-v32/heldout\",\"description\":\"Top1=$t1 Top2=$t2 loss=$loss n=$n XG=false pristine=false\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-pairwise-borda-v32
          path: |
            gnu-v32-corpus-report.txt
            mzand-gnu-v32-pairwise-report.txt
            mzand-gnu-v32-pairwise-report.json
            mzand-gnu-v32-pairwise.joblib
          if-no-files-found: ignore
          retention-days: 30

# v32 reuses only the already-verified v31 train/tune expansion and original sealed dev.
# No XG or pristine labels are eligible before verified GNU held-out Top-1 >=95%.
