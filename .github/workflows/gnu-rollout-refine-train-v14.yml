name: GNU Rollout Refine Train v14 Parallel

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-rollout-refine-train-v14.yml
      - scripts/train-mzand-gnu-v14.py
      - scripts/apply-gnu-rollout-refinement-v13.py
      - scripts/mine-gnu-v8-top1-errors.py
      - scripts/gnu-teacher-v6.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GNU_V6_GAMES: '8'
  GNU_V6_TURNS: '10'
  GNU_V6_MAX_HINTS: '16'
  GNU_V6_SEED_BASE: '1420260811'
  GNU_V6_HARD_MARGIN: '0.03'
  GNU_V6_ROLLOUT_MARGIN: '0.012'

jobs:
  label:
    name: GNU v14 label shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install GNU native prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate non-pristine GNU labels
        shell: bash
        env:
          GNU_V6_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euxo pipefail
          export GNU_V6_GAME_OFFSET="$((GNU_V6_SHARD_INDEX*8))"
          node scripts/gnu-teacher-v6.mjs
          ! grep -q 'PRISTINE_DATA_USED: True' "gnu-teacher-v6-${GNU_V6_SHARD_INDEX}-report.txt"
          ! grep -q 'XG_LABELS_USED: True' "gnu-teacher-v6-${GNU_V6_SHARD_INDEX}-report.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v14-label-${{ matrix.shard }}
          path: |
            gnu-teacher-v6-${{ matrix.shard }}.jsonl
            gnu-teacher-v6-${{ matrix.shard }}-report.txt
          retention-days: 14

  prepare:
    needs: label
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          pattern: gnu-v14-label-*
          path: labels
          merge-multiple: true
      - name: Build corpus and mine Top-1 errors
        shell: bash
        run: |
          set -euxo pipefail
          test "$(ls labels/gnu-teacher-v6-*.jsonl | wc -l)" -eq 8
          cat labels/gnu-teacher-v6-*.jsonl > gnu-teacher-v14.jsonl
          cat labels/gnu-teacher-v6-*-report.txt > gnu-v14-shard-reports.txt
          ! grep -q 'PRISTINE_DATA_USED: True' gnu-v14-shard-reports.txt
          ! grep -q 'XG_LABELS_USED: True' gnu-v14-shard-reports.txt
          python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
          GNU_V8_BATCH_OUT=gnu-teacher-v14.jsonl GNU_V8_ROLLOUT_QUEUE=gnu-v14-top1-rollout-queue.jsonl python scripts/mine-gnu-v8-top1-errors.py
      - name: Select sixteen safe high-priority Top-1 errors
        shell: python
        run: |
          import json
          from pathlib import Path
          q=[json.loads(x) for x in Path('gnu-v14-top1-rollout-queue.jsonl').read_text().splitlines() if x.strip()]
          safe=[r for r in q if r.get('sourceSplit') in ('train','tune') and r.get('pristine') is False and r.get('xgLabelUsed') is False and r.get('positionId') and r.get('dice')]
          rank2=[r for r in safe if r.get('pickedRank')==2]
          rest=[r for r in safe if r.get('pickedRank')!=2]
          p=(rank2+rest)[:16]
          if len(p)<16: raise SystemExit(f'need 16 safe Top-1 errors, got {len(p)}')
          for i,r in enumerate(p):
              r['rolloutShard']=i%8
              suggested=int(r.get('suggestedRolloutTrials') or 1296)
              r['effectiveRolloutTrials']=5184 if suggested>=5184 else 1296
          Path('gnu-v14-selected.jsonl').write_text(''.join(json.dumps(r,separators=(',',':'))+'\n' for r in p))
          print('SELECTED',len(p),'RANK2',sum(r.get('pickedRank')==2 for r in p),'DEV_SELECTED',sum(r.get('sourceSplit')=='dev' for r in p))
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v14-prepare
          path: |
            gnu-teacher-v14.jsonl
            gnu-v14-shard-reports.txt
            gnu-v8-top1-rollout-queue-report.txt
            gnu-v14-top1-rollout-queue.jsonl
            gnu-v14-selected.jsonl
          retention-days: 14

  rollout:
    needs: prepare
    name: GNU v14 rollout shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gnu-v14-prepare
      - name: Install GNU Backgammon CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnubg
      - name: True-rollout assigned Top-1 errors
        shell: bash
        env:
          ROLLOUT_SHARD: ${{ matrix.shard }}
        run: |
          set -euxo pipefail
          mkdir -p v14-rollouts
          python - "$ROLLOUT_SHARD" <<'PY'
          import json,sys
          from pathlib import Path
          shard=int(sys.argv[1])
          rows=[json.loads(x) for x in Path('gnu-v14-selected.jsonl').read_text().splitlines() if x.strip()]
          Path('v14-rollouts/shard.jsonl').write_text(''.join(json.dumps(r,separators=(',',':'))+'\n' for r in rows if int(r['rolloutShard'])==shard))
          PY
          i=0
          while IFS= read -r row; do
            i=$((i+1))
            src=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["sourceRowIndex"])' "$row")
            pos=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["positionId"])' "$row")
            d1=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["dice"][0])' "$row")
            d2=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["dice"][1])' "$row")
            trials=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["effectiveRolloutTrials"])' "$row")
            for rank in 1 2; do
              cat > "v14-rollouts/${src}-r${rank}.commands" <<EOF
          set lang C
          set confirm new off
          set confirm save off
          set display off
          set sound enable off
          set evaluation chequerplay evaluation plies 3
          set evaluation cubedecision evaluation plies 3
          set rollout trials $trials
          set rollout quasirandom on
          set rollout seed $((20261400+ROLLOUT_SHARD*100+i*10+rank))
          set rollout limit enable off
          set rollout jsd stop off
          new game
          set board $pos
          set dice $d1 $d2
          clear hint
          hint 16
          cmark move set rollout $rank
          analyse rollout move
          export position text v14-rollouts/${src}-r${rank}.txt
          quit
          EOF
              timeout 14400 gnubg -t -r -c "v14-rollouts/${src}-r${rank}.commands" > "v14-rollouts/${src}-r${rank}.console" 2>&1
              test -s "v14-rollouts/${src}-r${rank}.txt"
              ! grep -Eq 'No moves marked|There must be a game in progress|No position specified' "v14-rollouts/${src}-r${rank}.console"
            done
          done < v14-rollouts/shard.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-v14-rollout-${{ matrix.shard }}
          path: v14-rollouts/
          if-no-files-found: ignore
          retention-days: 14

  train:
    needs: rollout
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: gnu-v14-prepare
          path: prep
      - uses: actions/download-artifact@v4
        with:
          pattern: gnu-v14-rollout-*
          path: rollouts
          merge-multiple: true
      - name: Parse rollout evidence and refine corpus
        shell: bash
        run: |
          set -euxo pipefail
          cp prep/gnu-teacher-v14.jsonl .
          cp prep/gnu-v14-selected.jsonl .
          cp prep/gnu-v14-shard-reports.txt .
          cp prep/gnu-v8-top1-rollout-queue-report.txt .
          python - <<'PY'
          import json,re
          from pathlib import Path
          selected=[json.loads(x) for x in Path('gnu-v14-selected.jsonl').read_text().splitlines() if x.strip()]
          out=[]
          for row in selected:
              src=int(row['sourceRowIndex']); vals={}
              for rank in (1,2):
                  hits=list(Path('rollouts').rglob(f'{src}-r{rank}.txt'))
                  if len(hits)!=1: raise SystemExit(f'expected one rollout text src={src} rank={rank}, got {len(hits)}')
                  t=hits[0].read_text()
                  ms=re.findall(r'^\s*\d+\.\s+Rollout\s+.+?Eq\.:\s+([+-]?\d+\.\d+)',t,re.M)
                  if not ms: raise SystemExit(f'no rollout equity src={src} rank={rank}')
                  vals[rank]=float(ms[0])
              out.append({'sourceRowIndex':src,'sourceSplit':row['sourceSplit'],'trials':int(row['effectiveRolloutTrials']),'rank1Equity':vals[1],'rank2Equity':vals[2]})
          Path('gnu-v14-rollout-evidence.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          GNU_V13_BATCH_IN=gnu-teacher-v14.jsonl GNU_V13_SELECTED=gnu-v14-selected.jsonl GNU_V13_EVIDENCE=gnu-v14-rollout-evidence.json GNU_V13_BATCH_OUT=gnu-teacher-v14-refined.jsonl python scripts/apply-gnu-rollout-refinement-v13.py
          mv gnu-v13-refinement-report.txt gnu-v14-refinement-report.txt
      - name: Train adaptive rollout-refined candidate
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
          GNU_V14_BATCH_OUT=gnu-teacher-v14-refined.jsonl python scripts/train-mzand-gnu-v14.py
      - name: Enforce provenance and publish held-out evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          grep -q '^DEV_ROWS_REFINED: 0$' gnu-v14-refinement-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v14-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v14-report.txt
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v14-report.txt
          top1=$(awk '/^DEV_STRICT_TOP1:/{print $2}' mzand-gnu-v14-report.txt)
          top2=$(awk '/^DEV_TOP2:/{print $2}' mzand-gnu-v14-report.txt)
          loss=$(awk '/^DEV_MEAN_EQUITY_LOSS:/{print $2}' mzand-gnu-v14-report.txt)
          hard=$(awk '/^DEV_HARD_STRICT_TOP1:/{print $2}' mzand-gnu-v14-report.txt)
          n=$(awk '/^DEV_POSITION_SAMPLES:/{print $2}' mzand-gnu-v14-report.txt)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-v14/heldout\",\"description\":\"Top1=$top1 Top2=$top2 loss=$loss hard=$hard n=$n\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-rollout-refine-train-v14
          path: |
            gnu-v14-shard-reports.txt
            gnu-v8-top1-rollout-queue-report.txt
            gnu-v14-selected.jsonl
            gnu-v14-rollout-evidence.json
            gnu-v14-refinement-report.txt
            mzand-gnu-v14.joblib
            mzand-gnu-v14-report.txt
            mzand-gnu-v14-report.json
          if-no-files-found: ignore
          retention-days: 14
