name: XG Cube MET Runtime Probe V1

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-cube-met-runtime-probe-v1.yml
      - tools/xg-cube-met-probe/CAPTURE_CUBE_MET.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "XG_EXE=$e" | Out-File $env:GITHUB_ENV -Append

      - name: Capture cube and MET runtime evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-cube-met-probe-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if(-not $env:RUNNER_TEMP){$env:RUNNER_TEMP=$out}
          & "$env:GITHUB_WORKSPACE\tools\xg-cube-met-probe\CAPTURE_CUBE_MET.ps1" -ExePath $env:XG_EXE -OutDir $out

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-cube-met-runtime-probe-v1
          path: |
            xg-cube-met-probe-out/**
            xg-cube-met-*.png
            xg-cube-met-*-ui.txt
            xg-cube-met-*-processes.txt
          if-no-files-found: warn
          retention-days: 14
