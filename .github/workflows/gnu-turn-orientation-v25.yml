name: GNU Turn Orientation v25

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-turn-orientation-v25.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  turn-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Backgammon
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnubg
      - name: Evaluate same board/dice with turn 0 and turn 1
        shell: bash
        run: |
          set -euxo pipefail
          for turn in 0 1; do
            cat > "turn-${turn}.commands" <<EOF
          set lang C
          set confirm new off
          set confirm save off
          set display off
          set sound enable off
          set player 0 human
          set player 1 human
          set evaluation chequerplay evaluation plies 3
          set evaluation cubedecision evaluation plies 3
          new game
          set board mHPMBSDg88TBAA
          set turn $turn
          set dice 5 5
          clear hint
          hint 4
          quit
          EOF
            timeout 300 gnubg -t -r -c "turn-${turn}.commands" > "turn-${turn}.console" 2>&1
            test -s "turn-${turn}.console"
          done
      - name: Identify teacher-consistent turn
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          expected=['18/13(2) 6/1*(2)','8/3(2) 6/1*(2)']
          matches=[]
          report=[]
          for turn in (0,1):
              text=Path(f'turn-{turn}.console').read_text(errors='replace')
              found=[m in text for m in expected]
              report.append(f'TURN_{turn}_HAS_RANK1_REFERENCE: {found[0]}')
              report.append(f'TURN_{turn}_HAS_RANK2_REFERENCE: {found[1]}')
              if all(found): matches.append(turn)
              # retain compact hint-looking lines for audit
              hint_lines=[ln for ln in text.splitlines() if re.search(r'\d+\s*/\s*\d+',ln)]
              Path(f'turn-{turn}-hint-lines.txt').write_text('\n'.join(hint_lines)+'\n')
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one teacher-consistent turn, got {matches}')
          report += [
              f'TEACHER_CONSISTENT_TURN: {matches[0]}',
              'TURN_FIXED_BEFORE_DICE: True',
              'DEV_DATA_USED: False',
              'PRISTINE_DATA_USED: False',
              'XG_LABELS_USED: False',
          ]
          Path('gnu-turn-orientation-v25-report.txt').write_text('\n'.join(report)+'\n')
          print(Path('gnu-turn-orientation-v25-report.txt').read_text())
          PY
      - name: Publish turn status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          turn=$(awk '/^TEACHER_CONSISTENT_TURN:/{print $2}' gnu-turn-orientation-v25-report.txt)
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"gnu-v25/turn-orientation\",\"description\":\"teacher-consistent on-roll turn=$turn\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-turn-orientation-v25
          path: |
            turn-*.commands
            turn-*.console
            turn-*-hint-lines.txt
            gnu-turn-orientation-v25-report.txt
          if-no-files-found: ignore
          retention-days: 14
