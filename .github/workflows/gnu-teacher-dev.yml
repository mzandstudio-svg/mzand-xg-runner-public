name: GNU Teacher Development v1

# CI trigger: validate the headless GNU teacher bridge on main.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gnu-teacher-dev.yml
      - scripts/gnu-teacher-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  gnu-teacher-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish GNU runner id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          post() {
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
              -d "{\"state\":\"$2\",\"context\":\"$1\",\"description\":\"$3\"}" >/dev/null
          }
          post "gnu-teacher-v1/run-$GITHUB_RUN_ID" success "workflow run id=$GITHUB_RUN_ID"
          post "gnu-teacher-v1/job" pending "GNU teacher job running"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GNU teacher bridge
        shell: bash
        run: |
          set -euxo pipefail
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate GNU development labels
        shell: bash
        env:
          GNU_MAX_HINTS: '5'
        run: node scripts/gnu-teacher-smoke.mjs
      - name: Validate label count
        shell: bash
        run: |
          set -euo pipefail
          test -s gnu-teacher-samples.jsonl
          test "$(wc -l < gnu-teacher-samples.jsonl)" -eq 21
          grep -q 'ROLLS_COMPLETED: 21' gnu-teacher-report.txt
          grep -q 'PRISTINE_DATA_USED: False' gnu-teacher-report.txt
      - name: Upload GNU teacher evidence
        uses: actions/upload-artifact@v7
        with:
          name: gnu-teacher-dev-v1
          path: |
            gnu-teacher-samples.jsonl
            gnu-teacher-report.txt
          retention-days: 14
      - name: Publish GNU final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"gnu-teacher-v1/job\",\"description\":\"job=$JOB_STATUS\"}" >/dev/null
