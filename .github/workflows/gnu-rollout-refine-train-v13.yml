name: GNU Rollout Refine Train v13

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-rollout-refine-train-v13.yml
      - scripts/apply-gnu-rollout-refinement-v13.py
      - scripts/train-mzand-gnu-v13.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GNU_V6_GAMES: '8'
  GNU_V6_TURNS: '10'
  GNU_V6_MAX_HINTS: '16'
  GNU_V6_SEED_BASE: '1320260810'
  GNU_V6_HARD_MARGIN: '0.03'
  GNU_V6_ROLLOUT_MARGIN: '0.012'

jobs:
  refine-train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Publish run marker
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"pending\",\"context\":\"gnu-v13/run-$GITHUB_RUN_ID\",\"description\":\"GNU rollout-refine retrain started\"}" >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Install GNU and ML dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnubg build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
          python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
      - name: Generate strictly non-pristine corpus
        shell: bash
        run: |
          set -euxo pipefail
          : > gnu-teacher-v13.jsonl; : > gnu-v13-shard-reports.txt
          for shard in 0 1 2 3 4 5 6 7; do
            export GNU_V6_SHARD_INDEX="$shard" GNU_V6_GAME_OFFSET="$((shard*8))"
            node scripts/gnu-teacher-v6.mjs
            cat "gnu-teacher-v6-${shard}.jsonl" >> gnu-teacher-v13.jsonl
            cat "gnu-teacher-v6-${shard}-report.txt" >> gnu-v13-shard-reports.txt
          done
          ! grep -q 'PRISTINE_DATA_USED: True' gnu-v13-shard-reports.txt
          ! grep -q 'XG_LABELS_USED: True' gnu-v13-shard-reports.txt
      - name: Mine Top-1 errors from train/tune only
        env:
          GNU_V8_BATCH_OUT: gnu-teacher-v13.jsonl
          GNU_V8_ROLLOUT_QUEUE: gnu-v13-top1-rollout-queue.jsonl
        run: python scripts/mine-gnu-v8-top1-errors.py
      - name: Select four highest-priority rank-2 errors
        shell: python
        run: |
          import json
          from pathlib import Path
          q=[json.loads(x) for x in Path('gnu-v13-top1-rollout-queue.jsonl').read_text().splitlines() if x.strip()]
          p=[r for r in q if r.get('sourceSplit') in ('train','tune') and r.get('pristine') is False and r.get('xgLabelUsed') is False and r.get('pickedRank')==2 and r.get('positionId') and r.get('dice')][:4]
          if len(p)<4: raise SystemExit(f'need 4 safe rank2 errors, got {len(p)}')
          Path('gnu-v13-selected.jsonl').write_text(''.join(json.dumps(r,separators=(',',':'))+'\n' for r in p))
          print('SELECTED:',len(p),'DEV_SELECTED: 0')
      - name: Rollout original rank-1 and rank-2 separately at 1296 trials
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p v13-rollouts
          i=0
          while IFS= read -r row; do
            i=$((i+1)); pos=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["positionId"])' "$row"); d1=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["dice"][0])' "$row"); d2=$(python -c 'import json,sys;print(json.loads(sys.argv[1])["dice"][1])' "$row")
            for rank in 1 2; do
              cat > "v13-rollouts/${i}-r${rank}.commands" <<EOF
          set lang C
          set confirm new off
          set confirm save off
          set display off
          set sound enable off
          set evaluation chequerplay evaluation plies 3
          set evaluation cubedecision evaluation plies 3
          set rollout trials 1296
          set rollout quasirandom on
          set rollout seed $((20261300+i*10+rank))
          set rollout limit enable off
          set rollout jsd stop off
          new game
          set board $pos
          set dice $d1 $d2
          clear hint
          hint 16
          cmark move set rollout $rank
          analyse rollout move
          export position text v13-rollouts/${i}-r${rank}.txt
          quit
          EOF
              timeout 7200 gnubg -t -r -c "v13-rollouts/${i}-r${rank}.commands" > "v13-rollouts/${i}-r${rank}.console" 2>&1
              test -s "v13-rollouts/${i}-r${rank}.txt"
              ! grep -Eq 'No moves marked|There must be a game in progress|No position specified' "v13-rollouts/${i}-r${rank}.console"
            done
          done < gnu-v13-selected.jsonl
      - name: Parse separate rollout equities
        shell: python
        run: |
          import json,re
          from pathlib import Path
          s=[json.loads(x) for x in Path('gnu-v13-selected.jsonl').read_text().splitlines() if x.strip()]; out=[]
          for i,row in enumerate(s,1):
            vals={}
            for rank in (1,2):
              t=Path(f'v13-rollouts/{i}-r{rank}.txt').read_text()
              ms=re.findall(r'^\s*\d+\.\s+Rollout\s+.+?Eq\.:\s+([+-]?\d+\.\d+)',t,re.M)
              if not ms: raise SystemExit(f'no rollout equity i={i} rank={rank}')
              vals[rank]=float(ms[0])
            out.append({'sourceRowIndex':row['sourceRowIndex'],'sourceSplit':row['sourceSplit'],'trials':1296,'rank1Equity':vals[1],'rank2Equity':vals[2]})
          Path('gnu-v13-rollout-evidence.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
      - name: Apply rollout refinements
        run: python scripts/apply-gnu-rollout-refinement-v13.py
      - name: Train rollout-refined candidate and evaluate sealed dev
        run: python scripts/train-mzand-gnu-v13.py
      - name: Enforce provenance and publish measured evidence
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euxo pipefail
          grep -q '^DEV_ROWS_REFINED: 0$' gnu-v13-refinement-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v13-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v13-report.txt
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v13-report.txt
          top1=$(awk '/^DEV_STRICT_TOP1:/{print $2}' mzand-gnu-v13-report.txt); top2=$(awk '/^DEV_TOP2:/{print $2}' mzand-gnu-v13-report.txt); n=$(awk '/^DEV_POSITION_SAMPLES:/{print $2}' mzand-gnu-v13-report.txt)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-v13/heldout\",\"description\":\"GNU rollout-refined held-out Top1=$top1 Top2=$top2 n=$n\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-rollout-refine-train-v13
          path: |
            gnu-v13-shard-reports.txt
            gnu-v8-top1-rollout-queue-report.txt
            gnu-v13-selected.jsonl
            gnu-v13-rollout-evidence.json
            gnu-v13-refinement-report.txt
            mzand-gnu-v13.joblib
            mzand-gnu-v13-report.txt
            mzand-gnu-v13-report.json
            v13-rollouts/
          if-no-files-found: ignore
          retention-days: 14

# CI trigger: 2026-08-11 rerun full strictly non-pristine rollout-refined held-out gate.
