name: R37 XG Cubeful Internal Trace

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths:
      - .github/workflows/r37-xg-cubeful-internal-trace.yml
      - scripts/r37-trace-xg-cubeful-internals.py
      - scripts/r35-proven-startup.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official XG2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $exe)){throw "XG executable missing: $exe"}
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append

      - name: Prepare trace dependency
        shell: powershell
        run: python -m pip install pyautogui

      - name: Reach proven ready XG2 position
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1

      - name: Trace exact live/dead endpoint internals
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xg=Get-Process eXtremeGammon2 -ErrorAction Stop | Select-Object -First 1
          python ./scripts/r37-trace-xg-cubeful-internals.py $xg.Id ./r37-cubeful-trace.txt
          Get-Content ./r37-cubeful-trace.txt

      - name: Upload R37 trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r37-xg-cubeful-internal-trace
          path: |
            r37-cubeful-trace.txt
            r35-proven-startup-report.txt
            r35-proven-startup-summary.txt
          if-no-files-found: warn
          retention-days: 14

