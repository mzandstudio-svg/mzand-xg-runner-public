name: XG NN OffBand Runtime V1

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-nn-offband-runtime-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case_id: A_OFF1_S1, xgid: 'XGID=--B-bBC-C---bCa--c-db---B-:0:0:1:62:0:0:3:0:10'}
          - {case_id: A_OFF1_S0, xgid: 'XGID=-dCCDD-----------a-fca----:1:-1:1:52:0:0:3:0:10'}
          - {case_id: A_OFF2_S0, xgid: 'XGID=-bDCCCaa---------a-eda----:1:-1:1:22:0:0:3:0:10'}
          - {case_id: A_OFF3_S0, xgid: 'XGID=-dBDDB--a--------cbba--b--:1:-1:1:41:0:0:3:0:10'}
          - {case_id: A_OFF4_S1, xgid: 'XGID=----BABBC--------A--bcccD-:1:1:1:32:0:0:3:0:10'}
          - {case_id: A_OFF7_S0, xgid: 'XGID=-bbBBBB-----------abbbbb--:1:-1:1:11:0:0:3:0:10'}
          - {case_id: C_OFF5_S1, xgid: 'XGID=-BBA-CBB-------------dABf-:1:1:1:32:0:0:3:0:10'}
          - {case_id: C_OFF10_S1, xgid: 'XGID=--B--BBCB--------A---b-cC-:1:1:1:42:0:0:3:0:10'}
          - {case_id: C_OFF2_S0_OFF10_S1, xgid: 'XGID=aBBCBBB-----------------d-:1:1:1:63:0:0:3:0:10'}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install current official XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "install failed $($p.ExitCode)"}
          $root='C:\Program Files (x86)\eXtreme Gammon 2';$e=Join-Path $root 'eXtremeGammon2.exe';$m=Join-Path $root 'eXtremeGammon v2.dat'
          if(-not(Test-Path $e)){throw 'XG exe missing'};if(-not(Test-Path $m)){throw 'XG model missing'}
          "XG_EXE=$e"|Out-File $env:GITHUB_ENV -Append;"XG_MODEL=$m"|Out-File $env:GITHUB_ENV -Append
      - name: Create isolated case
        shell: powershell
        env:
          CASE_ID: ${{ matrix.case_id }}
          CASE_XGID: ${{ matrix.xgid }}
        run: |
          @([pscustomobject]@{case_id=$env:CASE_ID;xgid=$env:CASE_XGID}) | ConvertTo-Json | Out-File "$env:RUNNER_TEMP\case.json" -Encoding utf8
      - name: Capture live network input
        id: cap
        continue-on-error: true
        shell: powershell
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-offband-out'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          & "$env:GITHUB_WORKSPACE\tools\xg-nn-allnet-input-v1\RUN_ALLNET.ps1" -ExePath $env:XG_EXE -ModelPath $env:XG_MODEL -CasesPath "$env:RUNNER_TEMP\case.json" -OutDir $out
      - name: Print active off-band inputs
        if: always()
        shell: powershell
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-offband-out'
          Get-ChildItem $out -Recurse -Filter allnet.json -ErrorAction SilentlyContinue | ForEach-Object {
            $j=Get-Content $_.FullName -Raw|ConvertFrom-Json
            foreach($r in $j.records){
              if(($r.output_values|Where-Object{[math]::Abs([double]$_)-gt 1e-12}).Count -gt 0){
                "ACTIVE net=$($r.network) offpair0=$($r.input_values[200]),$($r.input_values[201]) offpair1=$($r.input_values[202]),$($r.input_values[203]) offpair2=$($r.input_values[204]),$($r.input_values[205])"
              }
            }
          }
          if(Test-Path (Join-Path $out 'capture-status.jsonl')){Get-Content (Join-Path $out 'capture-status.jsonl')}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-nn-${{ matrix.case_id }}-offband-v1
          path: xg-offband-out/**
          if-no-files-found: error
          retention-days: 14
