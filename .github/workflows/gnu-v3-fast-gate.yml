name: GNU MZand v3 Fast Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gnu-v3-fast-gate.yml
      - scripts/train-mzand-gnu-v3-fast.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish fast gate run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"pending\",\"context\":\"gnu-v3-fast/run-$GITHUB_RUN_ID\",\"description\":\"frozen v3 gate started\"}" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download completed v3 GNU shards
        uses: actions/download-artifact@v4
        with:
          pattern: gnu-v3-shard-*
          path: shards
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '31380236754'
      - name: Combine v3 corpus
        shell: bash
        run: |
          set -euxo pipefail
          test "$(ls shards/gnu-teacher-batch-v3-*.jsonl | wc -l)" -eq 8
          cat shards/gnu-teacher-batch-v3-*.jsonl > gnu-teacher-batch-v3.jsonl
          echo "TOTAL_POSITIONS: $(wc -l < gnu-teacher-batch-v3.jsonl)" > gnu-v3-fast-corpus.txt
          echo 'PRISTINE_DATA_USED: False' >> gnu-v3-fast-corpus.txt
      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
      - name: Train frozen architecture and open held-out dev gate
        env:
          GNU_BATCH_OUT: gnu-teacher-batch-v3.jsonl
        run: python scripts/train-mzand-gnu-v3-fast.py
      - name: Publish measured gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metric=$(grep '^DEV_STRICT_TOP1:' mzand-gnu-v3-fast-report.txt | awk '{print $2}')
          n=$(grep '^DEV_POSITION_SAMPLES:' mzand-gnu-v3-fast-report.txt | awk '{print $2}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-v3-fast/evidence\",\"description\":\"held-out Top5-rerank Top-1=$metric n=$n\"}" >/dev/null
      - name: Upload fast gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnu-mzand-v3-fast-gate
          path: |
            gnu-v3-fast-corpus.txt
            mzand-gnu-v3-fast.joblib
            mzand-gnu-v3-fast-report.json
            mzand-gnu-v3-fast-report.txt
          if-no-files-found: ignore
          retention-days: 14
