name: GNU MZand Train Development v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gnu-train-dev-v2.yml
      - scripts/gnu-teacher-batch-v2.mjs
      - scripts/train-mzand-gnu-v2.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  gnu-train-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish GNU v2 run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          post() {
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
              -d "{\"state\":\"$2\",\"context\":\"$1\",\"description\":\"$3\"}" >/dev/null
          }
          post "gnu-train-v2/run-$GITHUB_RUN_ID" success "workflow run id=$GITHUB_RUN_ID"
          post "gnu-train-v2/job" pending "scaled GNU distillation running"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GNU and ML prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
          python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
      - name: Generate scaled board-based GNU labels
        shell: bash
        env:
          GNU_BATCH_GAMES: '96'
          GNU_TURNS_PER_GAME: '14'
          GNU_MAX_HINTS: '5'
          GNU_SEED_BASE: '9284173'
          GNU_HARD_MARGIN: '0.02'
        run: node scripts/gnu-teacher-batch-v2.mjs
      - name: Train and select MZand GNU v2
        shell: bash
        run: python scripts/train-mzand-gnu-v2.py
      - name: Validate separation and evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s gnu-teacher-batch-v2.jsonl
          test -s mzand-gnu-v2.joblib
          grep -q 'BOARD_BASED_HINTS: True' gnu-teacher-batch-v2-report.txt
          grep -q 'SPLIT_UNIT: WHOLE_GAME' gnu-teacher-batch-v2-report.txt
          grep -q 'DEV_USED_FOR_MODEL_SELECTION: False' gnu-teacher-batch-v2-report.txt
          grep -q 'PRISTINE_DATA_USED: False' gnu-teacher-batch-v2-report.txt
          grep -q 'SELECTION_SPLIT: TUNE_ONLY' mzand-gnu-v2-report.txt
          grep -q 'DEV_USED_FOR_MODEL_SELECTION: False' mzand-gnu-v2-report.txt
          grep -q 'XG_LABELS_USED: False' mzand-gnu-v2-report.txt
          grep -q 'GNU_RANK_EQUITY_AS_INPUT: False' mzand-gnu-v2-report.txt
      - name: Publish measured v2 dev metric
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metric=$(grep '^DEV_STRICT_TOP1:' mzand-gnu-v2-report.txt | awk '{print $2}')
          samples=$(grep '^DEV_POSITION_SAMPLES:' mzand-gnu-v2-report.txt | awk '{print $2}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
            -d "{\"state\":\"success\",\"context\":\"gnu-train-v2/evidence\",\"description\":\"held-out dev Top-1=$metric n=$samples\"}" >/dev/null
      - name: Upload GNU v2 training evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnu-mzand-train-dev-v2
          path: |
            gnu-teacher-batch-v2.jsonl
            gnu-teacher-batch-v2-report.txt
            mzand-gnu-v2.joblib
            mzand-gnu-v2-report.json
            mzand-gnu-v2-report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish GNU v2 final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"gnu-train-v2/job\",\"description\":\"job=$JOB_STATUS\"}" >/dev/null
