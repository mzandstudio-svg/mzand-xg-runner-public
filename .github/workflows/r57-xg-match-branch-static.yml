name: R57 XG Match Branch Static Recovery

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths:
      - .github/workflows/r57-xg-match-branch-static.yml
      - scripts/r57-xg-match-branch-static.py
      - scripts/r35-proven-startup.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official XG2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $exe)){throw "XG executable missing: $exe"}
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append
      - name: Install capstone
        shell: powershell
        run: python -m pip install capstone
      - name: Reach proven unpacked XG2 instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1
      - name: Recover Branch B / match-MET static path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xg=Get-Process eXtremeGammon2 -ErrorAction Stop | Select-Object -First 1
          python ./scripts/r57-xg-match-branch-static.py --pid $xg.Id --outdir ./r57-match-branch
          Get-Content ./r57-match-branch/r57-summary.txt
          Get-Content ./r57-match-branch/r57-raw-windows.tsv
          Get-Content ./r57-match-branch/r57-match-branch-xrefs.tsv
      - name: Upload R57 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r57-xg-match-branch-static
          path: |
            r57-match-branch/*
            r35-proven-startup-summary.txt
          if-no-files-found: warn
          retention-days: 14
