name: XG NN Active Access V1

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-nn-active-access-v1.yml
      - tools/xg-nn-active-access-v1/**
      - tools/xg-nn-input-runtime-probe-v1/hook_nn.py
      - tools/xg-nn-dispatch-probe-v2/CAPTURE_XG_NN_DISPATCH_V2.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Frida
        shell: powershell
        run: python -m pip install --disable-pip-version-check --quiet frida
      - name: Install current official XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $log=Join-Path $env:GITHUB_WORKSPACE 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$log") -Wait -PassThru
          if($p.ExitCode-ne0){throw "install failed $($p.ExitCode)"}
          $root='C:\Program Files (x86)\eXtreme Gammon 2'
          $e=Join-Path $root 'eXtremeGammon2.exe';$m=Join-Path $root 'eXtremeGammon v2.dat'
          if(-not(Test-Path $e)){throw 'XG exe missing'}
          if(-not(Test-Path $m)){throw 'XG model missing'}
          "XG_EXE=$e"|Out-File $env:GITHUB_ENV -Append
          "XG_MODEL=$m"|Out-File $env:GITHUB_ENV -Append
          "XG_EXE_SHA256=$((Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Append
      - name: Start XGR++ then attach NN access instrumentation
        id: cap
        continue-on-error: true
        shell: powershell
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-nn-active-access-out'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          & "$env:GITHUB_WORKSPACE\tools\xg-nn-active-access-v1\RUN_ACTIVE_ACCESS.ps1" -ExePath $env:XG_EXE -ModelPath $env:XG_MODEL -CasesPath "$env:GITHUB_WORKSPACE\tools\xg-nn-active-access-v1\cases.json" -OutDir $out
      - name: Summarize
        if: always()
        shell: powershell
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-nn-active-access-out';$hook=Join-Path $out 'hook'
          @('XG_NN_ACTIVE_ACCESS_V1',"XG_EXE_SHA256=$env:XG_EXE_SHA256","CAPTURE_OUTCOME=${{ steps.cap.outcome }}",'ORDER=verified XGID -> start XGR++ -> attach Frida','LICENSE=normal trial only; no activation bypass','PURPOSE=runtime interoperability parity only','TRAINING_ELIGIBLE=False')|Out-File (Join-Path $out 'RUN_REPORT.txt') -Encoding utf8
          if(Test-Path (Join-Path $hook 'events.jsonl')){Get-Content (Join-Path $hook 'events.jsonl')}
          if(Test-Path (Join-Path $hook 'ACCESS')){Get-Content (Join-Path $hook 'ACCESS')}
          if(Test-Path (Join-Path $hook 'DONE')){'HOOK_DONE=True'}
          if(Test-Path (Join-Path $hook 'FATAL')){Get-Content (Join-Path $hook 'FATAL')}
          if(Test-Path (Join-Path $out 'capture-status.jsonl')){Get-Content (Join-Path $out 'capture-status.jsonl')}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-nn-active-access-v1
          path: |
            xg-nn-active-access-out/**
            xg-install.log
          if-no-files-found: error
          retention-days: 14
