name: GNU MZand Train Development v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gnu-train-dev-v1.yml
      - scripts/gnu-teacher-batch.mjs
      - scripts/train-mzand-gnu-v1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  gnu-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish GNU train run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          post() {
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
              -d "{\"state\":\"$2\",\"context\":\"$1\",\"description\":\"$3\"}" >/dev/null
          }
          post "gnu-train-v1/run-$GITHUB_RUN_ID" success "workflow run id=$GITHUB_RUN_ID"
          post "gnu-train-v1/job" pending "GNU labeling and MZand training running"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native and ML prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
          python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib
      - name: Generate board-based GNU labels
        shell: bash
        env:
          GNU_BATCH_GAMES: '12'
          GNU_TURNS_PER_GAME: '10'
          GNU_MAX_HINTS: '5'
          GNU_SEED_BASE: '731991'
        run: node scripts/gnu-teacher-batch.mjs
      - name: Train and evaluate MZand GNU v1
        shell: bash
        run: python scripts/train-mzand-gnu-v1.py
      - name: Validate development separation and evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s gnu-teacher-batch.jsonl
          test -s mzand-gnu-v1.joblib
          grep -q 'BOARD_BASED_HINTS: True' gnu-teacher-batch-report.txt
          grep -q 'PRISTINE_DATA_USED: False' gnu-teacher-batch-report.txt
          grep -q 'PRISTINE_DATA_USED: False' mzand-gnu-v1-report.txt
          grep -q 'GNU_RANK_EQUITY_AS_INPUT: False' mzand-gnu-v1-report.txt
          train=$(grep '^TRAIN_SAMPLES:' mzand-gnu-v1-report.txt | awk '{print $2}')
          dev=$(grep '^DEV_SAMPLES:' mzand-gnu-v1-report.txt | awk '{print $2}')
          test "$train" -gt 0
          test "$dev" -gt 0
      - name: Publish measured dev metric
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metric=$(grep '^DEV_STRICT_TOP1:' mzand-gnu-v1-report.txt | awk '{print $2}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
            -d "{\"state\":\"success\",\"context\":\"gnu-train-v1/evidence\",\"description\":\"GNU-topN rerank dev Top-1=$metric\"}" >/dev/null
      - name: Upload GNU training evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnu-mzand-train-dev-v1
          path: |
            gnu-teacher-batch.jsonl
            gnu-teacher-batch-report.txt
            mzand-gnu-v1.joblib
            mzand-gnu-v1-report.json
            mzand-gnu-v1-report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish GNU train final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"gnu-train-v1/job\",\"description\":\"job=$JOB_STATUS\"}" >/dev/null
