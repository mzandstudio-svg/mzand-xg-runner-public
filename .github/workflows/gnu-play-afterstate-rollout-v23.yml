name: GNU Played Afterstate Rollout v23

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-play-afterstate-rollout-v23.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  rollout-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Backgammon
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnubg
      - name: Play each candidate then rollout resulting current position
        shell: bash
        run: |
          set -euxo pipefail
          moves=('18/13(2) 6/1*(2)' '8/3(2) 6/1*(2)')
          for idx in 0 1; do
            rank=$((idx+1))
            move="${moves[$idx]}"
            cat > "played-rollout-${rank}.commands" <<EOF
          set lang C
          set confirm new off
          set confirm save off
          set display off
          set sound enable off
          set player 0 human
          set player 1 human
          set rollout trials 36
          set rollout quasirandom on
          set rollout seed $((20262300+rank))
          set rollout limit enable off
          set rollout jsd stop off
          new game
          set board mHPMBSDg88TBAA
          set dice 5 5
          $move
          show board
          rollout
          show board
          quit
          EOF
            timeout 600 gnubg -t -r -c "played-rollout-${rank}.commands" > "played-rollout-${rank}.console" 2>&1
            test -s "played-rollout-${rank}.console"
            ! grep -Eqi 'Illegal move|Unknown command|You cannot move|not a legal move|No position specified|No game in progress' "played-rollout-${rank}.console"
            grep -q 'Rollout done' "played-rollout-${rank}.console"
          done
      - name: Extract diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          report=[]
          ids={}
          for rank in (1,2):
              text=Path(f'played-rollout-{rank}.console').read_text(errors='replace')
              pids=re.findall(r'(?im)^\s*GNU Backgammon\s+Position ID:\s*(\S+)',text)
              # original board appears first; after candidate move appears later.
              after=[x for x in pids if x!='mHPMBSDg88TBAA' and x!='4HPwATDgc/ABMA']
              if not after:
                  raise SystemExit(f'no real afterstate Position ID for rank {rank}; pids={pids}')
              ids[rank]=after[0]
              # Preserve all equity-like lines for next-stage parser design.
              lines=[ln for ln in text.splitlines() if re.search(r'(?i)equity|cubeful|cubeless|rollout|\+0\.|-0\.',ln)]
              Path(f'played-rollout-{rank}-equity-lines.txt').write_text('\n'.join(lines)+'\n')
              report += [
                  f'RANK_{rank}_AFTERSTATE_POSITION_ID: {ids[rank]}',
                  f'RANK_{rank}_ROLLOUT_DONE: True',
                  f'RANK_{rank}_EQUITY_DIAGNOSTIC_LINES: {len(lines)}',
              ]
          if ids[1]==ids[2]:
              raise SystemExit(f'afterstates identical: {ids}')
          report += [
              'CANDIDATE_MOVE_PLAYBACK: True',
              'CURRENT_POSITION_ROLLOUT_EXECUTED: True',
              'TRIALS_PER_CANDIDATE: 36',
              'CMARK_USED: False',
              'SET_BOARD_EQUALS_RANK_USED: False',
              'DEV_DATA_USED: False',
              'PRISTINE_DATA_USED: False',
              'XG_LABELS_USED: False',
          ]
          Path('gnu-play-afterstate-rollout-v23-report.txt').write_text('\n'.join(report)+'\n')
          print(Path('gnu-play-afterstate-rollout-v23-report.txt').read_text())
          PY
      - name: Publish diagnostic status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"gnu-v23/played-afterstate-rollout","description":"candidate move playback plus real current-position rollout executed"}' >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-play-afterstate-rollout-v23
          path: |
            played-rollout-*.commands
            played-rollout-*.console
            played-rollout-*-equity-lines.txt
            gnu-play-afterstate-rollout-v23-report.txt
          if-no-files-found: ignore
          retention-days: 14
