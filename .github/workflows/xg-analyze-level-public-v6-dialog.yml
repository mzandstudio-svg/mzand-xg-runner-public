name: XG Analyze Level Public v6 Dialog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/xg-analyze-level-public-v6-dialog.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  capture-dialog:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Publish runner and run id
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){
            $payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress
            $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
          }
          Post 'xg-public-v6/runner-start' 'pending' 'Public Windows runner started v6'
          Post "xg-public-v6/run-$env:GITHUB_RUN_ID" 'success' "workflow run id=$env:GITHUB_RUN_ID"

      - uses: actions/checkout@v4

      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append

      - name: Reach proven XGID position
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-analyze-win32-v3.ps1

      - name: Open exact Set Analyze Level row and capture dialog
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class V6N {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetSubMenu(IntPtr hMenu, int nPos);
            [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr hMenu);
            [DllImport("user32.dll")] public static extern bool GetMenuItemRect(IntPtr hWnd, IntPtr hMenu, uint uItem, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f,uint x,uint y,uint d,UIntPtr e);
          }
          "@
          function ClickXY([int]$x,[int]$y){[V6N]::SetCursorPos($x,$y)|Out-Null;Start-Sleep -Milliseconds 150;[V6N]::mouse_event(2,0,0,0,[UIntPtr]::Zero);Start-Sleep -Milliseconds 80;[V6N]::mouse_event(4,0,0,0,[UIntPtr]::Zero)}
          function Shot([string]$p){$b=[System.Windows.Forms.SystemInformation]::VirtualScreen;$bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height;$g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bmp.Save($p,[System.Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()}
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}

          $xg=Get-Process eXtremeGammon2 -ErrorAction Stop|Select-Object -First 1
          $xg.Refresh()
          if($xg.MainWindowTitle-notlike'*Position.xgp*'){throw "Expected Position.xgp, got [$($xg.MainWindowTitle)]"}
          Post 'xg-public-v6/xgid' 'success' 'Position.xgp ready'
          $hwnd=[IntPtr]$xg.MainWindowHandle
          $menu=[V6N]::GetMenu($hwnd)
          if($menu-eq[IntPtr]::Zero){throw 'GetMenu returned zero'}
          $top=New-Object V6N+RECT
          if(-not[V6N]::GetMenuItemRect($hwnd,$menu,4,[ref]$top)){throw 'Analyze top rect failed'}
          [V6N]::SetForegroundWindow($hwnd)|Out-Null
          Start-Sleep -Milliseconds 250
          ClickXY ([int](($top.Left+$top.Right)/2)) ([int](($top.Top+$top.Bottom)/2))
          Start-Sleep 1
          Shot "$env:GITHUB_WORKSPACE\xg-v6-analyze-menu-open.png"

          $sub=[V6N]::GetSubMenu($menu,4)
          if($sub-eq[IntPtr]::Zero){throw 'Analyze submenu zero'}
          $count=[V6N]::GetMenuItemCount($sub)
          $targetY=$top.Bottom+107
          $dump=New-Object 'System.Collections.Generic.List[string]'
          $targetIndex=-1;$targetRect=$null
          for($i=0;$i-lt$count;$i++){
            $r=New-Object V6N+RECT
            if([V6N]::GetMenuItemRect($hwnd,$sub,[uint32]$i,[ref]$r)){
              $dump.Add("Index=[$i] Rect=[$($r.Left),$($r.Top),$($r.Right),$($r.Bottom)] CenterY=[$([int](($r.Top+$r.Bottom)/2))]")
              if($targetY-ge$r.Top-and$targetY-lt$r.Bottom){$targetIndex=$i;$targetRect=$r}
            }
          }
          $dump|Out-File "$env:GITHUB_WORKSPACE\xg-v6-analyze-submenu-rects.txt" -Encoding utf8
          "TARGET_EVIDENCE_Y: $targetY"|Out-File "$env:GITHUB_WORKSPACE\xg-v6-report.txt"
          "SET_ANALYZE_LEVEL_GEOMETRY_INDEX: $targetIndex"|Out-File "$env:GITHUB_WORKSPACE\xg-v6-report.txt" -Append
          if($targetIndex-lt0-or$null-eq$targetRect){throw 'Evidence target Y did not map to one Analyze submenu row'}
          $cx=[int](($targetRect.Left+$targetRect.Right)/2);$cy=[int](($targetRect.Top+$targetRect.Bottom)/2)
          "SET_ANALYZE_LEVEL_CLICK_POINT: $cx,$cy"|Out-File "$env:GITHUB_WORKSPACE\xg-v6-report.txt" -Append
          ClickXY $cx $cy
          Start-Sleep 2
          Shot "$env:GITHUB_WORKSPACE\xg-v6-set-analyze-level-dialog.png"

          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $tops=$root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $lines=New-Object 'System.Collections.Generic.List[string]'
          $candidate=0
          foreach($e in $tops){try{if($e.Current.ProcessId-eq$xg.Id){$r=$e.Current.BoundingRectangle;$lines.Add("Name=[$($e.Current.Name)] Class=[$($e.Current.ClassName)] Handle=[$($e.Current.NativeWindowHandle)] Rect=[$($r.X),$($r.Y),$($r.Width),$($r.Height)]");if(([IntPtr]$e.Current.NativeWindowHandle)-ne$hwnd){$candidate++}}}catch{}}
          $lines|Out-File "$env:GITHUB_WORKSPACE\xg-v6-top-windows.txt" -Encoding utf8
          "DIALOG_CANDIDATES: $candidate"|Out-File "$env:GITHUB_WORKSPACE\xg-v6-report.txt" -Append
          'ANALYSIS_STARTED: False'|Out-File "$env:GITHUB_WORKSPACE\xg-v6-report.txt" -Append
          'XGRPP_SELECTION_CHANGED: False'|Out-File "$env:GITHUB_WORKSPACE\xg-v6-report.txt" -Append
          'ROLLOUT_STARTED: False'|Out-File "$env:GITHUB_WORKSPACE\xg-v6-report.txt" -Append
          Post 'xg-public-v6/dialog-captured' $(if($candidate-gt0){'success'}else{'failure'}) "dialog candidates=$candidate"
          Get-Process eXtremeGammon2,test3d -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload v6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-analyze-level-public-v6-dialog
          path: |
            xg-install.log
            xg-public-v3-report.txt
            xg-v6-report.txt
            xg-v6-analyze-menu-open.png
            xg-v6-set-analyze-level-dialog.png
            xg-v6-analyze-submenu-rects.txt
            xg-v6-top-windows.txt
            xg-*.png
            xg-*-ui.txt
            xg-*-processes.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          $ok=Test-Path "$env:GITHUB_WORKSPACE\xg-v6-set-analyze-level-dialog.png"
          $state=if($ok){'success'}else{'failure'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $payload=@{state=$state;context='xg-public-v6/artifact';description="Set Analyze Level dialog captured=$ok"}|ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
          $payload=@{state='success';context='xg-public-v6/runner-start';description='runner reached final status'}|ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
