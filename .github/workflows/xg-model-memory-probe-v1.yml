name: XG Model Memory Probe V1

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-model-memory-probe-v1.yml
      - tools/xg-model-memory-probe-v1/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install current official XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $log=Join-Path $env:GITHUB_WORKSPACE 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$log") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "install failed $($p.ExitCode)"}
          $root='C:\Program Files (x86)\eXtreme Gammon 2'
          $e=Join-Path $root 'eXtremeGammon2.exe'; $m=Join-Path $root 'eXtremeGammon v2.dat'
          if(-not(Test-Path $e)){throw 'XG exe missing'}; if(-not(Test-Path $m)){throw 'XG model missing'}
          "XG_EXE=$e"|Out-File $env:GITHUB_ENV -Append; "XG_MODEL=$m"|Out-File $env:GITHUB_ENV -Append
      - name: Probe loaded model memory
        id: probe
        continue-on-error: true
        shell: powershell
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-model-memory-out';New-Item -ItemType Directory -Force -Path $out|Out-Null
          & "$env:GITHUB_WORKSPACE\tools\xg-model-memory-probe-v1\PROBE_XG_MODEL_MEMORY.ps1" -ExePath $env:XG_EXE -ModelPath $env:XG_MODEL -OutDir $out
      - name: Report
        if: always()
        shell: powershell
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-model-memory-out'
          @('XG_MODEL_MEMORY_PROBE_V1',"PROBE_OUTCOME=${{ steps.probe.outcome }}",'PURPOSE=runtime differential parity only','TRAINING_ELIGIBLE=False') | Out-File (Join-Path $out 'RUN_REPORT.txt') -Encoding utf8
          if(Test-Path (Join-Path $out 'memory-scan.txt')){Get-Content (Join-Path $out 'memory-scan.txt')}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-model-memory-probe-v1
          path: |
            xg-model-memory-out/**
            xg-install.log
          if-no-files-found: error
          retention-days: 14
