name: GNU MZand v6 3-ply Huge Bootstrap

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-train-dev-v6.yml
      - scripts/gnu-teacher-v6.mjs
      - scripts/train-mzand-gnu-v6.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GNU_V6_GAMES: '4'
  GNU_V6_TURNS: '8'
  GNU_V6_MAX_HINTS: '16'
  GNU_V6_SEED_BASE: '620260810'
  GNU_V6_HARD_MARGIN: '0.03'
  GNU_V6_ROLLOUT_MARGIN: '0.012'

jobs:
  label:
    name: GNU v6 3-ply shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, offset: 0 }
          - { shard: 1, offset: 4 }
          - { shard: 2, offset: 8 }
          - { shard: 3, offset: 12 }
          - { shard: 4, offset: 16 }
          - { shard: 5, offset: 20 }
          - { shard: 6, offset: 24 }
          - { shard: 7, offset: 28 }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Publish v6 run marker
        if: matrix.shard == 0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"pending\",\"context\":\"gnu-v6-bootstrap/run-$GITHUB_RUN_ID\",\"description\":\"3-ply Huge GNU labeling started\"}" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GNU native prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate GNU 3-ply Huge all-dice teacher labels
        shell: bash
        env:
          GNU_V6_SHARD_INDEX: ${{ matrix.shard }}
          GNU_V6_GAME_OFFSET: ${{ matrix.offset }}
        run: node scripts/gnu-teacher-v6.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v6-shard-${{ matrix.shard }}
          path: |
            gnu-teacher-v6-${{ matrix.shard }}.jsonl
            gnu-teacher-v6-${{ matrix.shard }}-report.txt
          retention-days: 14

  train:
    needs: label
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Publish v6 training marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"pending\",\"context\":\"gnu-v6-bootstrap/train\",\"description\":\"hybrid rank/equity training\"}" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gnu-v6-shard-*
          path: shards
          merge-multiple: true
      - name: Combine v6 teacher corpus and verify provenance
        shell: bash
        run: |
          set -euxo pipefail
          test "$(ls shards/gnu-teacher-v6-*.jsonl | wc -l)" -eq 8
          cat shards/gnu-teacher-v6-*.jsonl > gnu-teacher-v6.jsonl
          cat shards/gnu-teacher-v6-*-report.txt > gnu-v6-shard-reports.txt
          grep -q 'GNU_EVAL_PLIES: 3' gnu-v6-shard-reports.txt
          grep -q 'GNU_MOVE_FILTER: HUGE' gnu-v6-shard-reports.txt
          if grep -q 'XG_LABELS_USED: True' gnu-v6-shard-reports.txt; then exit 1; fi
          if grep -q 'PRISTINE_DATA_USED: True' gnu-v6-shard-reports.txt; then exit 1; fi
          echo "TOTAL_LABELS: $(wc -l < gnu-teacher-v6.jsonl)" > gnu-v6-corpus-report.txt
          echo 'TEACHER_STAGE: GNU_3PLY_HUGE_BOOTSTRAP' >> gnu-v6-corpus-report.txt
          echo 'TEACHER_ROLLOUT_EXECUTED: False' >> gnu-v6-corpus-report.txt
          echo 'PRISTINE_DATA_USED: False' >> gnu-v6-corpus-report.txt
          echo 'XG_LABELS_USED: False' >> gnu-v6-corpus-report.txt
      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
      - name: Train v6 hybrid rank plus equity bootstrap
        env:
          GNU_V6_BATCH_OUT: gnu-teacher-v6.jsonl
        run: python scripts/train-mzand-gnu-v6.py
      - name: Enforce evidence/provenance gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^TEACHER_ROLLOUT_EXECUTED: False$' mzand-gnu-v6-report.txt
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v6-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v6-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v6-report.txt
      - name: Publish v6 evidence status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metric=$(grep '^DEV_STRICT_TOP1:' mzand-gnu-v6-report.txt | awk '{print $2}')
          n=$(grep '^DEV_POSITION_SAMPLES:' mzand-gnu-v6-report.txt | awk '{print $2}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-v6-bootstrap/evidence\",\"description\":\"held-out Top-1=$metric n=$n\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-mzand-v6-bootstrap-evidence
          path: |
            gnu-v6-corpus-report.txt
            gnu-v6-shard-reports.txt
            mzand-gnu-v6.joblib
            mzand-gnu-v6-report.json
            mzand-gnu-v6-report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish v6 final job status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; [ "$JOB_STATUS" = success ] && state=success
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"$state\",\"context\":\"gnu-v6-bootstrap/train\",\"description\":\"job=$JOB_STATUS\"}" >/dev/null
