name: GNU MZand v7 Scaled Hard Mining

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-train-dev-v7.yml
      - scripts/gnu-teacher-v6.mjs
      - scripts/train-mzand-gnu-v7.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GNU_V6_GAMES: '8'
  GNU_V6_TURNS: '10'
  GNU_V6_MAX_HINTS: '16'
  GNU_V6_SEED_BASE: '720260810'
  GNU_V6_HARD_MARGIN: '0.03'
  GNU_V6_ROLLOUT_MARGIN: '0.012'

jobs:
  label:
    name: GNU v7 3-ply shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, offset: 0 }
          - { shard: 1, offset: 8 }
          - { shard: 2, offset: 16 }
          - { shard: 3, offset: 24 }
          - { shard: 4, offset: 32 }
          - { shard: 5, offset: 40 }
          - { shard: 6, offset: 48 }
          - { shard: 7, offset: 56 }
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Publish v7 run marker
        if: matrix.shard == 0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"pending\",\"context\":\"gnu-train-v7/run-$GITHUB_RUN_ID\",\"description\":\"scaled 3-ply GNU hard mining started\"}" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GNU native prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate scaled GNU 3-ply Huge all-dice labels
        env:
          GNU_V6_SHARD_INDEX: ${{ matrix.shard }}
          GNU_V6_GAME_OFFSET: ${{ matrix.offset }}
        run: node scripts/gnu-teacher-v6.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v7-shard-${{ matrix.shard }}
          path: |
            gnu-teacher-v6-${{ matrix.shard }}.jsonl
            gnu-teacher-v6-${{ matrix.shard }}-report.txt
          retention-days: 14

  train:
    needs: label
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gnu-v7-shard-*
          path: shards
          merge-multiple: true
      - name: Combine corpus and verify provenance
        shell: bash
        run: |
          set -euxo pipefail
          test "$(ls shards/gnu-teacher-v6-*.jsonl | wc -l)" -eq 8
          cat shards/gnu-teacher-v6-*.jsonl > gnu-teacher-v7.jsonl
          cat shards/gnu-teacher-v6-*-report.txt > gnu-v7-shard-reports.txt
          grep -q 'GNU_EVAL_PLIES: 3' gnu-v7-shard-reports.txt
          grep -q 'GNU_MOVE_FILTER: HUGE' gnu-v7-shard-reports.txt
          ! grep -q 'PRISTINE_DATA_USED: True' gnu-v7-shard-reports.txt
          ! grep -q 'XG_LABELS_USED: True' gnu-v7-shard-reports.txt
          echo "TOTAL_LABELS: $(wc -l < gnu-teacher-v7.jsonl)" > gnu-v7-corpus-report.txt
          echo 'TEACHER_STAGE: GNU_3PLY_HUGE_SCALED_HARD_MINING' >> gnu-v7-corpus-report.txt
          echo 'TEACHER_ROLLOUT_EXECUTED: False' >> gnu-v7-corpus-report.txt
          echo 'PRISTINE_DATA_USED: False' >> gnu-v7-corpus-report.txt
          echo 'XG_LABELS_USED: False' >> gnu-v7-corpus-report.txt
      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
      - name: Train disagreement-mined rank plus equity model
        env:
          GNU_V7_BATCH_OUT: gnu-teacher-v7.jsonl
        run: python scripts/train-mzand-gnu-v7.py
      - name: Enforce held-out and provenance gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v7-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v7-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v7-report.txt
          grep -q '^TEACHER_ROLLOUT_EXECUTED: False$' mzand-gnu-v7-report.txt
      - name: Publish v7 evidence status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metric=$(grep '^DEV_STRICT_TOP1:' mzand-gnu-v7-report.txt | awk '{print $2}')
          n=$(grep '^DEV_POSITION_SAMPLES:' mzand-gnu-v7-report.txt | awk '{print $2}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-train-v7/evidence\",\"description\":\"held-out GNU Top-1=$metric n=$n\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-mzand-v7-evidence
          path: |
            gnu-v7-corpus-report.txt
            gnu-v7-shard-reports.txt
            mzand-gnu-v7.joblib
            mzand-gnu-v7-report.json
            mzand-gnu-v7-report.txt
          if-no-files-found: ignore
          retention-days: 14
