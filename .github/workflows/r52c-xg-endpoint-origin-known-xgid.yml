name: R52c XG Endpoint Origin Known XGID

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths:
      - .github/workflows/r52c-xg-endpoint-origin-known-xgid.yml
      - scripts/r52-xg-endpoint-origin-trace.py
      - scripts/r52c-xg-endpoint-origin-external.py
      - scripts/r52b-send-analyze-double.py
      - scripts/xg-reach-xgid.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-known-xgid:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official XG2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $exe)){throw "XG executable missing: $exe"}
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append

      - name: Install disassembler
        shell: powershell
        run: python -m pip install capstone

      - name: Reach proven known XGID position
        shell: powershell
        run: ./scripts/xg-reach-xgid.ps1

      - name: Trace exact endpoint origin on known XGID
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xg=Get-Process eXtremeGammon2 -ErrorAction Stop | Select-Object -First 1
          $out=Join-Path $env:GITHUB_WORKSPACE 'r52c-trace-stdout.txt'
          $err=Join-Path $env:GITHUB_WORKSPACE 'r52c-trace-stderr.txt'
          $args=@('./scripts/r52c-xg-endpoint-origin-external.py','--pid',"$($xg.Id)",'--outdir','./r52c-endpoint-origin')
          $p=Start-Process python -ArgumentList $args -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 3
          python ./scripts/r52b-send-analyze-double.py $xg.Id
          try { Wait-Process -Id $p.Id -Timeout 120 -ErrorAction Stop }
          catch { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'R52c trace watchdog timeout' }
          $p.Refresh()
          if(Test-Path $out){Get-Content $out}
          if(Test-Path $err){Get-Content $err}
          if($p.ExitCode-ne0){throw "R52c trace failed rc=$($p.ExitCode)"}
          Get-Content ./r52c-endpoint-origin/r52-summary.txt
          Get-Content ./r52c-endpoint-origin/r52-live-endpoint-origin-trace.txt

      - name: Upload R52c evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r52c-xg-endpoint-origin-known-xgid
          path: |
            r52c-endpoint-origin/*
            r52c-trace-stdout.txt
            r52c-trace-stderr.txt
            xg-reach-xgid-report.txt
          if-no-files-found: warn
          retention-days: 14
