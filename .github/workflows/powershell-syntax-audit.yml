name: PowerShell Runner Syntax Audit

on:
  push:
    branches: [xg-teacher-parallel-v16]
    paths:
      - .github/workflows/powershell-syntax-audit.yml
      - scripts/*.ps1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  parse-powershell-scripts:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Publish syntax audit run id
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          $payload=@{state='pending';context="ps-syntax/run-$env:GITHUB_RUN_ID";description='PowerShell syntax audit started'}|ConvertTo-Json -Compress
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
      - uses: actions/checkout@v4
      - name: Parse every runner PowerShell script
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $failures=@()
          Get-ChildItem "$env:GITHUB_WORKSPACE\scripts\*.ps1" | Sort-Object Name | ForEach-Object {
            $tokens=$null
            $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count-gt0){
              foreach($e in $parseErrors){$failures += "$($_.Name): line $($e.Extent.StartLineNumber): $($e.Message)"}
            }
          }
          if($failures.Count-gt0){
            $failures | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax audit failed for $($failures.Count) parse error(s)"
          }
          Write-Host "PowerShell syntax audit passed"
      - name: Publish syntax audit result
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state=if($env:JOB_STATUS-eq'success'){'success'}else{'failure'}
          $payload=@{state=$state;context='ps-syntax/audit';description="PowerShell syntax audit $env:JOB_STATUS"}|ConvertTo-Json -Compress
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
          $payload=@{state='success';context="ps-syntax/run-$env:GITHUB_RUN_ID";description='PowerShell syntax audit reached final status'}|ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
