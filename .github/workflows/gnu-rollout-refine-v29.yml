name: GNU Rollout Bank Refine Train v29

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-rollout-refine-v29.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

env:
  BASE_RUN_ID: '31472166884'
  BANK_RUN_ID: '31514772765'
  MZAND_V27_REQUIRE_ROLLOUT_ROWS: '4'
  MZAND_V27_FULL_LEGAL_DEV_LIMIT: '512'
  MZAND_V27_SEARCH_DEV_LIMIT: '96'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Download immutable GNU-only base corpus
        uses: actions/download-artifact@v4
        with:
          name: gnu-v15-prepare
          path: prep
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download original verified GNU rollout exports
        uses: actions/download-artifact@v4
        with:
          name: gnu-v15-rollout-13
          path: rollout13
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download verified GNU hard rollout bank v28
        uses: actions/download-artifact@v4
        with:
          name: gnu-hard-rollout-bank-v28
          path: bank28
          repository: ${{ github.repository }}
          run-id: ${{ env.BANK_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Rebuild baseline and apply verified v28 rollouts
        shell: bash
        run: |
          set -euxo pipefail
          cp prep/gnu-teacher-v15.jsonl .
          cp prep/gnu-v15-selected.jsonl .
          python - <<'PY'
          import json,re
          from pathlib import Path
          selected=[json.loads(x) for x in Path('gnu-v15-selected.jsonl').read_text().splitlines() if x.strip()]
          byidx={int(r['sourceRowIndex']):r for r in selected}
          ev=[]; ok=[]
          for p in sorted(Path('rollout13').rglob('*.txt')):
              if not p.stem.isdigit(): continue
              src=int(p.stem); r=byidx.get(src)
              if r is None: continue
              assert r['sourceSplit'] in ('train','tune') and r.get('pristine') is False and r.get('xgLabelUsed') is False and r.get('devUsed') is not True
              pick=int(r['pickedRank']); text=p.read_text(errors='replace')
              vals={int(rank):float(eq) for rank,eq in re.findall(r'^\s*(\d+)\.\s+Rollout\s+.+?Eq\.:\s+([+-]?\d+\.\d+)',text,re.M)}
              if 1 not in vals or pick not in vals: continue
              ev.append({'sourceRowIndex':src,'sourceSplit':r['sourceSplit'],'pickedRank':pick,'trials':int(r['effectiveRolloutTrials']),'teacherTopEquity':vals[1],'studentPickedEquity':vals[pick]})
              ok.append(r)
          if len(ev)!=2: raise SystemExit(f'expected 2 original verified rollouts, got {len(ev)}')
          Path('base-evidence.json').write_text(json.dumps(ev,indent=2)+'\n')
          Path('base-selected.jsonl').write_text(''.join(json.dumps(r,separators=(',',':'))+'\n' for r in ok))
          bank=[json.loads(x) for x in Path('bank28/gnu-v28-rollout-bank.jsonl').read_text().splitlines() if x.strip()]
          if len(bank)!=3: raise SystemExit(f'expected 3 verified v28 bank rows, got {len(bank)}')
          for r in bank:
              assert r['sourceSplit'] in ('train','tune') and r['pristine'] is False and r['xgLabelUsed'] is False and r['devUsed'] is False and r['success'] is True
          Path('v28-evidence.json').write_text(json.dumps([{'sourceRowIndex':int(r['sourceRowIndex']),'sourceSplit':r['sourceSplit'],'pickedRank':int(r['pickedRank']),'trials':int(r['trials']),'teacherTopEquity':float(r['teacherTopEquity']),'studentPickedEquity':float(r['studentPickedEquity'])} for r in bank],indent=2)+'\n')
          Path('v28-selected.jsonl').write_text(''.join(json.dumps({'sourceRowIndex':int(r['sourceRowIndex']),'sourceSplit':r['sourceSplit'],'pickedRank':int(r['pickedRank']),'pristine':False,'xgLabelUsed':False},separators=(',',':'))+'\n' for r in bank))
          uniq=sorted(set([x['sourceRowIndex'] for x in ev]+[int(r['sourceRowIndex']) for r in bank]))
          if len(uniq)!=4: raise SystemExit(f'expected 4 unique rollout-refined rows, got {uniq}')
          print('UNIQUE_VERIFIED_ROLLOUT_ROWS',uniq)
          PY
          GNU_V15_BATCH_IN=gnu-teacher-v15.jsonl GNU_V15_SELECTED=base-selected.jsonl GNU_V15_EVIDENCE=base-evidence.json GNU_V15_BATCH_OUT=gnu-v29-stage1.jsonl python scripts/apply-gnu-rollout-refinement-v15.py
          cp gnu-v15-refinement-report.txt gnu-v29-stage1-report.txt
          GNU_V15_BATCH_IN=gnu-v29-stage1.jsonl GNU_V15_SELECTED=v28-selected.jsonl GNU_V15_EVIDENCE=v28-evidence.json GNU_V15_BATCH_OUT=gnu-teacher-v29-refined.jsonl python scripts/apply-gnu-rollout-refinement-v15.py
          cp gnu-v15-refinement-report.txt gnu-v29-stage2-report.txt
          grep -q '^DEV_ROWS_REFINED: 0$' gnu-v29-stage1-report.txt
          grep -q '^DEV_ROWS_REFINED: 0$' gnu-v29-stage2-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' gnu-v29-stage2-report.txt
          grep -q '^XG_LABELS_USED: False$' gnu-v29-stage2-report.txt
      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy joblib xgboost scikit-learn
      - name: Validate legal move engine
        run: python scripts/test-mzand-engine-v27.py
      - name: Train from four unique verified rollout-refined train/tune rows
        env:
          GNU_V27_BATCH_OUT: gnu-teacher-v29-refined.jsonl
          MZAND_V27_REQUIRE_ROLLOUT_ROWS: '4'
        run: python scripts/train-mzand-gnu-v27.py
      - name: Enforce isolation and measured evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ROLLOUT_REFINED_ROWS: 4$' mzand-gnu-v27-report.txt
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v27-report.txt
          grep -q '^DEV_ROWS_MINED: 0$' mzand-gnu-v27-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v27-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v27-report.txt
          cat mzand-gnu-v27-report.txt
      - name: Publish sealed non-pristine dev status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t1=$(awk '/^DEV_STRICT_TOP1:/{print $2}' mzand-gnu-v27-report.txt)
          t2=$(awk '/^DEV_TOP2:/{print $2}' mzand-gnu-v27-report.txt)
          loss=$(awk '/^DEV_MEAN_EQUITY_LOSS:/{print $2}' mzand-gnu-v27-report.txt)
          hard=$(awk '/^DEV_HARD_STRICT_TOP1:/{print $2}' mzand-gnu-v27-report.txt)
          n=$(awk '/^DEV_POSITION_SAMPLES:/{print $2}' mzand-gnu-v27-report.txt)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-v29/heldout\",\"description\":\"Top1=$t1 Top2=$t2 loss=$loss hard=$hard n=$n rollouts=4 XG=false pristine=false\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-rollout-bank-refine-train-v29
          path: |
            gnu-v29-stage1-report.txt
            gnu-v29-stage2-report.txt
            v28-evidence.json
            mzand-gnu-v27.joblib
            mzand-gnu-v27-report.txt
            mzand-gnu-v27-report.json
            mzand-gnu-v27-rollout-queue.jsonl
          if-no-files-found: ignore
          retention-days: 30

# Strictly GNU-only. No pristine data. No XG labels. Dev is never mined or used for model selection.
