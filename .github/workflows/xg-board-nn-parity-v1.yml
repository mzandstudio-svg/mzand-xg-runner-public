name: XG Board NN Parity V1

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-board-nn-parity-v1.yml
      - tools/xg-board-nn-parity-v1/**
      - tools/xg-nn-dispatch-probe-v2/CAPTURE_XG_NN_DISPATCH_V2.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install current official XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $log=Join-Path $env:GITHUB_WORKSPACE 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$log") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not (Test-Path $e)){throw 'XG exe missing'}
          "XG_EXE=$e"|Out-File $env:GITHUB_ENV -Append
          "XG_EXE_SHA256=$((Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Append
      - name: Capture exact verified direct NN oracle
        id: capture
        continue-on-error: true
        shell: powershell
        run: |
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-board-nn-parity-out'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          & "$env:GITHUB_WORKSPACE\tools\xg-nn-dispatch-probe-v2\CAPTURE_XG_NN_DISPATCH_V2.ps1" -ExePath $env:XG_EXE -CasesPath "$env:GITHUB_WORKSPACE\tools\xg-board-nn-parity-v1\cases.json" -OutDir $out
      - name: Parse oracle summary
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'xg-board-nn-parity-out'
          $rows=@()
          Get-ChildItem (Join-Path $out 'raw') -Filter '*.txt' -ErrorAction SilentlyContinue | ForEach-Object {
            $t=Get-Content $_.FullName -Raw
            $id=$_.BaseName
            $m=[regex]::Match($t,'Player Winning Chances:\s*([0-9.]+)%\s*\(G:([0-9.]+)%\s*B:([0-9.]+)%\).*?Opponent Winning Chances:\s*([0-9.]+)%\s*\(G:([0-9.]+)%\s*B:([0-9.]+)%\)','Singleline')
            $eq=[regex]::Match($t,'Cubeless Equities:\s*No Double=([+\-0-9.]+)')
            $rows += [pscustomobject]@{case_id=$id;parsed=$m.Success;win=if($m.Success){[double]$m.Groups[1].Value/100}else{$null};win_gammon=if($m.Success){[double]$m.Groups[2].Value/100}else{$null};win_bg=if($m.Success){[double]$m.Groups[3].Value/100}else{$null};lose=if($m.Success){[double]$m.Groups[4].Value/100}else{$null};lose_gammon=if($m.Success){[double]$m.Groups[5].Value/100}else{$null};lose_bg=if($m.Success){[double]$m.Groups[6].Value/100}else{$null};cubeless=if($eq.Success){[double]$eq.Groups[1].Value}else{$null}}
          }
          $rows | ConvertTo-Json -Depth 4 | Out-File (Join-Path $out 'oracle.json') -Encoding utf8
          $rows | Export-Csv (Join-Path $out 'oracle.csv') -NoTypeInformation
          $status=Join-Path $out 'capture-status.jsonl';$n=0;$v=0;$a=0
          if(Test-Path $status){foreach($line in Get-Content $status){$r=$line|ConvertFrom-Json;$n++;if($r.import_verified){$v++};if($r.analysis_found){$a++}}}
          @('XG_BOARD_NN_PARITY_V1',"XG_EXE_SHA256=$env:XG_EXE_SHA256","CASES=$n","IMPORT_VERIFIED=$v","ANALYSIS_FOUND=$a","CAPTURE_OUTCOME=${{ steps.capture.outcome }}",'PURPOSE=runtime differential parity only','TRAINING_ELIGIBLE=False') | Out-File (Join-Path $out 'RUN_REPORT.txt') -Encoding utf8
          Get-Content (Join-Path $out 'RUN_REPORT.txt')
          Get-Content (Join-Path $out 'oracle.csv')
      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-board-nn-parity-v1
          path: |
            xg-board-nn-parity-out/**
            xg-install.log
          if-no-files-found: error
          retention-days: 14
