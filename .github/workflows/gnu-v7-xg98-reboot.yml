name: GNU v7 XG98 Reboot Foundation

on:
  push:
    branches: [mzand-v7-xg98-reboot]
    paths:
      - .github/workflows/gnu-v7-xg98-reboot.yml
      - scripts/gnu-teacher-v7-unique.mjs
      - scripts/train-mzand-v7-foundation.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

env:
  OFFICIAL_DEV_SOURCE_RUN: '31668745178'
  GNU_V7_DICE_PER_POSITION: '2'
  GNU_V7_MAX_HINTS: '16'
  GNU_V7_MAX_TURNS: '72'

jobs:
  smoke:
    name: v7 generator and trainer syntax smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Syntax checks
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/gnu-teacher-v7-unique.mjs
          python -m py_compile scripts/train-mzand-v7-foundation.py
      - name: Install GNU runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate tiny fresh unique-position smoke shard
        shell: bash
        env:
          GNU_V7_SHARD_INDEX: '99'
          GNU_V7_SPLIT: 'train'
          GNU_V7_GAMES: '4'
          GNU_V7_POSITIONS_TARGET: '20'
          GNU_V7_GAME_OFFSET: '99000'
          GNU_V7_SEED_BASE: '940799001'
        run: node scripts/gnu-teacher-v7-unique.mjs
      - name: Enforce smoke provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^PRISTINE_DATA_USED: False$' gnu-v7-unique-train-99-report.txt
          grep -q '^XG_LABELS_USED: False$' gnu-v7-unique-train-99-report.txt
          grep -q '^DEV_USED: False$' gnu-v7-unique-train-99-report.txt
          cat gnu-v7-unique-train-99-report.txt

  label:
    name: GNU v7 unique ${{ matrix.split }} shard ${{ matrix.shard }}
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - { split: train, shard: 0, offset: 10000, target: 650, seed: 940700001 }
          - { split: train, shard: 1, offset: 10100, target: 650, seed: 940710001 }
          - { split: train, shard: 2, offset: 10200, target: 650, seed: 940720001 }
          - { split: train, shard: 3, offset: 10300, target: 650, seed: 940730001 }
          - { split: train, shard: 4, offset: 10400, target: 650, seed: 940740001 }
          - { split: train, shard: 5, offset: 10500, target: 650, seed: 940750001 }
          - { split: train, shard: 6, offset: 10600, target: 650, seed: 940760001 }
          - { split: train, shard: 7, offset: 10700, target: 650, seed: 940770001 }
          - { split: train, shard: 8, offset: 10800, target: 650, seed: 940780001 }
          - { split: train, shard: 9, offset: 10900, target: 650, seed: 940790001 }
          - { split: train, shard: 10, offset: 11000, target: 650, seed: 940800001 }
          - { split: train, shard: 11, offset: 11100, target: 650, seed: 940810001 }
          - { split: tune, shard: 20, offset: 30000, target: 400, seed: 941200001 }
          - { split: tune, shard: 21, offset: 30100, target: 400, seed: 941210001 }
          - { split: tune, shard: 22, offset: 30200, target: 400, seed: 941220001 }
          - { split: tune, shard: 23, offset: 30300, target: 400, seed: 941230001 }
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install GNU teacher runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate fresh unique-position GNU labels
        shell: bash
        env:
          GNU_V7_SHARD_INDEX: ${{ matrix.shard }}
          GNU_V7_SPLIT: ${{ matrix.split }}
          GNU_V7_GAMES: '24'
          GNU_V7_POSITIONS_TARGET: ${{ matrix.target }}
          GNU_V7_GAME_OFFSET: ${{ matrix.offset }}
          GNU_V7_SEED_BASE: ${{ matrix.seed }}
        run: node scripts/gnu-teacher-v7-unique.mjs
      - name: Enforce isolation
        shell: bash
        run: |
          set -euo pipefail
          r="gnu-v7-unique-${{ matrix.split }}-${{ matrix.shard }}-report.txt"
          grep -q '^PRISTINE_DATA_USED: False$' "$r"
          grep -q '^XG_LABELS_USED: False$' "$r"
          grep -q '^DEV_USED: False$' "$r"
          cat "$r"
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v7-${{ matrix.split }}-${{ matrix.shard }}
          path: |
            gnu-v7-unique-${{ matrix.split }}-${{ matrix.shard }}.jsonl
            gnu-v7-unique-${{ matrix.split }}-${{ matrix.shard }}-report.txt
          retention-days: 30

  prepare:
    name: Build leakage-free fresh train tune and recover official dev
    needs: label
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          pattern: gnu-v7-*
          path: freshshards
      - uses: actions/download-artifact@v4
        with:
          name: gnu-v35-cached-v36-frozen-corpus
          path: official
          repository: ${{ github.repository }}
          run-id: ${{ env.OFFICIAL_DEV_SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Recover unchanged official dev only
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('official/gnu-teacher-v35-scaled.jsonl')
          out=Path('gnu-v7-official-dev.jsonl')
          n=rankable=0; ids=set()
          with src.open() as f, out.open('w') as g:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line)
                  if r.get('split')!='dev': continue
                  assert r.get('pristine') is False
                  assert r.get('xgLabel') in (False,None) and r.get('xgLabelUsed') is not True
                  g.write(json.dumps(r,separators=(',',':'))+'\n')
                  n+=1; rankable+=len(r.get('hints') or [])>=2
                  if r.get('positionId'): ids.add(str(r['positionId']))
          print(f'OFFICIAL_DEV_ROWS={n} RANKABLE={rankable} UNIQUE_POSITIONS={len(ids)}')
          if rankable!=2266: raise SystemExit(f'official dev rankable mismatch {rankable} != 2266')
          PY
      - name: Merge fresh shards with board-level split isolation
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('freshshards').rglob('gnu-v7-unique-*.jsonl'))
          rows=[]
          for p in files:
              with p.open() as f:
                  for line in f:
                      if not line.strip(): continue
                      r=json.loads(line)
                      assert r.get('split') in ('train','tune')
                      assert r.get('pristine') is False
                      assert r.get('xgLabel') is False and r.get('xgLabelUsed') is False
                      assert r.get('devUsed') is False
                      # Drop very early opening states to avoid repeatedly learning the same opening board.
                      if int(r.get('turn',0)) < 4: continue
                      rows.append(r)
          # Exact decision-row deduplication.
          seen=set(); ded=[]
          for r in rows:
              pid=str(r.get('positionId') or '')
              d=tuple(int(x) for x in (r.get('dice') or []))
              k=(r['split'],pid,d)
              if not pid or k in seen: continue
              seen.add(k); ded.append(r)
          train_pos={str(r['positionId']) for r in ded if r['split']=='train'}
          # Tune loses any whole board that is present in train. No labels are compared.
          final=[r for r in ded if r['split']=='train' or str(r['positionId']) not in train_pos]
          trpos={str(r['positionId']) for r in final if r['split']=='train'}
          tupos={str(r['positionId']) for r in final if r['split']=='tune'}
          assert not (trpos & tupos)
          counts={}
          for r in final:
              counts[(r['split'],r.get('phase','unknown'))]=counts.get((r['split'],r.get('phase','unknown')),0)+1
          Path('gnu-v7-fresh.jsonl').write_text(''.join(json.dumps(r,separators=(',',':'))+'\n' for r in final))
          rep=[
            'CORPUS: GNU_V7_FRESH_UNIQUE_REBOOT',
            f'RAW_ROWS_AFTER_WARMUP: {len(rows)}',
            f'DEDUP_ROWS: {len(ded)}',
            f'FINAL_ROWS: {len(final)}',
            f'TRAIN_ROWS: {sum(r["split"]=="train" for r in final)}',
            f'TUNE_ROWS: {sum(r["split"]=="tune" for r in final)}',
            f'TRAIN_UNIQUE_POSITIONS: {len(trpos)}',
            f'TUNE_UNIQUE_POSITIONS: {len(tupos)}',
            f'TRAIN_TUNE_POSITION_OVERLAP: {len(trpos&tupos)}',
            'EARLY_TURNS_DROPPED_BEFORE_TRAINING: 4',
            'PRISTINE_DATA_USED: False',
            'XG_LABELS_USED: False',
            'DEV_LABELS_USED_FOR_MODEL_SELECTION: False',
          ]
          for (sp,ph),n in sorted(counts.items()): rep.append(f'{sp.upper()}_PHASE_{ph.upper()}_ROWS: {n}')
          Path('gnu-v7-fresh-report.txt').write_text('\n'.join(rep)+'\n')
          print('\n'.join(rep))
          if len(trpos)<5000: raise SystemExit(f'insufficient unique train positions {len(trpos)}')
          if len(tupos)<800: raise SystemExit(f'insufficient unique tune positions {len(tupos)}')
          PY
      - name: Fail on exact fresh versus official-dev board overlap
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          fresh=[json.loads(x) for x in Path('gnu-v7-fresh.jsonl').read_text().splitlines() if x.strip()]
          dev=[json.loads(x) for x in Path('gnu-v7-official-dev.jsonl').read_text().splitlines() if x.strip()]
          fp={str(r['positionId']) for r in fresh if r.get('positionId')}
          dp={str(r['positionId']) for r in dev if r.get('positionId')}
          overlap=fp&dp
          print(f'FRESH_OFFICIAL_DEV_POSITION_OVERLAP={len(overlap)}')
          if overlap: raise SystemExit(f'fresh/dev board leakage detected: {len(overlap)}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v7-prepared-foundation-data
          path: |
            gnu-v7-fresh.jsonl
            gnu-v7-fresh-report.txt
            gnu-v7-official-dev.jsonl
          retention-days: 30

  train:
    name: Train v7 from scratch and evaluate frozen adaptive search
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with:
          name: gnu-v7-prepared-foundation-data
          path: data
      - name: Install CPU ML stack
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q numpy
          python -m pip install --disable-pip-version-check -q --index-url https://download.pytorch.org/whl/cpu torch
      - name: Syntax and legacy engine legality regression
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile scripts/train-mzand-v7-foundation.py
          python -m pip install --disable-pip-version-check -q joblib
          python scripts/test-mzand-engine-v27.py
      - name: Train fresh multi-task value network and freeze search on tune only
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/train-mzand-v7-foundation.py --fresh data/gnu-v7-fresh.jsonl --dev data/gnu-v7-official-dev.jsonl --epochs 18
      - name: Enforce held-out and forbidden-data provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-v7-foundation-report.txt
          grep -q '^DEV_ROWS_MINED: 0$' mzand-v7-foundation-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-v7-foundation-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-v7-foundation-report.txt
          grep -q '^XG_TRAINING_ELIGIBLE: False$' mzand-v7-foundation-report.txt
          cat data/gnu-v7-fresh-report.txt
          cat mzand-v7-foundation-report.txt
      - name: Compute immutable GNU95 to XG Stage-B gate
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('mzand-v7-foundation-report.json').read_text())
          t=float(d['dev']['strictTop1']); passed=t>=0.95
          lines=[
            'GATE: GNU95_TO_XG_STAGE_B',
            f'DEV_STRICT_TOP1: {t:.6f}',
            f'GNU95_GATE_PASSED: {str(passed)}',
            f'XG_TRAINING_ELIGIBLE: {str(passed)}',
            'PRISTINE_DATA_USED: False',
            'XG_LABELS_USED_IN_STAGE_A: False',
          ]
          Path('mzand-v7-xg-stage-b-gate.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Publish measured candidate status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t1=$(awk '/^DEV_STRICT_TOP1:/{print $2}' mzand-v7-foundation-report.txt)
          t2=$(awk '/^DEV_TOP2:/{print $2}' mzand-v7-foundation-report.txt)
          loss=$(awk '/^DEV_MEAN_EQUITY_LOSS:/{print $2}' mzand-v7-foundation-report.txt)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-v7-xg98/foundation\",\"description\":\"Top1=$t1 Top2=$t2 loss=$loss XG=false pristine=false\"}" >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mzand-v7-xg98-foundation
          path: |
            mzand-v7-foundation.pt
            mzand-v7-foundation-portable.npz
            mzand-v7-foundation-report.json
            mzand-v7-foundation-report.txt
            mzand-v7-xg-stage-b-gate.txt
            data/gnu-v7-fresh-report.txt
          if-no-files-found: ignore
          retention-days: 30
