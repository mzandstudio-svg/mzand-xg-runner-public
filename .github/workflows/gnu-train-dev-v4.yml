name: GNU MZand Train Development v5 Pairwise Rank

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gnu-train-dev-v4.yml
      - scripts/gnu-teacher-all-dice-v4.mjs
      - scripts/train-mzand-gnu-v5.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  GNU_BATCH_GAMES: '24'
  GNU_TURNS_PER_GAME: '12'
  GNU_MAX_HINTS: '5'
  GNU_SEED_BASE: '41007019'
  GNU_HARD_MARGIN: '0.02'

jobs:
  label:
    name: All-dice GNU shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, offset: 0 }
          - { shard: 1, offset: 24 }
          - { shard: 2, offset: 48 }
          - { shard: 3, offset: 72 }
          - { shard: 4, offset: 96 }
          - { shard: 5, offset: 120 }
          - { shard: 6, offset: 144 }
          - { shard: 7, offset: 168 }
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish v5 run id early
        if: matrix.shard == 0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"pending\",\"context\":\"gnu-train-v5/run-$GITHUB_RUN_ID\",\"description\":\"all-dice GNU labeling started\"}" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GNU native prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate all 21 dice labels per board
        shell: bash
        env:
          GNU_SHARD_INDEX: ${{ matrix.shard }}
          GNU_GAME_OFFSET: ${{ matrix.offset }}
        run: node scripts/gnu-teacher-all-dice-v4.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v5-shard-${{ matrix.shard }}
          path: |
            gnu-teacher-all-dice-v4-${{ matrix.shard }}.jsonl
            gnu-teacher-all-dice-v4-${{ matrix.shard }}-report.txt
          retention-days: 14

  train:
    needs: label
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Publish v5 training state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"pending\",\"context\":\"gnu-train-v5/job\",\"description\":\"pairwise hard-position ranking training\"}" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: gnu-v5-shard-*
          path: shards
          merge-multiple: true
      - name: Combine all-dice corpus
        shell: bash
        run: |
          set -euxo pipefail
          test "$(ls shards/gnu-teacher-all-dice-v4-*.jsonl | wc -l)" -eq 8
          cat shards/gnu-teacher-all-dice-v4-*.jsonl > gnu-teacher-all-dice-v4.jsonl
          cat shards/gnu-teacher-all-dice-v4-*-report.txt > gnu-v5-shard-reports.txt
          grep -q 'DICE_AUGMENTATION: ALL_21' gnu-v5-shard-reports.txt
          echo "TOTAL_LABELS: $(wc -l < gnu-teacher-all-dice-v4.jsonl)" > gnu-v5-corpus-report.txt
          echo 'PRISTINE_DATA_USED: False' >> gnu-v5-corpus-report.txt
          echo 'XG_LABELS_USED: False' >> gnu-v5-corpus-report.txt
      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn joblib xgboost
      - name: Train pairwise hard-position ranker and open held-out development gate
        env:
          GNU_BATCH_OUT: gnu-teacher-all-dice-v4.jsonl
        run: python scripts/train-mzand-gnu-v5.py
      - name: Publish v5 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metric=$(grep '^DEV_STRICT_TOP1:' mzand-gnu-v5-report.txt | awk '{print $2}')
          n=$(grep '^DEV_POSITION_SAMPLES:' mzand-gnu-v5-report.txt | awk '{print $2}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"success\",\"context\":\"gnu-train-v5/evidence\",\"description\":\"held-out Top5-rerank Top-1=$metric n=$n\"}" >/dev/null
      - name: Upload v5 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gnu-mzand-train-dev-v5
          path: |
            gnu-v5-corpus-report.txt
            gnu-v5-shard-reports.txt
            mzand-gnu-v5.joblib
            mzand-gnu-v5-report.json
            mzand-gnu-v5-report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; [ "$JOB_STATUS" = success ] && state=success
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GATE_SHA" -d "{\"state\":\"$state\",\"context\":\"gnu-train-v5/job\",\"description\":\"job=$JOB_STATUS\"}" >/dev/null
