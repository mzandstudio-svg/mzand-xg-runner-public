name: GNU Direct Hint Rollout v21

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-direct-hint-rollout-v21.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  direct-hint-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Backgammon
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnubg
          gnubg -v | head -5 || true
      - name: Prove rollout =rank works on current GNU
        shell: bash
        run: |
          set -euxo pipefail
          cat > direct-hint-v21.commands <<'EOF'
          set lang C
          set confirm new off
          set confirm save off
          set display off
          set sound enable off
          set evaluation chequerplay evaluation plies 3
          set evaluation cubedecision evaluation plies 3
          set rollout trials 36
          set rollout quasirandom on
          set rollout seed 20262101
          set rollout limit enable off
          set rollout jsd stop off
          new game
          set board mHPMBSDg88TBAA
          set dice 5 5
          clear hint
          hint 16
          rollout =1 =2
          hint 2
          export position text direct-hint-v21.txt
          quit
          EOF
          timeout 600 gnubg -t -r -c direct-hint-v21.commands > direct-hint-v21.console 2>&1
          test -s direct-hint-v21.console
          test -s direct-hint-v21.txt
          ! grep -Eq 'No moves to analyse|No moves marked|Illegal|Unknown command' direct-hint-v21.console
          grep -q 'Rollout' direct-hint-v21.txt
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('direct-hint-v21.txt').read_text(errors='replace')
          rows=re.findall(r'^\s*(\d+)\.\s+Rollout\s+(.+?)\s+Eq\.:\s+([+-]?\d+\.\d+)', text, re.M)
          if len(rows) < 2:
              raise SystemExit(f'expected at least two explicit Rollout rows, got {rows}')
          ranks=[int(x[0]) for x in rows]
          if 1 not in ranks or 2 not in ranks:
              raise SystemExit(f'rollout rows do not cover original candidates 1 and 2: {rows}')
          report=[
              'GNU_DIRECT_HINT_ROLLOUT: True',
              'COMMAND_FORM: rollout =1 =2',
              f'ROLLOUT_ROWS: {len(rows)}',
              'ROLLED_ORIGINAL_HINT_RANK_1: True',
              'ROLLED_ORIGINAL_HINT_RANK_2: True',
              'CMARK_USED: False',
              'AFTERSTATE_SIGN_TRANSFORM_USED: False',
              'TRIALS: 36',
              'SOURCE_SPLIT: train',
              'DEV_DATA_USED: False',
              'PRISTINE_DATA_USED: False',
              'XG_LABELS_USED: False',
          ]
          for rank,move,eq in rows[:2]:
              report.append(f'ROLLOUT_RANK_{rank}: {move.strip()} EQ={eq}')
          Path('direct-hint-v21-report.txt').write_text('\n'.join(report)+'\n')
          print(Path('direct-hint-v21-report.txt').read_text())
          PY
      - name: Publish direct-hint status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"gnu-v21/direct-hint-rollout","description":"GNU rollout =rank verified; CMark and afterstate transform unnecessary"}' >/dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-direct-hint-rollout-v21
          path: |
            direct-hint-v21.commands
            direct-hint-v21.console
            direct-hint-v21.txt
            direct-hint-v21-report.txt
          if-no-files-found: ignore
          retention-days: 14
