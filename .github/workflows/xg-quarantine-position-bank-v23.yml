name: XG Quarantine Position Bank v23 128

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-quarantine-position-bank-v23.yml
      - scripts/generate-xg-quarantine-pool-v20.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  XGQ_TARGET: '128'
  XGQ_GAMES: '48'
  XGQ_TURNS: '24'
  XGQ_SEED_BASE: '930260811'
  XGQ_MAX_HINTS: '8'

jobs:
  build-bank:
    name: Build 128-position independent non-pristine quarantine bank
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GNU screening prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate deterministic non-pristine quarantine positions
        shell: bash
        run: node scripts/generate-xg-quarantine-pool-v20.mjs
      - name: Enforce isolation, uniqueness, and readiness metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SPLIT: xg_quarantine$' xg-quarantine-v20-report.txt
          grep -q '^QUARANTINED: True$' xg-quarantine-v20-report.txt
          grep -q '^TRAINING_ELIGIBLE: False$' xg-quarantine-v20-report.txt
          grep -q '^SEALED_DEV_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^XG_LABELS_USED_FOR_TRAINING: False$' xg-quarantine-v20-report.txt
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          d=json.loads(Path('xg-quarantine-v20-pool.json').read_text())
          pos=d['positions']
          assert len(pos) >= 128, len(pos)
          seen=set(); phases=Counter(); margins=Counter(); dice=Counter(); games=Counter()
          def phase(p):
              b=p['board']; own=b['own']; opp=b['opp']
              if int(b.get('barOwn',0)) or int(b.get('barOpp',0)): return 'bar'
              if int(b.get('offOwn',0)) or int(b.get('offOpp',0)): return 'bearoff_like'
              op=[i+1 for i,n in enumerate(own) if n]; xp=[i+1 for i,n in enumerate(opp) if n]
              if op and xp and max(op)<min(xp): return 'race_like'
              anchors=sum(1 for i,n in enumerate(own) if i>=18 and n>=2)
              deep=sum(1 for i,n in enumerate(opp) if i<=5 and n>=2)
              if anchors>=2 and deep>=2: return 'backgame_like'
              return 'contact'
          for p in pos:
              assert p['split']=='xg_quarantine' and p['quarantined'] is True
              assert p['trainingEligible'] is False and p['pristine'] is False and p['sealedDev'] is False
              x=p['xgid']; assert x not in seen, x; seen.add(x)
              ph=phase(p); m=float(p['gnuScreening']['margin'])
              mb='<0.005' if m<.005 else '0.005-0.015' if m<.015 else '0.015-0.03' if m<.03 else '>=0.03'
              ds=''.join(map(str,p['dice']))
              phases[ph]+=1; margins[mb]+=1; dice[ds]+=1; games[str(p.get('gameIndex'))]+=1
              p['readiness']={'phase_bucket':ph,'gnu_margin_bucket':mb,'rollout_priority_score':round(1/(.001+max(0,m)),6),'training_eligible':False}
          out={'schema':'mzand.xg.quarantine-position-bank.v23','split':'xg_quarantine','quarantined':True,'training_eligible':False,'pristine':False,'sealed_dev':False,'xg_labels_used_for_training':False,'position_count':len(pos),'unique_xgid_count':len(seen),'duplicate_count':len(pos)-len(seen),'phase_counts':dict(sorted(phases.items())),'gnu_margin_counts':dict(sorted(margins.items())),'distinct_dice':len(dice),'dice_counts':dict(sorted(dice.items())),'distinct_games':len(games),'positions':pos}
          Path('xg-quarantine-position-bank-v23.json').write_text(json.dumps(out,indent=2)+'\n')
          report=['BANK: XG_QUARANTINE_POSITION_BANK_V23',f"POSITIONS: {len(pos)}",f"UNIQUE_XGIDS: {len(seen)}",f"DUPLICATES: {len(pos)-len(seen)}",f"DISTINCT_DICE: {len(dice)}",f"DISTINCT_GAMES: {len(games)}",'PHASE_COUNTS: '+json.dumps(out['phase_counts'],sort_keys=True),'GNU_MARGIN_COUNTS: '+json.dumps(out['gnu_margin_counts'],sort_keys=True),'SPLIT: xg_quarantine','QUARANTINED: True','TRAINING_ELIGIBLE: False','SEALED_DEV_USED: False','PRISTINE_DATA_USED: False','XG_LABELS_USED_FOR_TRAINING: False']
          Path('xg-quarantine-position-bank-v23-report.txt').write_text('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-position-bank-v23
          path: |
            xg-quarantine-position-bank-v23.json
            xg-quarantine-position-bank-v23-report.txt
            xg-quarantine-v20-pool.json
            xg-quarantine-v20-matrix.json
            xg-quarantine-v20-report.txt
          retention-days: 90
