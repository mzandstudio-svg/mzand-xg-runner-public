name: R36.7 XG Cube Dispatcher Xrefs

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths:
      - .github/workflows/r36-classifier-memory-slices.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install eXtreme Gammon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $exe)){throw "XG missing"}
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append

      - name: Reach proven ready XG instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1

      - name: Find dispatcher callers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mem {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int pid);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool ReadProcessMemory(IntPtr h, IntPtr addr, byte[] buf, int size, out IntPtr got);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
          }
          '@
          $proc=Get-Process | Where-Object { $_.ProcessName -match 'eXtremeGammon2|ExtremeGammon2' } | Select-Object -First 1
          if(-not $proc){ throw 'XG process not found after proven startup' }
          $h=[Mem]::OpenProcess(0x0010 -bor 0x0400,$false,$proc.Id)
          if($h -eq [IntPtr]::Zero){ throw 'OpenProcess failed' }

          # Confirm the final-classifier override gate while the real XG process is ready.
          $gate=New-Object byte[] 4
          $gateGot=[IntPtr]::Zero
          $gateOk=[Mem]::ReadProcessMemory($h,[IntPtr]::new(0x00A0D700),$gate,4,[ref]$gateGot)
          if($gateOk){
            $gateHex=($gate|ForEach-Object{$_.ToString('x2')})-join''
            $line="R36_GLOBAL va=0xa0d700 hex=$gateHex"
            Add-Content ./r36-cube-xrefs.txt $line; Write-Host $line
          }

          $base=[Int64]0x00400000
          $len=0x00600000
          $buf=New-Object byte[] $len
          $got=[IntPtr]::Zero
          $ok=[Mem]::ReadProcessMemory($h,[IntPtr]::new($base),$buf,$len,[ref]$got)
          if(-not $ok){ throw "ReadProcessMemory image failed got=$($got.ToInt64())" }
          $targets=@([Int64]0x009DAD30,[Int64]0x009DA8C0)
          foreach($t in $targets){
            for($i=0;$i -le $got.ToInt64()-5;$i++){
              if($buf[$i] -ne 0xE8){ continue }
              $rel=[BitConverter]::ToInt32($buf,$i+1)
              $src=$base+[Int64]$i
              $dst=$src+5+[Int64]$rel
              if($dst -ne $t){ continue }
              $lo=[Math]::Max(0,$i-80); $hi=[Math]::Min($got.ToInt64(),$i+128)
              $slice=New-Object byte[] ($hi-$lo)
              [Array]::Copy($buf,$lo,$slice,0,$slice.Length)
              $hex=($slice|ForEach-Object{$_.ToString('x2')})-join''
              $sliceVa=$base+[Int64]$lo
              $line="R36_XREF target=0x$($t.ToString('x')) call=0x$($src.ToString('x')) slice_va=0x$($sliceVa.ToString('x')) hex=$hex"
              Add-Content ./r36-cube-xrefs.txt $line
              Write-Host $line
            }
          }
          [Mem]::CloseHandle($h)|Out-Null
          Write-Host 'R36_CUBE_XREFS=PASS'

      - name: Upload xrefs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-cube-xrefs
          path: |
            r36-cube-xrefs.txt
            r35-proven-startup-summary.txt
          if-no-files-found: ignore
          retention-days: 14
