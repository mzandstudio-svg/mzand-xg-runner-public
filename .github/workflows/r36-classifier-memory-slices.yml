name: R36.21 XG Cube Dispatcher Classifier Params Table

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths: [.github/workflows/r36-classifier-memory-slices.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install eXtreme Gammon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append
      - name: Reach proven ready XG instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1
      - name: Dump classifier params and coefficient table
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mem {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int pid);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool ReadProcessMemory(IntPtr h, IntPtr addr, byte[] buf, int size, out IntPtr got);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
          }
          '@
          $proc=Get-Process | Where-Object { $_.ProcessName -match 'eXtremeGammon2|ExtremeGammon2' } | Select-Object -First 1
          if(-not $proc){throw 'XG process not found'}
          $h=[Mem]::OpenProcess(0x0010 -bor 0x0400,$false,$proc.Id)
          if($h -eq [IntPtr]::Zero){throw 'OpenProcess failed'}
          $ranges=@(
            @{Name='classifier_6f9000'; Start=0x006F9000L; Len=0x2000},
            @{Name='eval_backend_9d5000'; Start=0x009D5000L; Len=0x3000},
            @{Name='cube_params_a12620'; Start=0x00A12620L; Len=0x100},
            @{Name='cube_coeff_table_a2ac6c'; Start=0x00A2AC6CL; Len=0x22000}
          )
          try {
            foreach($r in $ranges){
              $buf=New-Object byte[] $r.Len; $got=[IntPtr]::Zero
              $ok=[Mem]::ReadProcessMemory($h,[IntPtr]::new([long]$r.Start),$buf,[int]$r.Len,[ref]$got)
              if(-not $ok -or $got.ToInt64() -le 0){throw "ReadProcessMemory failed for $($r.Name)"}
              $n=[int]$got.ToInt64(); if($n -ne $r.Len){$buf=$buf[0..($n-1)]}
              $file="$($r.Name)_from_$(([long]$r.Start).ToString('x')).bin"
              [IO.File]::WriteAllBytes((Join-Path $PWD $file),$buf)
              "DUMP name=$file va=0x$(([long]$r.Start).ToString('x')) len=$n" | Tee-Object -FilePath ./r36-dispatcher-data.txt -Append
            }
          } finally {[Mem]::CloseHandle($h)|Out-Null}
          'TARGET 0x6f9580' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0x9d5c20' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0x9d5c80' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0xa12628' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0xa1262c' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0xa12630' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0xa12634' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0xa12638' | Add-Content ./r36-dispatcher-data.txt
          'TARGET 0xa2ac6c' | Add-Content ./r36-dispatcher-data.txt
          'R36_DISPATCHER_DATA=PASS' | Tee-Object -FilePath ./r36-dispatcher-summary.txt
      - name: Upload dispatcher data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-cube-dispatcher-classifier-params-table
          path: |
            *_from_*.bin
            r36-dispatcher-data.txt
            r36-dispatcher-summary.txt
            r35-proven-startup-summary.txt
          if-no-files-found: error
          retention-days: 14
