name: R36.27 XG Efficiency Constants and Classifier Body

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths: [.github/workflows/r36-classifier-memory-slices.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install eXtreme Gammon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append
      - name: Reach proven ready XG instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1
      - name: Dump exact efficiency constants and classifier body
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mem {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a,bool i,int pid);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool ReadProcessMemory(IntPtr h,IntPtr a,byte[] b,int s,out IntPtr r);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
          }
          '@
          $proc=Get-Process eXtremeGammon2 -ErrorAction Stop | Select-Object -First 1
          $h=[Mem]::OpenProcess(0x0010 -bor 0x0400,$false,$proc.Id)
          if($h-eq[IntPtr]::Zero){throw 'OpenProcess failed'}
          function ReadBytes([long]$va,[int]$len){
            $b=New-Object byte[] $len; $r=[IntPtr]::Zero
            if(-not [Mem]::ReadProcessMemory($h,[IntPtr]::new($va),$b,$len,[ref]$r)){throw "read failed 0x$($va.ToString('x'))"}
            if($r.ToInt64()-ne$len){throw "short read 0x$($va.ToString('x')) got=$($r.ToInt64())"}
            return ,$b
          }
          try {
            $g=ReadBytes 0x00A12620 0x30
            [IO.File]::WriteAllBytes((Join-Path $PWD 'eff_globals_a12620.bin'),$g)
            for($o=0;$o-le0x1c;$o+=4){
              $va=0x00A12620+$o
              $u=[BitConverter]::ToUInt32($g,$o)
              $f=[BitConverter]::ToSingle($g,$o)
              "GLOBAL va=0x$($va.ToString('x')) u32=$u float=$([single]$f) hex=0x$($u.ToString('x8'))" | Tee-Object -FilePath ./r36-efficiency-components.txt -Append
            }
            $c=ReadBytes 0x009DAD20 0xD0
            [IO.File]::WriteAllBytes((Join-Path $PWD 'eff_constants_9dad20.bin'),$c)
            foreach($va in @(0x009DAD20L,0x009DAD24L,0x009DAD28L,0x009DADECL)){
              $o=[int]($va-0x009DAD20L)
              $u=[BitConverter]::ToUInt32($c,$o)
              $f=[BitConverter]::ToSingle($c,$o)
              "CONST va=0x$($va.ToString('x')) u32=$u float=$([single]$f) hex=0x$($u.ToString('x8'))" | Tee-Object -FilePath ./r36-efficiency-components.txt -Append
            }
            $cls=ReadBytes 0x006F9000 0x3000
            [IO.File]::WriteAllBytes((Join-Path $PWD 'classifier_6f9000.bin'),$cls)
            $helpers=ReadBytes 0x009DAA00 0x400
            [IO.File]::WriteAllBytes((Join-Path $PWD 'eff_helpers_9daa00.bin'),$helpers)
            'R36_EFFICIENCY_CONSTANTS_CLASSIFIER_BODY=PASS' | Tee-Object -FilePath ./r36-efficiency-summary.txt
          } finally {[Mem]::CloseHandle($h)|Out-Null}
      - name: Upload exact efficiency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-xg-efficiency-constants-classifier-body
          path: |
            eff_globals_a12620.bin
            eff_constants_9dad20.bin
            classifier_6f9000.bin
            eff_helpers_9daa00.bin
            r36-efficiency-components.txt
            r36-efficiency-summary.txt
            r35-proven-startup-summary.txt
          if-no-files-found: ignore
          retention-days: 14
