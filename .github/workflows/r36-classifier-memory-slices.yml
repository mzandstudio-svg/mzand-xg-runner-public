name: R36.18 XG Endpoint Top Caller Xrefs

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths: [.github/workflows/r36-classifier-memory-slices.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install eXtreme Gammon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append
      - name: Reach proven ready XG instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1
      - name: Find callers of 0x9DC770 and dump bodies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mem {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int pid);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool ReadProcessMemory(IntPtr h, IntPtr addr, byte[] buf, int size, out IntPtr got);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
          }
          '@
          $proc=Get-Process | Where-Object { $_.ProcessName -match 'eXtremeGammon2|ExtremeGammon2' } | Select-Object -First 1
          if(-not $proc){throw 'XG process not found'}
          $h=[Mem]::OpenProcess(0x0010 -bor 0x0400,$false,$proc.Id)
          if($h -eq [IntPtr]::Zero){throw 'OpenProcess failed'}
          $base=0x00400000L; $end=0x00A10000L; $chunk=0x1000; $target=0x009DC770L
          $hits=@()
          try {
            for($va=$base; $va -lt $end; $va+=$chunk){
              $buf=New-Object byte[] $chunk; $got=[IntPtr]::Zero
              if(-not [Mem]::ReadProcessMemory($h,[IntPtr]::new($va),$buf,$chunk,[ref]$got)){continue}
              $n=[int]$got.ToInt64()
              for($i=0;$i -le $n-5;$i++){
                if($buf[$i] -ne 0xE8){continue}
                $rel=[BitConverter]::ToInt32($buf,$i+1)
                $src=$va+$i; $tgt=$src+5+$rel
                if($tgt -ne $target){continue}
                $hits += $src
                "XREF src=0x$($src.ToString('x')) target=0x$($target.ToString('x'))" | Tee-Object -FilePath ./r36-top-xrefs.txt -Append
                $start=[Math]::Max($base,$src-0x200)
                $len=0x600
                $out=New-Object byte[] $len; $got2=[IntPtr]::Zero
                $ok=[Mem]::ReadProcessMemory($h,[IntPtr]::new($start),$out,$len,[ref]$got2)
                if($ok -and $got2.ToInt64() -gt 0){
                  if($got2.ToInt64() -ne $len){$out=$out[0..([int]$got2.ToInt64()-1)]}
                  $name="topcaller_$($src.ToString('x'))_from_$($start.ToString('x')).bin"
                  [IO.File]::WriteAllBytes((Join-Path $PWD $name),$out)
                  "DUMP name=$name va=0x$($start.ToString('x')) len=$($out.Length)" | Add-Content ./r36-top-xrefs.txt
                }
              }
            }
          } finally {[Mem]::CloseHandle($h)|Out-Null}
          if($hits.Count -eq 0){throw 'no callers of 0x9DC770 found'}
          "R36_TOP_CALLER_COUNT=$($hits.Count)" | Tee-Object -FilePath ./r36-top-summary.txt
          Write-Host 'R36_ENDPOINT_TOP_CALLERS=PASS'
      - name: Upload top callers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-endpoint-top-callers
          path: |
            topcaller_*.bin
            r36-top-xrefs.txt
            r36-top-summary.txt
            r35-proven-startup-summary.txt
          if-no-files-found: ignore
          retention-days: 14
