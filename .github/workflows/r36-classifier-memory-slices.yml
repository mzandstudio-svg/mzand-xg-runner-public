name: R36.25 XG State Initializers and Classifier Rank Globals

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths: [.github/workflows/r36-classifier-memory-slices.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install eXtreme Gammon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append
      - name: Reach proven ready XG instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1
      - name: Dump state initializers and rank globals
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mem {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int pid);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool ReadProcessMemory(IntPtr h, IntPtr addr, byte[] buf, int size, out IntPtr got);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
          }
          '@
          $proc=Get-Process | Where-Object { $_.ProcessName -match 'eXtremeGammon2|ExtremeGammon2' } | Select-Object -First 1
          if(-not $proc){throw 'XG process not found'}
          $h=[Mem]::OpenProcess(0x0010 -bor 0x0400,$false,$proc.Id)
          if($h -eq [IntPtr]::Zero){throw 'OpenProcess failed'}
          function Dump([long]$va,[int]$len,[string]$name){
            $buf=New-Object byte[] $len; $got=[IntPtr]::Zero
            if(-not [Mem]::ReadProcessMemory($h,[IntPtr]::new($va),$buf,$len,[ref]$got)){throw "read failed $name"}
            if($got.ToInt64() -le 0){throw "short read $name"}
            if($got.ToInt64() -ne $len){$buf=$buf[0..([int]$got.ToInt64()-1)]}
            [IO.File]::WriteAllBytes((Join-Path $PWD $name),$buf)
            "DUMP $name VA=0x$($va.ToString('x')) LEN=$($buf.Length)" | Add-Content ./r36-state-rank-summary.txt -Encoding ascii
          }
          try {
            Dump 0x009D4000 0x3000 'state_init_9d4000.bin'
            Dump 0x00A0EC60 0x40 'rank_globals_a0ec60.bin'
            Dump 0x00B04068 0x1000 'rank_table_b04068.bin'
            $g=New-Object byte[] 8; $got=[IntPtr]::Zero
            if(-not [Mem]::ReadProcessMemory($h,[IntPtr]::new(0x00A0EC70),$g,8,[ref]$got)){throw 'rank globals read failed'}
            $g0=[BitConverter]::ToInt32($g,0); $g1=[BitConverter]::ToInt32($g,4)
            "A0EC70=$g0" | Add-Content ./r36-state-rank-summary.txt -Encoding ascii
            "A0EC74=$g1" | Add-Content ./r36-state-rank-summary.txt -Encoding ascii
            'R36_STATE_INITIALIZERS_RANK_GLOBALS=PASS' | Add-Content ./r36-state-rank-summary.txt -Encoding ascii
          } finally {[Mem]::CloseHandle($h)|Out-Null}
      - name: Upload state/rank evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-xg-state-init-rank-globals
          path: |
            state_init_9d4000.bin
            rank_globals_a0ec60.bin
            rank_table_b04068.bin
            r36-state-rank-summary.txt
            r35-proven-startup-summary.txt
          if-no-files-found: ignore
          retention-days: 14
