name: R36.14 XG Active Endpoint Slot

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths:
      - .github/workflows/r36-classifier-memory-slices.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install eXtreme Gammon
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $exe)){ throw 'XG missing' }
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append

      - name: Reach proven ready XG instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1

      - name: Dump active slot and endpoint metadata
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mem {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool i, int pid);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool ReadProcessMemory(IntPtr h, IntPtr addr, byte[] buf, int size, out IntPtr got);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
          }
          '@
          $proc=Get-Process | Where-Object { $_.ProcessName -match 'eXtremeGammon2|ExtremeGammon2' } | Select-Object -First 1
          if(-not $proc){ throw 'XG process not found after proven startup' }
          $h=[Mem]::OpenProcess(0x0010 -bor 0x0400,$false,$proc.Id)
          if($h -eq [IntPtr]::Zero){ throw 'OpenProcess failed' }
          function Read-Bytes([Int64]$va,[int]$len) {
            $buf=New-Object byte[] $len
            $got=[IntPtr]::Zero
            $ok=[Mem]::ReadProcessMemory($h,[IntPtr]::new($va),$buf,$len,[ref]$got)
            if(-not $ok -or $got.ToInt64() -ne $len){ throw "ReadProcessMemory failed va=0x$($va.ToString('x')) got=$($got.ToInt64())" }
            return $buf
          }
          try {
            $idxBytes=Read-Bytes 0x00B0AD18 4
            $idx=[BitConverter]::ToInt32($idxBytes,0)
            "ACTIVE_ENDPOINT_SLOT=$idx" | Tee-Object -FilePath ./r36-active-endpoint.txt -Append
            if($idx -lt 0 -or $idx -gt 67){ throw "unexpected active slot $idx" }
            $slotVA=0x00A2AC6C + ($idx * 0x800)
            $slot=Read-Bytes $slotVA 0x800
            [IO.File]::WriteAllBytes((Join-Path $PWD 'active_endpoint_slot.bin'),$slot)
            $c0=[BitConverter]::ToSingle($slot,0x3F0)
            $c1=[BitConverter]::ToSingle($slot,0x3F4)
            $c2=[BitConverter]::ToSingle($slot,0x3F8)
            $c3=[BitConverter]::ToSingle($slot,0x3FC)
            "ACTIVE_ENDPOINT_COEFF=$c0,$c1,$c2,$c3" | Tee-Object -FilePath ./r36-active-endpoint.txt -Append
            $objTable=Read-Bytes 0x00B0AE78 0x120
            [IO.File]::WriteAllBytes((Join-Path $PWD 'endpoint_object_table.bin'),$objTable)
            $globals=Read-Bytes 0x00B0ACF0 0x80
            [IO.File]::WriteAllBytes((Join-Path $PWD 'endpoint_runtime_globals.bin'),$globals)
          } finally { [Mem]::CloseHandle($h)|Out-Null }
          Write-Host 'R36_ACTIVE_ENDPOINT_SLOT=PASS'

      - name: Upload active endpoint metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-active-endpoint-slot
          path: |
            r36-active-endpoint.txt
            active_endpoint_slot.bin
            endpoint_object_table.bin
            endpoint_runtime_globals.bin
            r35-proven-startup-summary.txt
          if-no-files-found: ignore
          retention-days: 14
