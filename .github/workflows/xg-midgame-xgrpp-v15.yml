name: XG Midgame XG Roller++ v18

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-midgame-xgrpp-v15.yml
      - scripts/xg-run-midgame-xgrpp-export-v15.ps1
      - scripts/xg-run-midgame-xgrpp-export-v18.ps1
      - scripts/xg-switch-midgame-v15.ps1
      - scripts/xg-run-position-analysis-v8.ps1
      - scripts/xg-reach-xgid.ps1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  midgame-xgrpp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Publish runner and run id
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          Post 'xg-public-v18/runner-start' 'pending' 'Public Windows runner started'
          Post "xg-public-v18/run-$env:GITHUB_RUN_ID" 'success' "workflow run id=$env:GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append
      - name: Reach known XGID position
        shell: powershell
        run: ./scripts/xg-reach-xgid.ps1
      - name: Resolve and invoke XG Roller++ by command id
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-run-midgame-xgrpp-export-v18.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-midgame-xgrpp-v18
          path: |
            xg-install.log
            xg-reach-xgid-report.txt
            xg-v8-report.txt
            xg-v8-*.png
            xg-v8-visible-ui.txt
            xg-v15-switch-report.txt
            xg-v15-xgrpp-report.txt
            xg-v15-before-xgrpp.txt
            xg-v15-after-xgrpp.txt
            xg-v15-*.png
            xg-v18-*.png
            xg-v18-context-menu.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          $ok=Test-Path "$env:GITHUB_WORKSPACE\xg-v15-after-xgrpp.txt"
          Post 'xg-public-v18/evidence' ($(if($ok){'success'}else{'failure'})) "after-export evidence=$ok"
          Post 'xg-public-v18/job' ($(if($env:JOB_STATUS-eq'success'){'success'}else{'failure'})) "job=$env:JOB_STATUS"
          Post 'xg-public-v18/runner-start' 'success' 'runner reached final status'
