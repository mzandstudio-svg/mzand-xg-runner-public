name: XG Post-XGR++ Raw Export Probe v22

on:
  push:
    branches: [xg-teacher-parallel-v16]
    paths:
      - .github/workflows/xg-xgrpp-raw-probe-v22.yml
      - scripts/xg-post-xgrpp-raw-probe-v22.ps1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: xg-v22-raw-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raw-export-probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Publish runner and run id
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          Post "xg-v22/run-$env:GITHUB_RUN_ID" 'success' "workflow run id=$env:GITHUB_RUN_ID"
          Post 'xg-v22/runner-start' 'pending' 'raw export probe runner started'

      - uses: actions/checkout@v4

      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $log=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$log") -Wait -PassThru
          if(Test-Path $log){Copy-Item $log "$env:GITHUB_WORKSPACE\xg-install-v22.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $exe)){throw 'XG executable missing'}
          "xgexe=$exe"|Out-File $env:GITHUB_ENV -Append

      - name: Reach proven XGID position
        shell: powershell
        run: ./scripts/xg-reach-xgid.ps1

      - name: Switch to non-book midgame XGID
        shell: powershell
        run: ./scripts/xg-switch-midgame-v15.ps1

      - name: Capture raw post-XGR++ exports
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-post-xgrpp-raw-probe-v22.ps1

      - name: Upload raw export evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-v22-post-xgrpp-raw-export
          path: |
            xg-v22-*.txt
            xg-v22-*.json
            xg-v22-*.png
            xg-v15-switch-report.txt
            xg-install-v22.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          $state=if($env:JOB_STATUS-eq'success'){'success'}else{'failure'}
          Post 'xg-v22/job' $state "raw export probe job=$env:JOB_STATUS"
          Post 'xg-v22/runner-start' 'success' 'raw export probe runner reached final status'
