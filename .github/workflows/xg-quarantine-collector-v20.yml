name: XG Quarantine Rollout Collector v20

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-quarantine-collector-v20.yml
      - scripts/generate-xg-quarantine-pool-v20.mjs
      - scripts/xg-reach-dynamic-xgid-v20.ps1
      - scripts/quarantine-xg-label-v20.py
      - scripts/xg-top5-rollout-v19-export.ps1
      - scripts/xg-top5-rollout-run.ps1
      - scripts/parse_xg_position_export.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  XGQ_TARGET: '4'
  XGQ_GAMES: '3'
  XGQ_TURNS: '8'
  XGQ_SEED_BASE: '930260811'
  XGQ_MAX_HINTS: '8'

jobs:
  generate:
    name: Generate independent non-pristine quarantine pool
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GNU screening prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate quarantined hard-position pool
        shell: bash
        run: node scripts/generate-xg-quarantine-pool-v20.mjs
      - name: Enforce quarantine provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SPLIT: xg_quarantine$' xg-quarantine-v20-report.txt
          grep -q '^QUARANTINED: True$' xg-quarantine-v20-report.txt
          grep -q '^TRAINING_ELIGIBLE: False$' xg-quarantine-v20-report.txt
          grep -q '^SEALED_DEV_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^XG_LABELS_USED_FOR_TRAINING: False$' xg-quarantine-v20-report.txt
      - name: Publish dynamic rollout matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(cat xg-quarantine-v20-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v20-pool
          path: |
            xg-quarantine-v20-pool.json
            xg-quarantine-v20-matrix.json
            xg-quarantine-v20-report.txt
          retention-days: 90

  rollout:
    name: XG 1296 quarantine ${{ matrix.id }}
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      XGQ_ID: ${{ matrix.id }}
      XGID_INPUT: ${{ matrix.xgid }}
      XGQ_SEED: ${{ matrix.seed }}
      XGQ_GNU_MARGIN: ${{ matrix.gnu_margin }}
    steps:
      - name: Publish collector start
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          Post "xg-quarantine-v20/$env:XGQ_ID" 'pending' "1296 rollout collector started; training quarantine=true"
      - uses: actions/checkout@v4
      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append
      - name: Load generated non-pristine XGID
        shell: powershell
        run: ./scripts/xg-reach-dynamic-xgid-v20.ps1
      - name: Run proven top-five 1296 rollout and headless export
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-top5-rollout-v19-export.ps1
      - name: Parse and quarantine XG rollout label
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw="xg-quarantine-$env:XGQ_ID-parsed.json"
          $final="xg-quarantine-$env:XGQ_ID-label.json"
          python ./scripts/parse_xg_position_export.py ./xg-top5-v19-export.txt $raw
          python ./scripts/quarantine-xg-label-v20.py $raw $final --expected-xgid "$env:XGID_INPUT" --id "$env:XGQ_ID" --seed "$env:XGQ_SEED" --gnu-margin "$env:XGQ_GNU_MARGIN"
      - name: Publish verified quarantine label
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          $d=Get-Content "xg-quarantine-$env:XGQ_ID-label.json" -Raw|ConvertFrom-Json
          $n=[int]$d.quarantine.rollout_candidate_count
          Post "xg-quarantine-v20/$env:XGQ_ID" 'success' "quarantined XG rollout label verified; rollout candidates=$n"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xg-quarantine-v20-${{ matrix.id }}
          path: |
            xg-quarantine-${{ matrix.id }}-label.json
            xg-quarantine-${{ matrix.id }}-label.report.txt
            xg-quarantine-${{ matrix.id }}-parsed.json
            xg-top5-v19-export.txt
            xg-top5-v11-report.txt
            xg-reach-dynamic-v20-report.txt
            xg-install.log
            xg-top5-v11-final.png
            xg-top5-v11-prompt-before-ok.png
          if-no-files-found: ignore
          retention-days: 90

  manifest:
    name: Build quarantine-only batch manifest
    if: always()
    needs: [generate, rollout]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xg-quarantine-v20-*
          path: collected
      - name: Build safe manifest without training integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('collected').rglob('xg-quarantine-*-label.json'))
          labels=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              q=d.get('quarantine') or {}
              assert q.get('quarantined') is True
              assert q.get('training_eligible') is False
              assert q.get('pristine') is False
              assert q.get('sealed_dev') is False
              assert q.get('xg_labels_used_for_training') is False
              labels.append(d)
          Path('xg-quarantine-v20-labels.jsonl').write_text(''.join(json.dumps(x,separators=(',',':'))+'\n' for x in labels),encoding='utf-8')
          Path('xg-quarantine-v20-manifest.txt').write_text('\n'.join([
              'CORPUS: XG_QUARANTINE_V20',
              f'VERIFIED_ROLLOUT_LABELS: {len(labels)}',
              'QUARANTINED: True',
              'TRAINING_ELIGIBLE: False',
              'SEALED_DEV_USED: False',
              'PRISTINE_DATA_USED: False',
              'XG_LABELS_USED_FOR_TRAINING: False',
          ])+'\n',encoding='utf-8')
          print(Path('xg-quarantine-v20-manifest.txt').read_text())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v20-batch-manifest
          path: |
            xg-quarantine-v20-labels.jsonl
            xg-quarantine-v20-manifest.txt
          retention-days: 90
