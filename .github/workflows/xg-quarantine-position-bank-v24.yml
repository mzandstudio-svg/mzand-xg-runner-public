name: XG Quarantine Position Bank v24 Phase Diverse

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-quarantine-position-bank-v24.yml
      - scripts/generate-xg-quarantine-diverse-v24.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  XGQ_TARGET: '128'
  XGQ_GAMES: '64'
  XGQ_TURNS: '64'
  XGQ_SEED_BASE: '931000019'
  XGQ_MAX_HINTS: '8'
  XGQ_ID_OFFSET: '128'

jobs:
  build-bank:
    name: Build phase-diverse 128-position quarantine bank
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install GNU screening prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate phase-diverse non-pristine quarantine positions
        shell: bash
        run: node scripts/generate-xg-quarantine-diverse-v24.mjs
      - name: Enforce isolation, uniqueness, and phase metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SPLIT: xg_quarantine$' xg-quarantine-v24-report.txt
          grep -q '^QUARANTINED: True$' xg-quarantine-v24-report.txt
          grep -q '^TRAINING_ELIGIBLE: False$' xg-quarantine-v24-report.txt
          grep -q '^SEALED_DEV_USED: False$' xg-quarantine-v24-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' xg-quarantine-v24-report.txt
          grep -q '^XG_LABELS_USED_FOR_TRAINING: False$' xg-quarantine-v24-report.txt
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          d=json.loads(Path('xg-quarantine-v24-pool.json').read_text())
          pos=d['positions']; assert len(pos)==128, len(pos)
          xs=[p['xgid'] for p in pos]; assert len(set(xs))==128
          assert all(p['split']=='xg_quarantine' and p['quarantined'] is True for p in pos)
          assert all(p['trainingEligible'] is False and p['pristine'] is False and p['sealedDev'] is False for p in pos)
          assert all(p['gnuScreening'].get('screenOnly') is True for p in pos)
          phases=Counter(p['phaseBucket'] for p in pos)
          dice=Counter(''.join(map(str,p['dice'])) for p in pos)
          games=Counter(str(p['gameIndex']) for p in pos)
          margins=Counter()
          for p in pos:
              m=float(p['gnuScreening']['margin'])
              margins['<0.005' if m<.005 else '0.005-0.015' if m<.015 else '0.015-0.03' if m<.03 else '>=0.03']+=1
          report={
            'schema':'mzand.xg.quarantine-position-bank.v24',
            'positions':len(pos),'unique_xgids':len(set(xs)),'duplicates':len(pos)-len(set(xs)),
            'distinct_dice':len(dice),'distinct_games':len(games),'phase_counts':dict(sorted(phases.items())),
            'gnu_margin_counts':dict(sorted(margins.items())),
            'visited_phase_counts':d['visitedPhaseCounts'],'screened_phase_counts':d['screenedPhaseCounts'],
            'split':'xg_quarantine','quarantined':True,'training_eligible':False,'pristine':False,'sealed_dev':False,
            'xg_labels_used_for_training':False,
          }
          Path('xg-quarantine-position-bank-v24-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          print('READY_FOR_XG_ROLLOUT=TRUE')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-position-bank-v24-phase-diverse
          path: |
            xg-quarantine-v24-pool.json
            xg-quarantine-v24-matrix.json
            xg-quarantine-v24-report.txt
            xg-quarantine-position-bank-v24-summary.json
          retention-days: 90
