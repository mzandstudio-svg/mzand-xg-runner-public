name: XG Quarantine Rollout Collector v29 Eight Fresh

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-quarantine-collector-v29-eight.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

env:
  XGQ_TARGET: '192'
  XGQ_GAMES: '96'
  XGQ_TURNS: '96'
  XGQ_SEED_BASE: '932300071'
  XGQ_MAX_HINTS: '8'
  XGQ_ID_OFFSET: '640'
  V28_RUN_ID: '31746018004'

jobs:
  generate:
    name: Generate eight fresh phase-balanced quarantine positions q0026-q0033
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Download v28 source for complete prior-XGID exclusion
        uses: actions/download-artifact@v4
        with:
          name: xg-quarantine-v28-rollout-source
          path: previous/v28
          repository: ${{ github.repository }}
          run-id: ${{ env.V28_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install GNU screening prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate independent fresh phase-diverse quarantine bank
        shell: bash
        run: node scripts/generate-xg-quarantine-diverse-v24.mjs
      - name: Select two fresh low-margin positions per phase
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const old=JSON.parse(fs.readFileSync('previous/v28/xg-quarantine-v28-rollout-source.json','utf8'));
          const excluded=new Set();
          for(const x of (old.prior_xgids_excluded||[])) if(x) excluded.add(String(x));
          for(const x of (old.positions||[])) if(x.xgid) excluded.add(String(x.xgid));
          if(excluded.size<9) throw new Error(`expected at least nine prior XGIDs, got ${excluded.size}`);
          const p=JSON.parse(fs.readFileSync('xg-quarantine-v24-pool.json','utf8'));
          const specs=[
            ['contact','q0026'],['contact','q0027'],
            ['bar','q0028'],['bar','q0029'],
            ['race_like','q0030'],['race_like','q0031'],
            ['bearoff_like','q0032'],['bearoff_like','q0033'],
          ];
          const xs=[];
          for(const [phase,id] of specs){
            let candidates=p.positions.filter(x=>x.phaseBucket===phase && !excluded.has(String(x.xgid)));
            if(phase==='bar') candidates=candidates.filter(x=>Number(x.board?.barOwn||0)===0 && Number(x.board?.barOpp||0)>0);
            candidates.sort((a,b)=>a.gnuScreening.margin-b.gnuScreening.margin);
            if(!candidates.length) throw new Error(`no fresh ${phase} candidate for ${id}`);
            const x=candidates[0]; excluded.add(String(x.xgid)); x.id=id; x.seedRange='XGQ_932300071_EIGHT_V29'; xs.push(x);
          }
          const m={include:xs.map(x=>({id:x.id,xgid:x.xgid,gnu_margin:Number(x.gnuScreening.margin.toFixed(6)),seed:x.seed,game:x.gameIndex,turn:x.turn,phase:x.phaseBucket}))};
          fs.writeFileSync('xg-quarantine-v29-rollout-matrix.json',JSON.stringify(m));
          fs.writeFileSync('xg-quarantine-v29-rollout-source.json',JSON.stringify({
            schema:'mzand.xg.quarantine-rollout-source.v29',split:'xg_quarantine',quarantined:true,training_eligible:false,pristine:false,sealed_dev:false,xg_labels_used_for_training:false,
            prior_source_run:31746018004,prior_xgids_excluded:[...new Set([...(old.prior_xgids_excluded||[]),...(old.positions||[]).map(x=>String(x.xgid))])],
            source_phases:['contact','bar','race_like','bearoff_like'],positions:xs
          },null,2)+'\n');
          NODE
      - name: Enforce source isolation and eight-position contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SPLIT: xg_quarantine$' xg-quarantine-v24-report.txt
          grep -q '^QUARANTINED: True$' xg-quarantine-v24-report.txt
          grep -q '^TRAINING_ELIGIBLE: False$' xg-quarantine-v24-report.txt
          grep -q '^SEALED_DEV_USED: False$' xg-quarantine-v24-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' xg-quarantine-v24-report.txt
          grep -q '^XG_LABELS_USED_FOR_TRAINING: False$' xg-quarantine-v24-report.txt
          node - <<'NODE'
          const s=require('./xg-quarantine-v29-rollout-source.json'); const m=require('./xg-quarantine-v29-rollout-matrix.json');
          if(m.include.length!==8) process.exit(1);
          if(new Set(m.include.map(x=>String(x.xgid))).size!==8) process.exit(1);
          const c={}; for(const x of m.include)c[x.phase]=(c[x.phase]||0)+1;
          for(const p of ['contact','bar','race_like','bearoff_like'])if(c[p]!==2)process.exit(1);
          for(const x of m.include)if(s.prior_xgids_excluded.includes(String(x.xgid)))process.exit(1);
          if(s.training_eligible!==false||s.pristine!==false||s.sealed_dev!==false||s.xg_labels_used_for_training!==false)process.exit(1);
          NODE
      - name: Publish rollout matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(cat xg-quarantine-v29-rollout-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v29-rollout-source
          path: |
            xg-quarantine-v29-rollout-source.json
            xg-quarantine-v29-rollout-matrix.json
            xg-quarantine-v24-report.txt
          retention-days: 90

  rollout:
    name: XG fresh 1296 verified v29 ${{ matrix.id }} ${{ matrix.phase }}
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 85
    env:
      XGQ_ID: ${{ matrix.id }}
      XGID_INPUT: ${{ matrix.xgid }}
      XGQ_SEED: ${{ matrix.seed }}
      XGQ_GNU_MARGIN: ${{ matrix.gnu_margin }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append
      - name: Load generated non-pristine XGID
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./scripts/xg-reach-dynamic-xgid-v20.ps1
      - name: Run completion-safe top-five 1296 rollout
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          & ./scripts/xg-top5-rollout-v21-export.ps1
      - name: Parse and validate fresh rollout into quarantine only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw="xg-quarantine-$env:XGQ_ID-parsed.json"
          $final="xg-quarantine-$env:XGQ_ID-label.json"
          python ./scripts/parse_xg_position_export_v21.py ./xg-top5-v21-export.txt $raw
          if($LASTEXITCODE -ne 0){throw "XG export parser failed with exit code $LASTEXITCODE"}
          python ./scripts/quarantine-xg-label-v20.py $raw $final --expected-xgid "$env:XGID_INPUT" --id "$env:XGQ_ID" --seed "$env:XGQ_SEED" --gnu-margin "$env:XGQ_GNU_MARGIN"
          if($LASTEXITCODE -ne 0){throw "XG quarantine validator failed with exit code $LASTEXITCODE"}
          $d=Get-Content $final -Raw|ConvertFrom-Json; $q=$d.quarantine
          if(-not $q.quarantined -or $q.training_eligible -or $q.pristine -or $q.sealed_dev -or $q.xg_labels_used_for_training -or -not $q.complete_rollout_provenance){throw 'quarantine/provenance gate failed'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xg-quarantine-v29-${{ matrix.id }}
          path: |
            xg-quarantine-${{ matrix.id }}-label.json
            xg-quarantine-${{ matrix.id }}-label.report.txt
            xg-quarantine-${{ matrix.id }}-parsed.json
            xg-top5-v21-export.txt
            xg-top5-v11-report.txt
            xg-reach-dynamic-v20-report.txt
            xg-install.log
          if-no-files-found: ignore
          retention-days: 90

  manifest:
    name: Build verified v29 eight-position quarantine manifest
    if: always()
    needs: [generate, rollout]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xg-quarantine-v29-q*
          path: collected
      - name: Build strict quarantine-only manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('collected').rglob('xg-quarantine-q*-label.json')); labels=[]
          for p in files:
              d=json.loads(p.read_text()); q=d.get('quarantine') or {}
              assert q.get('quarantined') is True and q.get('training_eligible') is False
              assert q.get('pristine') is False and q.get('sealed_dev') is False
              assert q.get('xg_labels_used_for_training') is False and q.get('complete_rollout_provenance') is True
              labels.append(d)
          complete=len(labels)==8
          Path('xg-quarantine-v29-labels.jsonl').write_text(''.join(json.dumps(x,separators=(',',':'))+'\n' for x in labels))
          manifest={'schema_version':'mzand-xg-quarantine-v29-eight','split':'xg_quarantine','quarantined':True,'training_eligible':False,'pristine':False,'sealed_dev':False,'xg_labels_used_for_training':False,'requested_positions':8,'verified_fresh_rollout_labels':len(labels),'complete_batch':complete,'requested_source_phases':['contact','bar','race_like','bearoff_like'],'prior_source_run_excluded':31746018004}
          Path('xg-quarantine-v29-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('xg-quarantine-v29-manifest.txt').write_text('\n'.join([
              'CORPUS: XG_QUARANTINE_V29_EIGHT_FRESH','REQUESTED_POSITIONS: 8',f'VERIFIED_FRESH_ROLLOUT_LABELS: {len(labels)}',f'COMPLETE_BATCH: {complete}','SOURCE_PHASES: contact(2),bar(2),race_like(2),bearoff_like(2)','PRIOR_SOURCE_RUN_EXCLUDED: 31746018004','QUARANTINED: True','TRAINING_ELIGIBLE: False','SEALED_DEV_USED: False','PRISTINE_DATA_USED: False','XG_LABELS_USED_FOR_TRAINING: False'])+'\n')
          print(Path('xg-quarantine-v29-manifest.txt').read_text())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v29-manifest
          path: |
            xg-quarantine-v29-labels.jsonl
            xg-quarantine-v29-manifest.json
            xg-quarantine-v29-manifest.txt
          retention-days: 90
