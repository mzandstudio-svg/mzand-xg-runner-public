name: GNU cmark debug v16

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths: [.github/workflows/gnu-cmark-debug-v16.yml]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test independent cmark commands on known failing mined position
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnubg
          cat > probe.commands <<'EOF'
          set lang C
          set confirm new off
          set confirm save off
          set display off
          set sound enable off
          set evaluation chequerplay evaluation plies 3
          set evaluation cubedecision evaluation plies 3
          set rollout trials 1296
          set rollout quasirandom on
          set rollout seed 20261621
          set rollout limit enable off
          set rollout jsd stop off
          new game
          set board 4HPkASGYBzwYVA
          set dice 2 6
          hint 16
          cmark move set rollout 1
          cmark move set rollout 2
          analyse rollout move
          export position text probe-position.txt
          quit
          EOF
          timeout 2400 gnubg -t -r -c probe.commands > probe.out 2>&1
          cat probe.out
          test -s probe-position.txt
          ! grep -Eq 'No moves to analyse|No moves marked' probe.out
          grep -q 'Rollout' probe-position.txt
          grep -E '^[[:space:]]*[12]\. Rollout' probe-position.txt | tee rollout-lines.txt
          test "$(wc -l < rollout-lines.txt)" -eq 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-cmark-independent-v16
          path: |
            probe.commands
            probe.out
            probe-position.txt
            rollout-lines.txt
          retention-days: 7

# Determine whether cmark must mark ranks in separate commands for arbitrary mined positions.
