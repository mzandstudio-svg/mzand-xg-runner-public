name: XG Best Move XGR++ Public v10

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/xg-best-move-xgrpp-public-v10.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  xgrpp-best-move:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Publish runner and run id
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){
            $payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress
            $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
          }
          Post 'xg-public-v10/runner-start' 'pending' 'Public Windows runner started v10'
          Post "xg-public-v10/run-$env:GITHUB_RUN_ID" 'success' "workflow run id=$env:GITHUB_RUN_ID"

      - uses: actions/checkout@v4

      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append

      - name: Reach proven XGID position
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-analyze-win32-v3.ps1

      - name: Run controlled best-move XG Roller++
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-run-best-move-xgrpp-v10.ps1

      - name: Upload v10 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-best-move-xgrpp-public-v10
          path: |
            xg-install.log
            xg-public-v3-report.txt
            xg-v8-report.txt
            xg-v10-report.txt
            xg-v10-context-before-xgrpp.png
            xg-v10-xgrpp-2s.png
            xg-v10-xgrpp-20s.png
            xg-v10-xgrpp-60s.png
            xg-v10-xgrpp-120s.png
            xg-*.png
            xg-*-ui.txt
            xg-*-processes.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[bool]$ok,[string]$description){
            $state=if($ok){'success'}else{'failure'}
            $payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress
            $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
          }
          $report="$env:GITHUB_WORKSPACE\xg-v10-report.txt"
          $started=$false;$captured=$false
          if(Test-Path $report){
            $text=Get-Content $report -Raw
            $started=($text-match'XGRPP_COMMAND_CLICKED: True')
            $captured=($text-match'XGRPP_RESULT_CAPTURED: True')
          }
          Post 'xg-public-v10/xgrpp-started' $started "XG Roller++ command clicked=$started"
          Post 'xg-public-v10/xgrpp-captured' $captured "XG Roller++ result captured=$captured"
          Post 'xg-public-v10/artifact' (Test-Path "$env:GITHUB_WORKSPACE\xg-v10-xgrpp-120s.png") '120s evidence screenshot present'
          Post 'xg-public-v10/runner-start' $true 'runner reached final status'
