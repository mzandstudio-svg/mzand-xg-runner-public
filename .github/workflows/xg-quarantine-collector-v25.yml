name: XG Quarantine Rollout Collector v25 Backgame Four

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-quarantine-collector-v25.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  XGQ_TARGET: '64'
  XGQ_GAMES: '96'
  XGQ_TURNS: '96'
  XGQ_SEED_BASE: '931500113'
  XGQ_MAX_HINTS: '8'
  XGQ_ID_OFFSET: '256'

jobs:
  generate:
    name: Generate q0013-q0016 from verified backgame-targeted quarantine distribution
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install GNU screening prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Regenerate deterministic backgame-targeted quarantine bank
        shell: bash
        run: node scripts/generate-xg-quarantine-backgame-v25.mjs
      - name: Select four unique backgame-like positions and re-ID q0013-q0016
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('xg-quarantine-v25-pool.json','utf8'));
          const xs=p.positions.filter(x=>x.phaseBucket==='backgame_like').slice(0,4);
          if(xs.length!==4) throw new Error(`need 4 backgame_like positions, got ${xs.length}`);
          const seen=new Set();
          xs.forEach((x,i)=>{
            if(seen.has(x.xgid)) throw new Error(`duplicate xgid ${x.xgid}`);
            seen.add(x.xgid);
            x.id=`q${String(i+13).padStart(4,'0')}`;
            x.seedRange='XGQ_931500113_BACKGAME_V25';
          });
          const m={include:xs.map(x=>({id:x.id,xgid:x.xgid,gnu_margin:Number(x.gnuScreening.margin.toFixed(6)),seed:x.seed,game:x.gameIndex,turn:x.turn,phase:x.phaseBucket}))};
          fs.writeFileSync('xg-quarantine-v25-rollout-matrix.json',JSON.stringify(m));
          fs.writeFileSync('xg-quarantine-v25-rollout-source.json',JSON.stringify({schema:'mzand.xg.quarantine-rollout-source.v25',split:'xg_quarantine',quarantined:true,training_eligible:false,pristine:false,sealed_dev:false,xg_labels_used_for_training:false,positions:xs},null,2)+'\n');
          NODE
      - name: Enforce raw-position quarantine provenance and backgame source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SPLIT: xg_quarantine$' xg-quarantine-v25-report.txt
          grep -q '^QUARANTINED: True$' xg-quarantine-v25-report.txt
          grep -q '^TRAINING_ELIGIBLE: False$' xg-quarantine-v25-report.txt
          grep -q '^SEALED_DEV_USED: False$' xg-quarantine-v25-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' xg-quarantine-v25-report.txt
          grep -q '^XG_LABELS_USED_FOR_TRAINING: False$' xg-quarantine-v25-report.txt
          node -e "const m=require('./xg-quarantine-v25-rollout-matrix.json');if(m.include.length!==4||m.include.some(x=>x.phase!=='backgame_like'))process.exit(1)"
      - name: Publish rollout matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(cat xg-quarantine-v25-rollout-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v25-rollout-source
          path: |
            xg-quarantine-v25-rollout-source.json
            xg-quarantine-v25-rollout-matrix.json
            xg-quarantine-v25-report.txt
          retention-days: 90

  rollout:
    name: XG fresh 1296 verified v25 ${{ matrix.id }} backgame
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      XGQ_ID: ${{ matrix.id }}
      XGID_INPUT: ${{ matrix.xgid }}
      XGQ_SEED: ${{ matrix.seed }}
      XGQ_GNU_MARGIN: ${{ matrix.gnu_margin }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append
      - name: Load generated non-pristine XGID
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./scripts/xg-reach-dynamic-xgid-v20.ps1
      - name: Run completion-safe top-five 1296 rollout
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          & ./scripts/xg-top5-rollout-v21-export.ps1
      - name: Parse and validate fresh rollout into quarantine only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw="xg-quarantine-$env:XGQ_ID-parsed.json"
          $final="xg-quarantine-$env:XGQ_ID-label.json"
          python ./scripts/parse_xg_position_export_v21.py ./xg-top5-v21-export.txt $raw
          if($LASTEXITCODE -ne 0){throw "XG export parser failed with exit code $LASTEXITCODE"}
          python ./scripts/quarantine-xg-label-v20.py $raw $final --expected-xgid "$env:XGID_INPUT" --id "$env:XGQ_ID" --seed "$env:XGQ_SEED" --gnu-margin "$env:XGQ_GNU_MARGIN"
          if($LASTEXITCODE -ne 0){throw "XG quarantine validator failed with exit code $LASTEXITCODE"}
          $d=Get-Content $final -Raw|ConvertFrom-Json; $q=$d.quarantine
          if(-not $q.quarantined -or $q.training_eligible -or $q.pristine -or $q.sealed_dev -or $q.xg_labels_used_for_training -or -not $q.complete_rollout_provenance){throw 'quarantine/provenance gate failed'}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xg-quarantine-v25-${{ matrix.id }}
          path: |
            xg-quarantine-${{ matrix.id }}-label.json
            xg-quarantine-${{ matrix.id }}-label.report.txt
            xg-quarantine-${{ matrix.id }}-parsed.json
            xg-top5-v21-export.txt
            xg-top5-v11-report.txt
            xg-reach-dynamic-v20-report.txt
            xg-install.log
          if-no-files-found: ignore
          retention-days: 90

  manifest:
    name: Build verified v25 backgame quarantine manifest
    if: always()
    needs: [generate, rollout]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xg-quarantine-v25-q*
          path: collected
      - name: Build quarantine-only manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('collected').rglob('xg-quarantine-*-label.json')); labels=[]
          for p in files:
              d=json.loads(p.read_text()); q=d.get('quarantine') or {}
              assert q.get('quarantined') is True and q.get('training_eligible') is False
              assert q.get('pristine') is False and q.get('sealed_dev') is False
              assert q.get('xg_labels_used_for_training') is False and q.get('complete_rollout_provenance') is True
              labels.append(d)
          Path('xg-quarantine-v25-labels.jsonl').write_text(''.join(json.dumps(x,separators=(',',':'))+'\n' for x in labels))
          manifest={'schema_version':'mzand-xg-quarantine-v25-backgame','split':'xg_quarantine','quarantined':True,'training_eligible':False,'pristine':False,'sealed_dev':False,'xg_labels_used_for_training':False,'source_phase':'backgame_like','positions':4,'verified_fresh_rollout_labels':len(labels)}
          Path('xg-quarantine-v25-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('xg-quarantine-v25-manifest.txt').write_text('\n'.join(['CORPUS: XG_QUARANTINE_V25_BACKGAME_VERIFIED',f'VERIFIED_FRESH_ROLLOUT_LABELS: {len(labels)}','SOURCE_PHASE: backgame_like','QUARANTINED: True','TRAINING_ELIGIBLE: False','SEALED_DEV_USED: False','PRISTINE_DATA_USED: False','XG_LABELS_USED_FOR_TRAINING: False'])+'\n')
          print(Path('xg-quarantine-v25-manifest.txt').read_text())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v25-manifest
          path: |
            xg-quarantine-v25-labels.jsonl
            xg-quarantine-v25-manifest.json
            xg-quarantine-v25-manifest.txt
          retention-days: 90
