name: GT722 XG Reference Main v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gt722-xg-reference-main-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  xg-reference:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Publish start status
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $p=@{state='pending';context='gt722-xg-ref/job';description='XG reference capture running'}|ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $h -Body $p -ContentType 'application/json'|Out-Null
      - uses: actions/checkout@v4
      - name: Install XG from official installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append
      - name: Reach frozen XG position
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-analyze-win32-v3.ps1
      - name: Export structured XG label
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-export-clipboard-v13.ps1
      - name: Parse and validate reference
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python ./scripts/parse_xg_position_export.py ./xg-v13-position-clipboard.txt ./xg-reference.json
          $x=Get-Content ./xg-reference.json -Raw|ConvertFrom-Json
          if($x.schema-ne'mzand.xg.position-label.v1'){throw 'schema mismatch'}
          if($x.candidate_count-lt1){throw 'no candidates'}
          "XG_TOP1=$($x.candidates[0].move)"|Out-File ./gt722-xg-reference-summary.txt
          "XG_EQUITY=$($x.candidates[0].equity)"|Out-File ./gt722-xg-reference-summary.txt -Append
          "XG_METHOD=$($x.candidates[0].analysis_method)"|Out-File ./gt722-xg-reference-summary.txt -Append
          Get-Content ./gt722-xg-reference-summary.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gt722-xg-reference-main-v1
          path: |
            xg-install.log
            xg-v13-position-clipboard.txt
            xg-reference.json
            gt722-xg-reference-summary.txt
            xg-*.png
            xg-*-processes.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state=if($env:JOB_STATUS-eq'success'){'success'}else{'failure'}
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $p=@{state=$state;context='gt722-xg-ref/job';description="XG reference job=$env:JOB_STATUS"}|ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $h -Body $p -ContentType 'application/json'|Out-Null
