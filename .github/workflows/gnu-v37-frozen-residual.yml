name: GNU Frozen-Residual v37

on:
  push:
    branches: [mzand-v6-gnu-rollout-engine]
    paths:
      - .github/workflows/gnu-v37-frozen-residual.yml
      - scripts/run-mzand-gnu-v37-frozen-residual.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

env:
  V33_RUN_ID: '31561338583'
  V36_RUN_ID: '31668745178'

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - name: Reuse exact frozen v35/v36 corpus
        uses: actions/download-artifact@v4
        with:
          name: gnu-v35-cached-v36-frozen-corpus
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ env.V36_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download verified v33 base model
        uses: actions/download-artifact@v4
        with:
          name: gnu-phase-experts-v33
          path: v33
          repository: ${{ github.repository }}
          run-id: ${{ env.V33_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy joblib xgboost scikit-learn

      - name: Fit residual on train only and freeze tune selection
        env:
          GNU_V37_STAGE: select
          GNU_V35_BATCH_OUT: gnu-teacher-v35-scaled.jsonl
          GNU_V35_V33_MODEL: v33/mzand-gnu-v33-phase-experts.joblib
        run: python scripts/run-mzand-gnu-v37-frozen-residual.py

      - name: Enforce selection isolation and frozen-residual contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^STAGE: SELECT_TRAIN_TUNE_ONLY$' mzand-gnu-v37-selection-report.txt
          grep -q '^RESIDUAL_FIT_SPLITS: train$' mzand-gnu-v37-selection-report.txt
          grep -q '^RESIDUAL_REFIT_AFTER_SELECTION: False$' mzand-gnu-v37-selection-report.txt
          grep -q '^DEV_OPENED: False$' mzand-gnu-v37-selection-report.txt
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v37-selection-report.txt
          grep -q '^DEV_ROWS_MINED: 0$' mzand-gnu-v37-selection-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v37-selection-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v37-selection-report.txt
          grep -q '^TUNE_CACHE_EQUIVALENCE_ROWS: 8$' mzand-gnu-v37-execution-report.txt
          test -s mzand-gnu-v37-train-only-residual.joblib
          cat mzand-gnu-v37-selection-report.txt
          cat mzand-gnu-v37-execution-report.txt

      - uses: actions/upload-artifact@v7
        with:
          name: gnu-v37-frozen-selection-and-residual
          path: |
            mzand-gnu-v37-selection.json
            mzand-gnu-v37-selection-report.txt
            mzand-gnu-v37-train-only-residual.joblib
            mzand-gnu-v37-execution-report.txt
          retention-days: 14

  final:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }

      - name: Reuse exact frozen v35/v36 corpus
        uses: actions/download-artifact@v4
        with:
          name: gnu-v35-cached-v36-frozen-corpus
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ env.V36_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download frozen v37 selection and exact train-only residual
        uses: actions/download-artifact@v4
        with:
          name: gnu-v37-frozen-selection-and-residual
          path: .

      - name: Download verified v33 base model
        uses: actions/download-artifact@v4
        with:
          name: gnu-phase-experts-v33
          path: v33
          repository: ${{ github.repository }}
          run-id: ${{ env.V33_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Install ML stack
        run: python -m pip install --disable-pip-version-check -q numpy joblib xgboost scikit-learn

      - name: Open sealed dev with unchanged train-only residual
        env:
          GNU_V37_STAGE: final
          GNU_V35_BATCH_OUT: gnu-teacher-v35-scaled.jsonl
          GNU_V35_V33_MODEL: v33/mzand-gnu-v33-phase-experts.joblib
          GNU_V37_SELECTION: mzand-gnu-v37-selection.json
          GNU_V37_RESIDUAL: mzand-gnu-v37-train-only-residual.joblib
        run: python scripts/run-mzand-gnu-v37-frozen-residual.py

      - name: Enforce sealed-dev provenance and no-refit contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^RESIDUAL_FIT_SPLITS: train$' mzand-gnu-v37-frozen-residual-report.txt
          grep -q '^RESIDUAL_REFIT_AFTER_SELECTION: False$' mzand-gnu-v37-frozen-residual-report.txt
          grep -q '^DEV_USED_FOR_MODEL_SELECTION: False$' mzand-gnu-v37-frozen-residual-report.txt
          grep -q '^DEV_ROWS_MINED: 0$' mzand-gnu-v37-frozen-residual-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' mzand-gnu-v37-frozen-residual-report.txt
          grep -q '^XG_LABELS_USED: False$' mzand-gnu-v37-frozen-residual-report.txt
          grep -q '^DEV_CACHE_EQUIVALENCE_ROWS: 8$' mzand-gnu-v37-execution-report.txt
          cat mzand-gnu-v37-frozen-residual-report.txt
          cat mzand-gnu-v37-execution-report.txt

      - name: Publish measured held-out result
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          t1=$(awk '/^DEV_STRICT_TOP1:/{print $2}' mzand-gnu-v37-frozen-residual-report.txt)
          t2=$(awk '/^DEV_TOP2:/{print $2}' mzand-gnu-v37-frozen-residual-report.txt)
          loss=$(awk '/^DEV_MEAN_EQUITY_LOSS:/{print $2}' mzand-gnu-v37-frozen-residual-report.txt)
          hard=$(awk '/^DEV_HARD_STRICT_TOP1:/{print $2}' mzand-gnu-v37-frozen-residual-report.txt)
          delta=$(awk '/^DELTA_STRICT_TOP1_VS_BASE:/{print $2}' mzand-gnu-v37-frozen-residual-report.txt)
          n=$(awk '/^DEV_POSITION_SAMPLES:/{print $2}' mzand-gnu-v37-frozen-residual-report.txt)
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"gnu-v37-frozen-residual/heldout\",\"description\":\"Top1=$t1 d=$delta Top2=$t2 loss=$loss hard=$hard n=$n XG=false\"}" >/dev/null

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gnu-v37-frozen-residual
          path: |
            mzand-gnu-v37-selection.json
            mzand-gnu-v37-selection-report.txt
            mzand-gnu-v37-train-only-residual.joblib
            mzand-gnu-v37-frozen-residual-report.txt
            mzand-gnu-v37-frozen-residual-report.json
            mzand-gnu-v37-frozen-residual.joblib
            mzand-gnu-v37-execution-report.txt
          if-no-files-found: ignore
          retention-days: 30
