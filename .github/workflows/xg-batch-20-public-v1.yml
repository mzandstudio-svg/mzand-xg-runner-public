name: XG Batch 20 Public V2

on:
  workflow_dispatch:
  push:
    branches:
      - xg-batch-20-public-v1
    paths:
      - .github/workflows/xg-batch-20-public-v1.yml
      - data/xgids20.txt

permissions:
  contents: read

jobs:
  xg-batch-20:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append

      - name: Run public proven startup and batch 20
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          $yaml=Get-Content "$env:GITHUB_WORKSPACE\.github\workflows\xg-analyze-level-public-v1.yml" -Raw
          $m=[regex]::Match($yaml,'(?ms)^      - name: Run proven startup and capture Analyze Level\r?\n        shell: powershell\r?\n        run: \|\r?\n(?<script>.*?)(?=^      - name: Upload evidence)')
          if(-not$m.Success){throw 'Could not extract public v1 proven startup'}
          $script=$m.Groups['script'].Value -replace '(?m)^          ',''
          $script=$script.Replace('xg-public-v1-report.txt','xg-batch20-bootstrap-report.txt').Replace('XG public Analyze Level v1','XG Batch 20 Public V2')
          $marker="'XGID_POSITION_READY: True'|Out-File `$report -Append"
          $idx=$script.IndexOf($marker,[System.StringComparison]::Ordinal)
          if($idx-lt0){throw 'v1 XGID_POSITION_READY marker missing'}
          $prefix=$script.Substring(0,$idx+$marker.Length)

          $batch=@'

          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class B20N {
            [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr hMenu);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetMenuString(IntPtr hMenu,uint uIDItem,StringBuilder s,int nMax,uint flags);
            [DllImport("user32.dll")] public static extern IntPtr GetSubMenu(IntPtr hMenu,int nPos);
            [DllImport("user32.dll")] public static extern uint GetMenuItemID(IntPtr hMenu,int nPos);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd,uint Msg,IntPtr wParam,IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@

          function MenuText([IntPtr]$h,[int]$pos){
            $sb=New-Object System.Text.StringBuilder 512
            [void][B20N]::GetMenuString($h,[uint32]$pos,$sb,$sb.Capacity,0x400)
            return [string]$sb.ToString()
          }
          function Norm([string]$s){
            if($null-eq$s){return ''}
            return (($s -replace '&','') -split "`t")[0].Trim()
          }
          function DumpUI([int]$pid,[string]$path){
            $rr=[System.Windows.Automation.AutomationElement]::RootElement
            $all=$rr.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            $L=New-Object 'System.Collections.Generic.List[string]'
            foreach($e in $all){
              try{
                if($e.Current.ProcessId-eq$pid){
                  $r=$e.Current.BoundingRectangle
                  $L.Add("Name=[$($e.Current.Name)] Type=[$($e.Current.ControlType.ProgrammaticName)] Class=[$($e.Current.ClassName)] Id=[$($e.Current.AutomationId)] Rect=[$($r.X),$($r.Y),$($r.Width),$($r.Height)]")
                }
              }catch{}
            }
            $L|Out-File $path -Encoding utf8
          }
          function Shot([string]$path){
            $b=[System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$bmp.Dispose()
          }
          function FindAnalyzeCommand([IntPtr]$hwnd){
            $menu=[B20N]::GetMenu($hwnd)
            if($menu-eq[IntPtr]::Zero){return $null}
            $topCount=[B20N]::GetMenuItemCount($menu)
            $dump=New-Object 'System.Collections.Generic.List[string]'
            for($i=0;$i-lt$topCount;$i++){
              $top=Norm (MenuText $menu $i)
              $sub=[B20N]::GetSubMenu($menu,$i)
              $dump.Add("TOP Index=$i Name=[$top] Child=$sub")
              if($top-eq'Analyze' -and $sub-ne[IntPtr]::Zero){
                $n=[B20N]::GetMenuItemCount($sub)
                $choices=@()
                for($j=0;$j-lt$n;$j++){
                  $raw=Norm (MenuText $sub $j)
                  $id=[B20N]::GetMenuItemID($sub,$j)
                  $child=[B20N]::GetSubMenu($sub,$j)
                  $dump.Add("ANALYZE Index=$j Name=[$raw] Id=$id Child=$child")
                  if($child-eq[IntPtr]::Zero -and $id-ne[uint32]0xFFFFFFFF){
                    if($raw -match '(?i)^Analyze( Position| Current Position)?$' -or
                       ($raw -match '(?i)Analyze' -and $raw -notmatch '(?i)Level|Session|Match|Game|Batch|Mark|Statistics')){
                      $choices += [pscustomobject]@{Name=$raw;Id=$id}
                    }
                  }
                }
                $dump|Out-File "$env:GITHUB_WORKSPACE\analyze-menu.txt" -Encoding utf8
                if($choices.Count-ge1){return $choices[0]}
              }
            }
            $dump|Out-File "$env:GITHUB_WORKSPACE\analyze-menu.txt" -Encoding utf8
            return $null
          }

          $out="$env:GITHUB_WORKSPACE\xg-batch20"
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $xgids=Get-Content "$env:GITHUB_WORKSPACE\data\xgids20.txt"|Where-Object{$_.Trim()}
          if($xgids.Count-ne20){throw "Expected 20 XGIDs, got $($xgids.Count)"}

          $xg.Refresh()
          $hwnd=[IntPtr]$xg.MainWindowHandle
          $cmd=FindAnalyzeCommand $hwnd

          if($null-eq$cmd){
            @{status='ANALYZE_COMMAND_NOT_PROVEN'}|ConvertTo-Json -Compress|Out-File (Join-Path $out 'driver.jsonl')
            DumpUI $xg.Id (Join-Path $out 'frontier-ui.txt')
            Shot (Join-Path $out 'frontier-screen.png')
            throw 'Analyze command could not be identified safely; inspect analyze-menu.txt'
          }

          "ANALYZE_COMMAND=[$($cmd.Name)] ID=$($cmd.Id)"|Out-File (Join-Path $out 'analyze-command.txt')
          Remove-Item (Join-Path $out 'driver.jsonl') -ErrorAction SilentlyContinue

          $k=0
          foreach($xgid in $xgids){
            $k++
            $tag=("{0:D2}" -f $k)
            $dir=Join-Path $out "position_$tag"
            New-Item -ItemType Directory -Force -Path $dir|Out-Null

            Set-Clipboard -Value $xgid
            [B20N]::SetForegroundWindow($hwnd)|Out-Null
            Start-Sleep -Milliseconds 300
            [System.Windows.Forms.SendKeys]::SendWait('^v')
            Start-Sleep 2
            $xg.Refresh()
            $imported=([string]$xg.MainWindowTitle -like '*Position.xgp*')

            $status='IMPORT_FAILED'
            if($imported){
              [void][B20N]::SendMessage($hwnd,0x0111,[IntPtr]([int]$cmd.Id),[IntPtr]::Zero)
              $status='ANALYZE_SENT'
              Start-Sleep 12
            }

            DumpUI $xg.Id (Join-Path $dir 'ui.txt')
            Shot (Join-Path $dir 'screen.png')
            $xg.Refresh()
            [ordered]@{
              index=$k
              xgid=$xgid
              imported=$imported
              analyze_command=$cmd.Name
              status=$status
              title=[string]$xg.MainWindowTitle
            }|ConvertTo-Json -Compress|Out-File (Join-Path $out 'driver.jsonl') -Append
          }

          Get-Process|Where-Object{$_.ProcessName-match'^eXtremeGammon2$|^test3d$'}|Stop-Process -Force -ErrorAction SilentlyContinue
          '@

          $batch=$batch -replace '(?m)^          ',''
          $ps1=Join-Path $env:RUNNER_TEMP 'xg-batch20-public-v2.ps1'
          Set-Content $ps1 ($prefix+$batch) -Encoding UTF8
          & $ps1

      - name: Parse accessible candidate text
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import re, json, csv
          root=Path("xg-batch20")
          root.mkdir(parents=True, exist_ok=True)
          rows=[]
          move_re=re.compile(r'(?i)(Bar/\d+|\d+/(?:\d+|Off))(?:\*|\(\d+\))?(?:\s+(?:Bar/\d+|\d+/(?:\d+|Off))(?:\*|\(\d+\))?){0,3}')
          eq_re=re.compile(r'(?i)(?:eq(?:uity)?\s*[:=]?\s*)([+-]?\d+(?:\.\d+)?)')
          for d in sorted(root.glob("position_*")):
              ui=(d/"ui.txt").read_text(errors="ignore") if (d/"ui.txt").exists() else ""
              found=[]
              for line in ui.splitlines():
                  mm=move_re.search(line); ee=eq_re.search(line)
                  if mm and ee:
                      found.append({"move":mm.group(0),"equity":float(ee.group(1))})
              uniq=[]; seen=set()
              for x in found:
                  key=(x["move"],x["equity"])
                  if key not in seen:
                      seen.add(key); uniq.append(x)
              rows.append({
                  "position":d.name,
                  "candidate_count":len(uniq),
                  "candidates":uniq[:20],
                  "status":"TOP5_ACCESSIBLE" if len(uniq)>=5 else "EXTRACTION_FRONTIER"
              })
          (root/"parsed_candidates.json").write_text(json.dumps(rows,indent=2))
          with (root/"parsed_top5.csv").open("w",newline="") as f:
              w=csv.writer(f); w.writerow(["position","rank","move","equity","status"])
              for r in rows:
                  for i,c in enumerate(r["candidates"][:5],1):
                      w.writerow([r["position"],i,c["move"],c["equity"],r["status"]])
          summary={
              "positions_captured":len(rows),
              "positions_with_accessible_top5":sum(r["status"]=="TOP5_ACCESSIBLE" for r in rows),
              "positions_at_extraction_frontier":sum(r["status"]=="EXTRACTION_FRONTIER" for r in rows),
              "claim":"No XG Top-5 parity claim unless positions_with_accessible_top5 == 20."
          }
          (root/"SUMMARY.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))

      - name: Upload batch-20 artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-batch-20-public-v2
          path: |
            xg-install.log
            xg-batch20-bootstrap-report.txt
            analyze-menu.txt
            xg-batch20/**
          if-no-files-found: warn
          retention-days: 14
