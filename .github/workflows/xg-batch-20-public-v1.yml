name: XG Batch 20 V1

on:
  workflow_dispatch:
  push:
    branches:
      - xg-batch-20-public-v1
    paths:
      - .github/workflows/xg-batch-20-public-v1.yml
      - data/xgids20.txt

permissions:
  contents: read

jobs:
  xg-batch-20:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append

      - name: Build and run batch-20 driver from proven v26 startup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          # Immutable proven historical foundation:
          # v14 startup + v18 wizard continuation + v19 registration handling.
          $v14='e07ccc3fb42d34053f05e09b7f431803b71d16a2'
          $v18='d161e73d23713ed254c6159f30ad77c1e0655672'
          $v19='17d31174af10758b2d06e41803c4d8d06c326a6e'
          foreach($c in @($v14,$v18,$v19)){ git fetch origin $c --depth=1 }

          $y14=(git show "$v14`:.github/workflows/xg-github-ui-bootstrap-v14.yml"|Out-String)
          $m14=[regex]::Match($y14,'(?ms)^      - name: Run v14 exact English UI flow\r?\n        shell: powershell\r?\n        run: \|\r?\n(?<script>.*?)(?=^      - name: Upload v14 evidence)')
          if(-not$m14.Success){throw 'v14 extraction failed'}
          $base=$m14.Groups['script'].Value -replace '(?m)^          ',''
          $base=$base.Replace('xg-ui-bootstrap-v14-report.txt','xg-batch20-bootstrap-report.txt').Replace('XG UI bootstrap v14','XG Batch 20 V1')
          $mark="Click `$next;'BOARD_NEXT_CLICKED: True'|Out-File `$report -Append"
          $idx=$base.IndexOf($mark,[System.StringComparison]::Ordinal)
          if($idx-lt0){throw 'v14 board marker missing'}
          $prefix=$base.Substring(0,$idx)

          $y18=(git show "$v18`:.github/workflows/xg-github-ui-bootstrap-v18-push.yml"|Out-String)
          $m18=[regex]::Match($y18,"(?ms)^          \`$tail=@'\r?\n(?<tail>.*?)(?=^          '@\r?$)")
          if(-not$m18.Success){throw 'v18 continuation extraction failed'}
          $tail18=$m18.Groups['tail'].Value -replace '(?m)^          ',''
          $pm="Start-Sleep 2;Snap 'post-wizard-2s'"
          $pi=$tail18.IndexOf($pm,[System.StringComparison]::Ordinal)
          if($pi-lt0){throw 'v18 post-wizard marker missing'}
          $throughWizard=$tail18.Substring(0,$pi)

          $y19=(git show "$v19`:.github/workflows/xg-github-ui-bootstrap-v19-push.yml"|Out-String)
          $m19=[regex]::Match($y19,"(?ms)^          \`$registration=@'\r?\n(?<reg>.*?)(?=^          '@\r?$)")
          if(-not$m19.Success){throw 'v19 registration extraction failed'}
          $reg=$m19.Groups['reg'].Value -replace '(?m)^          ',''
          $rm="Start-Sleep 2;Snap 'post-registration-2s'"
          $ri=$reg.IndexOf($rm,[System.StringComparison]::Ordinal)
          if($ri-lt0){throw 'v19 post-registration marker missing'}
          $throughRegistration=$reg.Substring(0,$ri)

          $batch=@'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class B20N {
            [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr hMenu);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetMenuString(IntPtr hMenu,uint uIDItem,StringBuilder s,int nMax,uint flags);
            [DllImport("user32.dll")] public static extern IntPtr GetSubMenu(IntPtr hMenu,int nPos);
            [DllImport("user32.dll")] public static extern uint GetMenuItemID(IntPtr hMenu,int nPos);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd,uint Msg,IntPtr wParam,IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@

          function MenuText([IntPtr]$h,[int]$pos){
            $sb=New-Object System.Text.StringBuilder 512
            [void][B20N]::GetMenuString($h,[uint32]$pos,$sb,$sb.Capacity,0x400)
            return [string]$sb.ToString()
          }
          function Norm([string]$s){
            if($null-eq$s){return ''}
            return (($s -replace '&','') -split "`t")[0].Trim()
          }
          function Shot([string]$path){
            $b=[System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$bmp.Dispose()
          }
          function DumpUI([int]$pid,[string]$path){
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $all=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            $L=New-Object 'System.Collections.Generic.List[string]'
            foreach($e in $all){
              try{
                if($e.Current.ProcessId-eq$pid){
                  $r=$e.Current.BoundingRectangle
                  $L.Add("Name=[$($e.Current.Name)] Type=[$($e.Current.ControlType.ProgrammaticName)] Class=[$($e.Current.ClassName)] Id=[$($e.Current.AutomationId)] Rect=[$($r.X),$($r.Y),$($r.Width),$($r.Height)]")
                }
              }catch{}
            }
            $L|Out-File $path -Encoding utf8
          }
          function FindAnalyzeCommand([IntPtr]$hwnd){
            $menu=[B20N]::GetMenu($hwnd)
            if($menu-eq[IntPtr]::Zero){return $null}
            $topCount=[B20N]::GetMenuItemCount($menu)
            for($i=0;$i-lt$topCount;$i++){
              $name=Norm (MenuText $menu $i)
              if($name-eq'Analyze'){
                $sub=[B20N]::GetSubMenu($menu,$i)
                $n=[B20N]::GetMenuItemCount($sub)
                $dump=New-Object 'System.Collections.Generic.List[string]'
                $candidates=@()
                for($j=0;$j-lt$n;$j++){
                  $raw=Norm (MenuText $sub $j)
                  $id=[B20N]::GetMenuItemID($sub,$j)
                  $child=[B20N]::GetSubMenu($sub,$j)
                  $dump.Add("Index=$j Name=[$raw] Id=$id Child=$child")
                  if($child-eq[IntPtr]::Zero -and $id-ne[uint32]0xFFFFFFFF){
                    if($raw -match '(?i)^Analyze( Position| Current Position)?$' -or
                       ($raw -match '(?i)Analyze' -and $raw -notmatch '(?i)Level|Session|Match|Game|Batch|Mark')){
                      $candidates += [pscustomobject]@{Name=$raw;Id=$id}
                    }
                  }
                }
                $dump|Out-File "$env:GITHUB_WORKSPACE\analyze-menu.txt" -Encoding utf8
                if($candidates.Count-ge1){return $candidates[0]}
              }
            }
            return $null
          }

          # Dismiss Quick Start using stable v26 behavior.
          $startDlg=$null;$tip=$null
          for($i=0;$i-lt60;$i++){
            Start-Sleep -Milliseconds 500
            $startDlg=DescWin 'eXtreme Gammon' 'TStartDlg' 'eXtremeGammon2'
            if($startDlg){$tip=FindNC $startDlg 'Show Tip of the day at startup' 'TCheckBox';if($tip){break}}
          }
          if($startDlg){
            [N]::SetForegroundWindow([IntPtr]$startDlg.Current.NativeWindowHandle)|Out-Null
            Start-Sleep -Milliseconds 200
            [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
            Start-Sleep 1
          }

          $out="$env:GITHUB_WORKSPACE\xg-batch20"
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $xgids=Get-Content "$env:GITHUB_WORKSPACE\data\xgids20.txt"|Where-Object{$_.Trim()}
          if($xgids.Count-ne20){throw "Expected 20 XGIDs, got $($xgids.Count)"}

          $driverReport=Join-Path $out 'driver.jsonl'
          Remove-Item $driverReport -ErrorAction SilentlyContinue

          $xg.Refresh()
          $hwnd=[IntPtr]$xg.MainWindowHandle
          $cmd=FindAnalyzeCommand $hwnd
          if($null-eq$cmd){
            @{status='ANALYZE_COMMAND_NOT_PROVEN';menu_dump='analyze-menu.txt'}|ConvertTo-Json -Compress|Out-File $driverReport -Append
            throw 'Analyze command could not be identified safely; see analyze-menu.txt'
          }

          "ANALYZE_COMMAND=[$($cmd.Name)] ID=$($cmd.Id)"|Out-File "$out\analyze-command.txt"

          $k=0
          foreach($xgid in $xgids){
            $k++
            $tag=("{0:D2}" -f $k)
            $dir=Join-Path $out "position_$tag"
            New-Item -ItemType Directory -Force -Path $dir|Out-Null

            Set-Clipboard -Value $xgid
            [B20N]::SetForegroundWindow($hwnd)|Out-Null
            Start-Sleep -Milliseconds 250
            [System.Windows.Forms.SendKeys]::SendWait('^v')
            Start-Sleep 2
            $xg.Refresh()
            $titleBefore=[string]$xg.MainWindowTitle
            $imported=($titleBefore -like '*Position.xgp*')

            $status='IMPORTED'
            if($imported){
              [void][B20N]::SendMessage($hwnd,0x0111,[IntPtr]([int]$cmd.Id),[IntPtr]::Zero)
              $status='ANALYZE_SENT'
              Start-Sleep 12
            }else{
              $status='IMPORT_FAILED'
            }

            DumpUI $xg.Id (Join-Path $dir 'ui.txt')
            Shot (Join-Path $dir 'screen.png')
            $xg.Refresh()
            $rec=[ordered]@{
              index=$k
              xgid=$xgid
              imported=$imported
              analyze_command=$cmd.Name
              status=$status
              title=[string]$xg.MainWindowTitle
            }
            $rec|ConvertTo-Json -Compress|Out-File $driverReport -Append
          }

          Get-Process|Where-Object{$_.ProcessName-match'^eXtremeGammon2$|^test3d$'}|Stop-Process -Force -ErrorAction SilentlyContinue
          '@
          $batch=$batch -replace '(?m)^          ',''

          $ps1=Join-Path $env:RUNNER_TEMP 'xg-batch20-v1.ps1'
          Set-Content $ps1 ($prefix+$throughWizard+$throughRegistration+$batch) -Encoding UTF8
          & $ps1

      - name: Parse accessible candidate text
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import re, json, csv
          root=Path("xg-batch20")
          rows=[]
          # Conservative parser: only emits rows when an accessible UI text line
          # contains an equity-like token and a backgammon move pattern.
          move_re=re.compile(r'(?i)(Bar/\d+|\d+/(?:\d+|Off))(?:\*|\(\d+\))?(?:\s+(?:Bar/\d+|\d+/(?:\d+|Off))(?:\*|\(\d+\))?){0,3}')
          eq_re=re.compile(r'(?i)(?:eq(?:uity)?\s*[:=]?\s*)([+-]?\d+(?:\.\d+)?)')
          for d in sorted(root.glob("position_*")):
              ui=(d/"ui.txt").read_text(errors="ignore") if (d/"ui.txt").exists() else ""
              found=[]
              for line in ui.splitlines():
                  mm=move_re.search(line); ee=eq_re.search(line)
                  if mm and ee:
                      found.append({"move":mm.group(0),"equity":float(ee.group(1))})
              # de-dup exact move/equity pairs
              uniq=[]
              seen=set()
              for x in found:
                  key=(x["move"],x["equity"])
                  if key not in seen:
                      seen.add(key); uniq.append(x)
              rec={"position":d.name,"candidate_count":len(uniq),"candidates":uniq[:20],
                   "status":"TOP5_ACCESSIBLE" if len(uniq)>=5 else "EXTRACTION_FRONTIER"}
              rows.append(rec)
          (root/"parsed_candidates.json").write_text(json.dumps(rows,indent=2))
          with (root/"parsed_top5.csv").open("w",newline="") as f:
              w=csv.writer(f);w.writerow(["position","rank","move","equity","status"])
              for r in rows:
                  for i,c in enumerate(r["candidates"][:5],1):
                      w.writerow([r["position"],i,c["move"],c["equity"],r["status"]])
          summary={
              "positions":len(rows),
              "positions_with_accessible_top5":sum(r["status"]=="TOP5_ACCESSIBLE" for r in rows),
              "positions_at_extraction_frontier":sum(r["status"]=="EXTRACTION_FRONTIER" for r in rows),
              "claim":"No XG Top-5 parity claim unless positions_with_accessible_top5 == 20."
          }
          (root/"SUMMARY.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))

      - name: Upload batch-20 artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-batch-20-v1
          path: |
            xg-install.log
            xg-batch20-bootstrap-report.txt
            analyze-menu.txt
            xg-batch20/**
          if-no-files-found: warn
          retention-days: 14
