name: XG Development Teacher Corpus

on:
  push:
    branches: [xg-teacher-parallel-v16]
    paths:
      - .github/workflows/xg-development-teacher-corpus.yml
      - scripts/build_development_teacher_corpus.py
      - references/*teacher.json
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build-development-teacher-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build training-ready development labels
        run: |
          mkdir -p development-teacher-corpus
          python scripts/build_development_teacher_corpus.py references development-teacher-corpus | tee development-teacher-corpus/build-summary.txt

      - name: Upload development teacher corpus
        uses: actions/upload-artifact@v7
        with:
          name: xg-development-teacher-corpus
          path: development-teacher-corpus
          retention-days: 30

      - name: Publish corpus status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          d=json.load(open('development-teacher-corpus/teacher_corpus_summary.json'))
          desc=f"dev teachers={d['teacher_position_count']}; candidates={d['candidate_row_count']}; decisive-pairs={d['decisive_pair_count']}"
          payload=json.dumps({'state':'success','context':'xg-dev/teacher-corpus','description':desc}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GATE_SHA']}",data=payload,method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          urllib.request.urlopen(req).read()
          PY
