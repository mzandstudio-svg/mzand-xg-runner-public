name: XG Analyze Move Context Public v9

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/xg-analyze-move-context-public-v9.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  capture-context:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Publish runner and run id
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          Post 'xg-public-v9/runner-start' 'pending' 'Public Windows runner started v9'
          Post "xg-public-v9/run-$env:GITHUB_RUN_ID" 'success' "workflow run id=$env:GITHUB_RUN_ID"

      - uses: actions/checkout@v4

      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append

      - name: Reach proven XGID position
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-analyze-win32-v3.ps1

      - name: Analyze position then capture best move context
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: ./scripts/xg-capture-move-context-v9.ps1

      - name: Upload v9 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xg-analyze-move-context-public-v9
          path: |
            xg-install.log
            xg-public-v3-report.txt
            xg-v8-report.txt
            xg-v9-report.txt
            xg-v8-position-analysis-20s.png
            xg-v9-best-move-context.png
            xg-*.png
            xg-*-ui.txt
            xg-*-processes.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish final status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          $ok=Test-Path "$env:GITHUB_WORKSPACE\xg-v9-best-move-context.png"
          $state=if($ok){'success'}else{'failure'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $payload=@{state=$state;context='xg-public-v9/artifact';description="best move context captured=$ok"}|ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
          $payload=@{state='success';context='xg-public-v9/runner-start';description='runner reached final status'}|ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null
