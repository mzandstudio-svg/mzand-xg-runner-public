name: R59 XG Native Network Access Trace

on:
  push:
    branches: [r35-xg-1ply-cube-oracle]
    paths:
      - .github/workflows/r59-xg-network-access-trace.yml
      - scripts/r59-prepare-checker-xgid.py
      - scripts/r59-xg-network-access-trace.py
      - scripts/r35-proven-startup.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install official XG2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $installer -UseBasicParsing
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-ne0){throw "XG install failed: $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $exe)){throw "XG executable missing: $exe"}
          "XG_EXE=$exe" | Out-File $env:GITHUB_ENV -Append
          "xgexe=$exe" | Out-File $env:GITHUB_ENV -Append

      - name: Install reverse-engineering dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ag=Join-Path $env:RUNNER_TEMP 'AnkiGammon'
          git clone --depth 1 https://github.com/Deinonychus999/AnkiGammon.git $ag
          python -m pip install --upgrade pip
          python -m pip install -e $ag
          python -m pip install capstone pywinauto pyautogui pymem

      - name: Reach proven unpacked XG2 instance
        shell: powershell
        run: ./scripts/r35-proven-startup.ps1

      - name: Load deterministic checker-analysis position
        shell: powershell
        run: python ./scripts/r59-prepare-checker-xgid.py

      - name: Trace native model weight reads
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $xg=Get-Process eXtremeGammon2 -ErrorAction Stop | Select-Object -First 1
          $out=Join-Path $env:GITHUB_WORKSPACE 'r59-network-stdout.txt'
          $err=Join-Path $env:GITHUB_WORKSPACE 'r59-network-stderr.txt'
          $args=@(
            './scripts/r59-xg-network-access-trace.py',
            '--pid', "$($xg.Id)",
            '--xg-exe', "$env:XG_EXE",
            '--outdir', './r59-network-trace',
            '--seconds', '55',
            '--max-hits', '24'
          )
          $p=Start-Process python -ArgumentList $args -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try { Wait-Process -Id $p.Id -Timeout 80 -ErrorAction Stop }
          catch {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if(Test-Path $out){Get-Content $out}
            if(Test-Path $err){Get-Content $err}
            throw 'R59 trace watchdog timeout'
          }
          $p.Refresh()
          if(Test-Path $out){Get-Content $out}
          if(Test-Path $err){Get-Content $err}
          if(Test-Path './r59-network-trace/r59-summary.txt'){Get-Content './r59-network-trace/r59-summary.txt'}
          "R59_TRACE_RC=$($p.ExitCode)" | Out-File ./r59-network-trace/r59-run-result.txt
          if($p.ExitCode-ne0){throw "R59 trace failed rc=$($p.ExitCode)"}

      - name: Upload R59 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r59-xg-network-access-trace
          path: |
            r59-network-trace/*
            r59-network-stdout.txt
            r59-network-stderr.txt
            r35-proven-startup-summary.txt
            r35-proven-startup-report.txt
          if-no-files-found: warn
          retention-days: 14
