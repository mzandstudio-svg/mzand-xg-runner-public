name: Package MZand Public Snapshot v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-mzand-public-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Publish package run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d "{\"state\":\"pending\",\"context\":\"mzand-package/run-$GITHUB_RUN_ID\",\"description\":\"packaging code + v3 model + GNU data\"}" >/dev/null

      - uses: actions/checkout@v4

      - name: Build complete package tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p package/code package/model package/data
          rsync -a --exclude '.git' --exclude 'package' ./ package/code/

          # Latest successful full v3 model/evidence.
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' repos/$GITHUB_REPOSITORY/actions/artifacts/9059908442/zip > /tmp/v3-model.zip
          unzip -q /tmp/v3-model.zip -d package/model
          test -s package/model/mzand-gnu-v3.joblib
          test -s package/model/gnu-v3-gate-report.txt

          # Full v3 non-pristine GNU teacher corpus: eight independent shards.
          ids=(9059638209 9059638198 9059633841 9059648661 9059640383 9059647478 9059647517 9059630405)
          for i in 0 1 2 3 4 5 6 7; do
            mkdir -p "package/data/shard-$i"
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$GITHUB_REPOSITORY/actions/artifacts/${ids[$i]}/zip" > "/tmp/shard-$i.zip"
            unzip -q "/tmp/shard-$i.zip" -d "package/data/shard-$i"
          done
          cat package/data/shard-*/gnu-teacher-batch-v3-*.jsonl > package/data/gnu-teacher-batch-v3-combined.jsonl
          test "$(wc -l < package/data/gnu-teacher-batch-v3-combined.jsonl)" -eq 9099

          cat > package/PACKAGE_INFO.txt <<EOF
          PACKAGE: MZand complete public code + latest successful model + latest full GNU v3 corpus
          SOURCE_REPOSITORY: $GITHUB_REPOSITORY
          SOURCE_COMMIT: $GITHUB_SHA
          SOURCE_BRANCH: $GITHUB_REF_NAME
          LATEST_SUCCESSFUL_MODEL: mzand-gnu-v3.joblib
          MODEL_SOURCE_RUN: 31380236754
          MODEL_SOURCE_ARTIFACT_ID: 9059908442
          MODEL_SOURCE_COMMIT: a4bd1aa8bfd6294d123c029b488403490c3f933b
          MODEL_DEV_STRICT_TOP1: 0.709224
          TRAIN_POSITION_SAMPLES: 5457
          TUNE_POSITION_SAMPLES: 1819
          DEV_POSITION_SAMPLES: 1823
          DATA_TOTAL_POSITIONS: 9099
          DATA_SHARDS: 8
          MODEL_METRIC_SCOPE: GNU Top-N rerank only; not full legal candidate coverage
          PRISTINE_DATA_USED: False
          XG_LABELS_USED: False
          NOTE: v4 source is included, but v4 has not produced a newer successful model artifact yet.
          EOF

          cat > package/README_PACKAGE.txt <<'EOF'
          Contents:
          - code/: complete public repository snapshot, including .github workflows
          - model/: latest successful mzand-gnu-v3.joblib and reports
          - data/: all eight GNU v3 non-pristine development shards plus combined JSONL (9099 positions)
          - PACKAGE_INFO.txt: exact provenance and measured metrics

          No private repository content and no pristine-blind data are included.
          EOF

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: mzand-complete-code-model-data
          path: package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Publish final package status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure; [ "$JOB_STATUS" = success ] && state=success
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d "{\"state\":\"$state\",\"context\":\"mzand-package/job\",\"description\":\"package job=$JOB_STATUS\"}" >/dev/null
