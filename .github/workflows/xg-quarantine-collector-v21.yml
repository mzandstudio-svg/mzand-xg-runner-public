name: XG Quarantine Rollout Collector v21 Safe Completion

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-quarantine-collector-v21.yml
      - scripts/parse_xg_position_export_v21.py
      - scripts/xg-top5-rollout-v21-export.ps1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  # Pilot with one independent non-pristine position. Scale only after one label
  # has verified fresh-current-rollout provenance end to end.
  XGQ_TARGET: '1'
  XGQ_GAMES: '3'
  XGQ_TURNS: '8'
  XGQ_SEED_BASE: '930260811'
  XGQ_MAX_HINTS: '8'

jobs:
  generate:
    name: Generate one independent non-pristine pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regression-test Unlimited Game parser and Book provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > parser-v21-fixture.txt <<'EOF'
          XGID=-aa---E-C---dEa--c-e----B-:0:0:1:12:0:0:0:0:10

          X:Player 1   O:Player 2
          Score is X:0 O:0. Unlimited Game
          Pip count  X: 167  O: 164 X-O: 0-0
          Cube: 1
          X to play 12

              1. Book¹       24/21                        eq:-0.157
                Player:   46.56% (G:11.21% B:0.47%)
                Opponent: 53.44% (G:14.86% B:0.57%)

          ¹Generated historically
            3589 Games rolled with Variance Reduction.
            Moves: 3-ply, cube decisions: XG Roller

          eXtreme Gammon Version: 2.10
          EOF
          python scripts/parse_xg_position_export_v21.py parser-v21-fixture.txt parser-v21-fixture.json
          python - <<'PY'
          import json
          d=json.load(open('parser-v21-fixture.json',encoding='utf-8'))
          assert d['score']['unlimited_game'] is True
          assert d['score']['match_length'] is None
          assert d['candidates'][0]['analysis_method']=='Book', d['candidates'][0]
          print('PARSER_V21_UNLIMITED_GAME: True')
          print('PARSER_V21_HISTORICAL_BOOK_IS_NOT_FRESH_ROLLOUT: True')
          PY
      - name: Install GNU screening prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate quarantined hard-position pilot
        shell: bash
        run: node scripts/generate-xg-quarantine-pool-v20.mjs
      - name: Enforce quarantine provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SPLIT: xg_quarantine$' xg-quarantine-v20-report.txt
          grep -q '^QUARANTINED: True$' xg-quarantine-v20-report.txt
          grep -q '^TRAINING_ELIGIBLE: False$' xg-quarantine-v20-report.txt
          grep -q '^SEALED_DEV_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^XG_LABELS_USED_FOR_TRAINING: False$' xg-quarantine-v20-report.txt
      - name: Publish dynamic rollout matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(cat xg-quarantine-v20-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v21-pilot-pool
          path: |
            xg-quarantine-v20-pool.json
            xg-quarantine-v20-matrix.json
            xg-quarantine-v20-report.txt
            parser-v21-fixture.json
          retention-days: 30

  rollout:
    name: XG fresh 1296 pilot ${{ matrix.id }}
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      XGQ_ID: ${{ matrix.id }}
      XGID_INPUT: ${{ matrix.xgid }}
      XGQ_SEED: ${{ matrix.seed }}
      XGQ_GNU_MARGIN: ${{ matrix.gnu_margin }}
    steps:
      - name: Publish collector start
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          Post "xg-quarantine-v21/$env:XGQ_ID" 'pending' "fresh 1296 rollout pilot started; quarantine only"
      - uses: actions/checkout@v4
      - name: Install XG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $i=Join-Path $env:RUNNER_TEMP 'xg2install.exe'
          Invoke-WebRequest 'https://www.extremegammon.com/xg2install.exe' -OutFile $i -UseBasicParsing
          $l=Join-Path $env:RUNNER_TEMP 'xg-install.log'
          $p=Start-Process $i -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$l") -Wait -PassThru
          if(Test-Path $l){Copy-Item $l "$env:GITHUB_WORKSPACE\xg-install.log"}
          if($p.ExitCode-ne0){throw "Install failed $($p.ExitCode)"}
          $e='C:\Program Files (x86)\eXtreme Gammon 2\eXtremeGammon2.exe'
          if(-not(Test-Path $e)){throw 'XG executable missing'}
          "xgexe=$e"|Out-File $env:GITHUB_ENV -Append
      - name: Load generated non-pristine XGID
        shell: powershell
        run: ./scripts/xg-reach-dynamic-xgid-v20.ps1
      - name: Run completion-safe top-five 1296 rollout
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          ./scripts/xg-top5-rollout-v21-export.ps1
          if($LASTEXITCODE -ne 0){throw "XG v21 rollout exporter exit code $LASTEXITCODE"}
      - name: Parse and quarantine only fresh rollout provenance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw="xg-quarantine-$env:XGQ_ID-parsed.json"
          $final="xg-quarantine-$env:XGQ_ID-label.json"
          python ./scripts/parse_xg_position_export_v21.py ./xg-top5-v21-export.txt $raw
          if($LASTEXITCODE -ne 0){throw "XG export parser failed with exit code $LASTEXITCODE"}
          python ./scripts/quarantine-xg-label-v20.py $raw $final --expected-xgid "$env:XGID_INPUT" --id "$env:XGQ_ID" --seed "$env:XGQ_SEED" --gnu-margin "$env:XGQ_GNU_MARGIN"
          if($LASTEXITCODE -ne 0){throw "XG quarantine validator failed with exit code $LASTEXITCODE"}
      - name: Publish verified quarantine label
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          $d=Get-Content "xg-quarantine-$env:XGQ_ID-label.json" -Raw|ConvertFrom-Json
          $n=[int]$d.quarantine.rollout_candidate_count
          Post "xg-quarantine-v21/$env:XGQ_ID" 'success' "fresh current-run rollout quarantine verified; rollout candidates=$n"
      - name: Publish terminal collector status
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          function Post([string]$context,[string]$state,[string]$description){$payload=@{state=$state;context=$context;description=$description}|ConvertTo-Json -Compress;$headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GATE_SHA" -Headers $headers -Body $payload -ContentType 'application/json'|Out-Null}
          $state=$(if($env:JOB_STATUS-eq'success'){'success'}else{'failure'})
          Post "xg-quarantine-v21/$env:XGQ_ID" $state "terminal job status=$env:JOB_STATUS; no stale pending context"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xg-quarantine-v21-${{ matrix.id }}
          path: |
            xg-quarantine-${{ matrix.id }}-label.json
            xg-quarantine-${{ matrix.id }}-label.report.txt
            xg-quarantine-${{ matrix.id }}-parsed.json
            xg-top5-v21-export.txt
            xg-top5-v11-report.txt
            xg-reach-dynamic-v20-report.txt
            xg-install.log
            xg-top5-v11-final.png
            xg-top5-v11-prompt-before-ok.png
            xg-top5-v11-final-ui.txt
          if-no-files-found: ignore
          retention-days: 30

  manifest:
    name: Build quarantine-only pilot manifest
    if: always()
    needs: [generate, rollout]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xg-quarantine-v21-*
          path: collected
      - name: Build safe manifest without training integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('collected').rglob('xg-quarantine-*-label.json'))
          labels=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              q=d.get('quarantine') or {}
              assert q.get('quarantined') is True
              assert q.get('training_eligible') is False
              assert q.get('pristine') is False
              assert q.get('sealed_dev') is False
              assert q.get('xg_labels_used_for_training') is False
              assert q.get('complete_rollout_provenance') is True
              labels.append(d)
          Path('xg-quarantine-v21-labels.jsonl').write_text(''.join(json.dumps(x,separators=(',',':'))+'\n' for x in labels),encoding='utf-8')
          Path('xg-quarantine-v21-manifest.txt').write_text('\n'.join([
              'CORPUS: XG_QUARANTINE_V21_PILOT',
              f'VERIFIED_FRESH_ROLLOUT_LABELS: {len(labels)}',
              'QUARANTINED: True',
              'TRAINING_ELIGIBLE: False',
              'SEALED_DEV_USED: False',
              'PRISTINE_DATA_USED: False',
              'XG_LABELS_USED_FOR_TRAINING: False',
          ])+'\n',encoding='utf-8')
          print(Path('xg-quarantine-v21-manifest.txt').read_text())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-v21-pilot-manifest
          path: |
            xg-quarantine-v21-labels.jsonl
            xg-quarantine-v21-manifest.txt
          retention-days: 30
