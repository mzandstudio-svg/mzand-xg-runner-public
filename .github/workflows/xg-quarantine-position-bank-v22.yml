name: XG Quarantine Position Bank v22

on:
  push:
    branches: [mzand-xg-public-runner-fix]
    paths:
      - .github/workflows/xg-quarantine-position-bank-v22.yml
      - scripts/generate-xg-quarantine-pool-v20.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  XGQ_TARGET: '16'
  XGQ_GAMES: '8'
  XGQ_TURNS: '10'
  XGQ_SEED_BASE: '930260811'
  XGQ_MAX_HINTS: '8'

jobs:
  build-bank:
    name: Build 16-position independent non-pristine quarantine bank
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GNU screening prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev
          npm init -y
          npm install --no-audit --no-fund @nodots/backgammon-ai@1.1.2 @nodots/backgammon-core@1.0.0
      - name: Generate deterministic non-pristine quarantine positions
        shell: bash
        run: node scripts/generate-xg-quarantine-pool-v20.mjs
      - name: Enforce isolation and enrich diversity metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SPLIT: xg_quarantine$' xg-quarantine-v20-report.txt
          grep -q '^QUARANTINED: True$' xg-quarantine-v20-report.txt
          grep -q '^TRAINING_ELIGIBLE: False$' xg-quarantine-v20-report.txt
          grep -q '^SEALED_DEV_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^PRISTINE_DATA_USED: False$' xg-quarantine-v20-report.txt
          grep -q '^XG_LABELS_USED_FOR_TRAINING: False$' xg-quarantine-v20-report.txt
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          src=Path('xg-quarantine-v20-pool.json')
          d=json.loads(src.read_text(encoding='utf-8'))
          pos=d['positions']
          assert len(pos) >= 16, len(pos)
          seen=set()
          phase_counts=Counter()
          margin_counts=Counter()
          dice_counts=Counter()

          def phase(p):
              b=p['board']
              own=b['own']; opp=b['opp']
              bar_own=int(b.get('barOwn',0)); bar_opp=int(b.get('barOpp',0))
              off_own=int(b.get('offOwn',0)); off_opp=int(b.get('offOpp',0))
              if bar_own or bar_opp:
                  return 'bar'
              if off_own or off_opp:
                  return 'bearoff_like'
              own_pts=[i+1 for i,n in enumerate(own) if n]
              opp_pts=[i+1 for i,n in enumerate(opp) if n]
              if own_pts and opp_pts and max(own_pts) < min(opp_pts):
                  return 'race_like'
              anchors=sum(1 for i,n in enumerate(own) if i>=18 and n>=2)
              deep_opp=sum(1 for i,n in enumerate(opp) if i<=5 and n>=2)
              if anchors>=2 and deep_opp>=2:
                  return 'backgame_like'
              return 'contact'

          for p in pos:
              assert p['split']=='xg_quarantine'
              assert p['quarantined'] is True
              assert p['trainingEligible'] is False
              assert p['pristine'] is False
              assert p['sealedDev'] is False
              x=p['xgid']
              assert x not in seen, x
              seen.add(x)
              ph=phase(p)
              margin=float(p['gnuScreening']['margin'])
              if margin < 0.005: mb='<0.005'
              elif margin < 0.015: mb='0.005-0.015'
              elif margin < 0.03: mb='0.015-0.03'
              else: mb='>=0.03'
              dice=''.join(map(str,p['dice']))
              phase_counts[ph]+=1
              margin_counts[mb]+=1
              dice_counts[dice]+=1
              p['readiness']={
                  'phase_bucket':ph,
                  'gnu_margin_bucket':mb,
                  'rollout_priority_score':round(1.0/(0.001+max(0.0,margin)),6),
                  'training_eligible':False,
              }

          out={
              'schema':'mzand.xg.quarantine-position-bank.v22',
              'split':'xg_quarantine',
              'quarantined':True,
              'training_eligible':False,
              'pristine':False,
              'sealed_dev':False,
              'xg_labels_used_for_training':False,
              'position_count':len(pos),
              'unique_xgid_count':len(seen),
              'duplicate_count':len(pos)-len(seen),
              'phase_counts':dict(sorted(phase_counts.items())),
              'gnu_margin_counts':dict(sorted(margin_counts.items())),
              'distinct_dice':len(dice_counts),
              'dice_counts':dict(sorted(dice_counts.items())),
              'positions':pos,
          }
          Path('xg-quarantine-position-bank-v22.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          report=[
              'BANK: XG_QUARANTINE_POSITION_BANK_V22',
              f"POSITIONS: {out['position_count']}",
              f"UNIQUE_XGIDS: {out['unique_xgid_count']}",
              f"DUPLICATES: {out['duplicate_count']}",
              f"DISTINCT_DICE: {out['distinct_dice']}",
              'PHASE_COUNTS: '+json.dumps(out['phase_counts'],sort_keys=True),
              'GNU_MARGIN_COUNTS: '+json.dumps(out['gnu_margin_counts'],sort_keys=True),
              'SPLIT: xg_quarantine',
              'QUARANTINED: True',
              'TRAINING_ELIGIBLE: False',
              'SEALED_DEV_USED: False',
              'PRISTINE_DATA_USED: False',
              'XG_LABELS_USED_FOR_TRAINING: False',
          ]
          Path('xg-quarantine-position-bank-v22-report.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xg-quarantine-position-bank-v22
          path: |
            xg-quarantine-position-bank-v22.json
            xg-quarantine-position-bank-v22-report.txt
            xg-quarantine-v20-pool.json
            xg-quarantine-v20-matrix.json
            xg-quarantine-v20-report.txt
          retention-days: 90
